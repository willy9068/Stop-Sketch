<script>
// data.js
// 스톱 앤 스케치 — 물방울 무리 시험판 (2026-10-20). 모든 수치는 이 파일 한 곳에 모은다.
// 기존 데모(stopsketch/)와 따로 돌아간다. 이미지는 기존 데모의 stopsketch/assets 를 같이 쓴다.
// 단위: 거리 px, 시간은 따로 적지 않으면 ms. 속도는 "1스텝(1/60초)당 px".
var G = G || {};

G.DATA = {
  version: 1,
  seed: 20261020,

  view: { w: 1280, h: 720 },

  loop: { stepMs: 1000 / 60, maxStepsPerFrame: 5 },

  physics: {
    gravityY: 1,           // Matter.js 기본 중력 배율
    failY: 1100            // 가장 낮은 땅 600 기준, 이 아래로 떨어지면 죽음 (가장 낮은 땅에 맞춰 함께 내려감)
  },

  // 물방울 (사용자 결정 2026-10-20): 주인공 1 + 길 위·우리 안에 잠든 작은 물방울. 모두 레밍즈처럼 자동으로 걷고 벽에서 뒤로 돎
  //   작은 물방울은 크기만 다름. 물방울끼리는 서로 통과
  drop: {
    heroRadius: 22,
    smallRadius: 13,
    runSpeed: 5.2,         // 걷는 속도 기본값 (스텝당 px). 스테이지마다 levels.js drops.heroSpeed / smallSpeed 로 바꿈 (레벨 툴)
    collide: false,        // 물방울끼리 부딪히는가 기본값 (사용자 결정 2026-10-20: 서로 통과). 스테이지마다 drops.collide 로 켬 (레벨 툴)
    accel: 0.12,           // 바닥에 있을 때 목표 속도로 다가가는 비율
    climbAccel: 0.5,       // 오르막·턱에서 바닥 면을 따라가는 속도를 맞추는 비율 (크면 멈칫 없이 타고 오름)
    groundCheck: 0.45,     // 접촉점이 중심보다 반지름 × 이 값 이상 아래면 "바닥"
    stepUp: 16,            // 이 높이 이하의 턱은 넘어감 (작은 물방울은 반지름 비율로 줄이되 stepUpMin 보다 작지 않게)
    stepUpMin: 12,         //   쓰러진 배치된 선(두께 10)을 작은 물방울도 넘어가게
    turnCooldownMs: 250,
    wakeReach: 1.4,        // 잠든 물방울과 걷는 물방울 중심 거리가 (두 반지름 합 × 이 값) 안이면 깨어나 합류
    pinchMs: 120,          // 위·아래로 이만큼 끼어 있으면 가까운 옆으로 밀어냄 (끼여서 죽지 않음, 사용자 결정 2026-10-20)
    density: 0.0006,       // 선보다 훨씬 가볍게 (선이 물방울에 거의 밀리지 않게)
    // 대열 (사용자 결정 2026-10-20): 주인공이 깨운 물방울은 오리 새끼처럼 주인공이 지나간 길(발자국)을 그대로 따라옴.
    //   주인공이 지나간 뒤 생긴 물리 영향(새로 그린 선·떨어지는 선에 밀림, 발밑 바닥이 사라짐)을 받으면 이탈 → 혼자 걷기.
    //   혼자 걷는 물방울이 주인공에 닿으면 다시 대열 끝에 붙음. 켬/끔·간격은 스테이지마다 drops.follow / drops.gap (레벨 툴)
    follow: {
      on: true,
      gap: 32,             // 대열 간격 (발자국 길이 px)
      catchUp: 0.25,       // 자리가 앞으로 당겨질 때 따라붙는 비율 (스텝당)
      breakDist: 12,       // 한 스텝에 이만큼 밀리면 바로 이탈
      nudgeDist: 3,        //   이만큼 밀린 상태가
      nudgeSteps: 6,       //   이 스텝 동안 이어지면 이탈 (떨어지는 선에 천천히 밀릴 때)
      unsupportedSteps: 12,// 주인공은 바닥에 있었는데 대열 물방울 발밑에 바닥이 이 스텝 동안 없으면 이탈 (다리가 떨어짐)
      supportTol: 16,       //   발밑 바닥 찾는 거리 (반지름 + 이 값)
      wakeMs: 500,         // 깨어나는 모션 (기지개·흔들기)
      hopMs: 400,          // 대열 끝자리로 통 튀어 붙는 시간
      hopHeight: 70,
      rejoinReach: 1.15,   // 혼자 걷는 물방울과 주인공 중심 거리가 (두 반지름 합 × 이 값) 안이면 다시 합류
      rejoinCdMs: 600      //   단, 바닥에 선 채로, 이탈하고 이만큼 지난 뒤에만 (사용자 요청 2026-10-20: 다리를 지우면 공중에서 다시 붙어 따라가던 문제)
    }
  },

  // 잉크병에 들어가기 (사용자 요청 2026-10-20): 닿은 순서대로 병 앞에 줄 서고, 맨 앞부터 gapMs 마다 하나씩 enterMs 동안 입구로 뛰어듦.
  //   병은 들어간 만큼 jarFadePerSec 속도로 서서히 밝아짐
  goalEnter: { gapMs: 420, enterMs: 650, hopHeight: 70, endScale: 0.35, spacing: 26, slide: 0.15, jarFadePerSec: 0.35, resultDelayMs: 1000 },   // resultDelayMs: 병이 다 밝아진 뒤 결과 창까지 (사용자 요청 2026-10-20)

  // 물들기 (사용자 결정 2026-10-20): 색 선(노랑 제외, 검정 포함)을 밟고 있으면 물방울이 그 색으로 점차 물듦(다른 색이면 섞이며 넘어감).
  //   내려와도 holdMs 동안 유지, 그 뒤 fadeMs 에 걸쳐 원래 하늘색으로. 잉크병에 들어갈 때의 색이 정화된 잉크병 색에 섞임
  tint: {
    colors: { black: [96, 92, 106], red: [232, 70, 60], blue: [50, 118, 232], green: [64, 178, 86] },   // 검정은 진한 회색까지
    inMs: 1200, holdMs: 6000, fadeMs: 3000,
    touchColors: ['red']   // 닿자마자 튕겨 나가는 색: 한 번 닿으면 떨어져도 inMs 동안 계속 물듦 (사용자 요청 2026-10-20)
  },

  stop: { perSection: 3 }, // 스테이지당 정지 횟수 (levels.js stops 로 바꿈)
  stopUp: 1,               // 정지 +1 아이템 하나당 (그 스테이지에서만)

  // 시간 정지: A 완전 정지만 (사용자 결정 2026-10-19). 키는 스페이스 바 (사용자 결정 2026-10-20)
  timeModes: { A: { name: 'A. 완전 정지', scale: 0, limitMs: 0, activateOnStrokeEnd: false } },
  defaultTimeMode: 'A',

  // 잉크 (사용자 결정 2026-10-20): 선은 사라지지 않고, 우클릭으로 빨아들이면 전부 돌려받음. 웅덩이 없음
  ink: {
    max: 2000,             // 스테이지 기본 잉크 (levels.js ink 로 바꿈)
    upAmount: 300,         // 잉크 병(설계에는 남김, 시험판엔 배치 안 함)
    sampleDist: 8,
    minStrokeLen: 30,
    maxStrokeLen: 700,
    smoothPasses: 2,
    thickness: 9,          // 선 두께 (물리 바디도 같은 두께)
    friction: 0.4,         // 떨어지는 선끼리·땅과의 마찰 (선이 미끄러져 내려가지 않게)
    density: 0.006,        // 선 밀도 (물방울보다 훨씬 무거움 → 걷는 물방울이 밀어도 거의 안 움직임)
    suckReach: 36,         // 우클릭한 곳에서 화면 기준 이 거리(px) 안의 선을 빨아들임. 줌 아웃하면 세계 거리로는 더 넓어짐 (사용자 요청 2026-10-20: 18 → 36)
    yellowCost: 0.5,       // 노랑은 길이당 잉크를 이 비율만 씀 (돌려받을 수 없으니 절반, 사용자 요청 2026-10-20)
    yellowCut: 14,         // 노랑으로 칠한 폭의 절반: 이 안에 든 배치된 선 부분이 지워짐 (사용자 결정 2026-10-20: 자르기 → 칠한 부분 지우기)

<script>
// rules.js
// 순수 계산 규칙 (화면·물리 없음). node tools/test.js 가 이 파일만 시험한다.
var G = G || {};

G.Rules = (function () {
  function dist(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function polylineLength(pts) {
    var len = 0;
    for (var i = 1; i < pts.length; i++) len += dist(pts[i - 1], pts[i]);
    return len;
  }

  // ---- 선 그리기 ----
  // stroke = { pts: [...], len: 0, full: false }
  function newStroke(p) {
    return { pts: [{ x: p.x, y: p.y }], len: 0, full: false };
  }

  // 반환: 이번에 쓴 잉크 양 (0이면 추가 안 됨)
  function addSample(stroke, p, inkLeft, cfg) {
    if (stroke.full) return 0;
    var last = stroke.pts[stroke.pts.length - 1];
    var d = dist(last, p);
    if (d < cfg.sampleDist) return 0;
    var room = Math.min(inkLeft, cfg.maxStrokeLen - stroke.len);
    if (room <= 0) { stroke.full = true; return 0; }
    var q = { x: p.x, y: p.y };
    if (d > room) {                       // 남은 만큼만 그리고 멈춘다
      var t = room / d;
      q = { x: last.x + (p.x - last.x) * t, y: last.y + (p.y - last.y) * t };
      d = room;
      stroke.full = true;
    }
    stroke.pts.push(q);
    stroke.len += d;
    return d;
  }

  // 양 끝은 그대로 두고 가운데 점을 이웃 평균 쪽으로 당긴다
  function smooth(pts, passes) {
    var out = pts.slice();
    for (var k = 0; k < passes; k++) {
      if (out.length < 3) break;
      var next = [out[0]];
      for (var i = 1; i < out.length - 1; i++) {

          x: (out[i - 1].x + out[i].x * 2 + out[i + 1].x) / 4,
          y: (out[i - 1].y + out[i].y * 2 + out[i + 1].y) / 4
        });
      }
      next.push(out[out.length - 1]);
      out = next;
    }
    return out;
  }

  // 점을 줄인다 (Ramer–Douglas–Peucker, 허용 오차 tol px). 떨어지는 선의 물리 조각이 짧고 많으면 Matter.js 에서 뒤집히며 빠져서
  // 조각을 길게 만든다 (2026-10-20 시뮬레이션에서 확인: 8px 조각 47개 → 틈에 빠짐, 조각 2~5개 → 걸쳐서 버팀)
  function simplify(pts, tol) {
    if (pts.length < 3) return pts.slice();
    var keep = [0, pts.length - 1], stack = [[0, pts.length - 1]];
    while (stack.length) {
      var r = stack.pop(), a = pts[r[0]], b = pts[r[1]], best = -1, bi = -1;
      for (var i = r[0] + 1; i < r[1]; i++) {

        if (d > best) { best = d; bi = i; }
      }
      if (best > tol) { keep.push(bi); stack.push([r[0], bi], [bi, r[1]]); }
    }
    keep.sort(function (x, y) { return x - y; });
    return keep.map(function (i) { return pts[i]; });
  }

  // 발판이 된 뒤 ageMs 가 지나면 사라진다. 마지막 fadeMs 동안 1 → 0 으로 흐려짐
  function lineAlpha(ageMs, lifeMs, fadeMs) {
    var left = lifeMs - ageMs;
    if (left <= 0) return 0;
    return left >= fadeMs ? 1 : left / fadeMs;
  }
  function lineExpired(ageMs, lifeMs) { return ageMs >= lifeMs; }

  // ---- 정지 횟수 ----
  function newStops(n) { return { left: n, max: n }; }

  }

  function drainInk(ink, rate, ms) { return Math.max(0, ink - rate * ms / 1000); }

  // ---- 클리어 결과 (사용자 결정 2026-10-20): 별(이번 판에 주인공이 주운 수 / 배치된 수)과 정화(들어간 물방울 / 전체)를 따로 ----

  function clearResult(res) {

  function mergeRecord(rec, r) {

    r.starKeys.forEach(function (k) { rec.starKeys[k] = true; });
    rec.stars = Object.keys(rec.starKeys).length;
    rec.bestPurity = Math.max(rec.bestPurity || 0, r.purity);
    if (!rec.bestMs || r.timeMs < rec.bestMs) rec.bestMs = Math.round(r.timeMs);
    return rec;
  }

  // ---- 색 잉크 (사용자 결정 2026-10-19) ----
  // 쓸 수 있는 색 목록 list 안에서 cur 다음(d=+1)/이전(d=-1) 색. 목록에 cur 가 없으면 첫 색

    if (i < 0) return list[0];
    return list[(i + d + list.length) % list.length];

    if (ny > 0) { nx = -nx; ny = -ny; }          // 늘 위쪽을 향하게

  function pointSegDist(p, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    var t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
    return dist(p, { x: a.x + dx * t, y: a.y + dy * t });
  }

  function segHit(a, b, c, d) {

  //   c = { x, y, w(길이), h(두께), angle(도), pin } — x,y 는 돌리기 전 왼쪽 위, 가운데 기준으로 회전
  //   남은 조각마다 { x, y, w, h, angle, pin, anchored }. 못 박힌 끝(pin: both/start/end/none)이 있는 조각만 anchored(고정), 나머지는 떨어짐
  function crystalAxis(c) {
    var a = (c.angle || 0) * Math.PI / 180;

      for (var i = 1; i < pts.length; i++) if (pointSegDist(p, pts[i - 1], pts[i]) <= r) return true;

      var tt = Math.min(t, L);
      if (painted(tt)) { hit = true; if (cur) { keep.push(cur); cur = null; } }
      else if (!cur) cur = [tt, tt]; else cur[1] = tt;
    }

    if (!hit) return null;

    return keep.filter(function (k) { return k[1] - k[0] >= 4; }).map(function (k) {
      if (k[0] <= step) k[0] = 0;
      if (k[1] >= L - step) k[1] = L;
      var len = k[1] - k[0], mid = (k[0] + k[1]) / 2 - L / 2, mx = ax.cx + ax.ux * mid, my = ax.cy + ax.uy * mid;
      var s = pinS && k[0] === 0, e = pinE && k[1] === L;
      return { x: mx - len / 2, y: my - c.h / 2, w: len, h: c.h, angle: c.angle || 0,
               anchored: s || e, pin: s && e ? 'both' : s ? 'start' : e ? 'end' : 'none' };
    });
  }

  // 이번 프레임 카메라 배율: 상자(box)가 화면 안에 들어오게, minZoom~maxZoom 사이. base: 기본 줌 (이보다 크게는 안 함, 없으면 1)
  function fitZoom(box, view, cam, base) {
    var w = box.x1 - box.x0 + cam.margin * 2, h = box.y1 - box.y0 + cam.margin * 2;
    var z = Math.min(view.w / w, view.h / h, base != null ? base : 1);
    return Math.max(cam.minZoom, Math.min(cam.maxZoom, z));
  }

  // ---- 시간 배율 ----
  function timeScale(mode, stopped) { return stopped ? mode.scale : 1; }
  function shouldAutoResume(mode, stopped, stoppedMs) {
    return stopped && mode.limitMs > 0 && stoppedMs >= mode.limitMs;
  }

  return {
    dist: dist, polylineLength: polylineLength,
    newStroke: newStroke, addSample: addSample, smooth: smooth, finishStroke: finishStroke,
    lineAlpha: lineAlpha, lineExpired: lineExpired,
    refundInk: refundInk, drainInk: drainInk,
    segHit: segHit, crystalAxis: crystalAxis, eraseCrystal: eraseCrystal, fitZoom: fitZoom, clearResult: clearResult, mergeRecord: mergeRecord,
    nextColor: nextColor, bounceVelocity: bounceVelocity, pointSegDist: pointSegDist, simplify: simplify,
    newStops: newStops, canStop: canStop, useStop: useStop, rechargeStops: rechargeStops,

})();

<script>
// levelcheck.js
// 구간 데이터 계산·검사 (화면·물리 없음). 게임, 레벨 툴, node 테스트가 함께 쓴다.
var G = G || {};

G.LevelCheck = (function () {
  // 빠진 값을 기본값으로 채운 복사본
  function normalize(lv) {
    var D = G.DATA, o = JSON.parse(JSON.stringify(lv || {}));
    o.id = o.id || 'new';
    o.name = o.name || '새 구간';
    o.bg = o.bg || 'bg_a';
    o.ink = o.ink || D.ink.max;
    o.stops = o.stops != null ? o.stops : D.stop.perSection;
    o.start = o.start || { x: 200 };
    o.goal = o.goal || { x: 2000 };
    o.ground = o.ground || [];
    o.props = o.props || [];
    o.ground.forEach(function (g) { if (g.h == null) g.h = D.level.groundDepth; });
    o.props.forEach(function (p) {                 // 배치된 선: w = 길이, h = 두께, angle(도). 예전 세로 막대(h > w)는 90도로 바꿈
      if (p.type !== 'crystal' || p.angle != null) return;
      p.angle = 0;
      if (p.h > p.w) { var cx = p.x + p.w / 2, cy = p.y + p.h / 2, len = p.h; p.h = p.w; p.w = len; p.x = cx - len / 2; p.y = cy - p.h / 2; p.angle = 90; }
    });
    // 시작·도착 y = 주인공 발밑 / 잉크병 바닥. 놓은 자리 그대로(공중 가능), 없으면 그 x 의 땅 윗면 (사용자 결정 2026-10-20)
    o.start = o.start || { x: 0 }; o.goal = o.goal || { x: 1000 };
    [o.start, o.goal].forEach(function (p) { if (p.y == null) { var t = groundTopAt(o, p.x); p.y = t == null ? 600 : t; } });   // 땅 높이 (그림·충돌 같게, 사용자 결정 2026-10-20)
    delete o.rate;                                 // 시간·물방울%·시도 조건은 없앰 (사용자 결정 2026-10-20: 평가 = 별 n/3 + 정화 %)
    o.segments = o.segments || [];                 // 구간(설계 용어): [{x, name}] — 레벨 툴에 경계와 이름만 표시
    o.drops = o.drops || {};                       // 물방울 이동 속도·서로 충돌 (레벨 툴 "스테이지 설정 → 물방울")
    if (o.drops.heroSpeed == null) o.drops.heroSpeed = D.drop.runSpeed;
    if (o.drops.smallSpeed == null) o.drops.smallSpeed = D.drop.runSpeed;
    if (o.drops.collide == null) o.drops.collide = D.drop.collide;
    if (o.drops.follow == null) o.drops.follow = D.drop.follow.on;   // 대열 따라오기 (사용자 결정 2026-10-20)
    if (o.drops.gap == null) o.drops.gap = D.drop.follow.gap;
    o.eraser = o.eraser || {};
    if (o.eraser.pct == null) o.eraser.pct = D.eraser.pct;
    if (o.eraser.delayMs == null) o.eraser.delayMs = D.eraser.delayMs;
    // 쓸 수 있는 색 (없으면 3색 모두), 색 효과 세기 (빠진 칸만 기본값)
    // 정지 횟수·잉크 무제한 (레벨 툴, 사용자 요청 2026-10-21). 켤 때만 저장
    if (!o.infStops) delete o.infStops;
    if (!o.infInk) delete o.infInk;
    // 카메라: 기본 줌, 화면 위 끝·아래 끝(월드 y) — 카메라가 이 밖은 보여 주지 않음 (사용자 요청 2026-10-21)
    o.camera = o.camera || {};
    if (o.camera.zoom == null) o.camera.zoom = D.art.camera.baseZoom;
    if (o.camera.bottom == null) o.camera.bottom = o.ground.reduce(function (m, g) { return Math.max(m, g.top); }, 600) + D.art.camera.bottomPad;
    if (o.camera.top == null) o.camera.top = Math.min(D.art.camera.topY, o.camera.bottom - D.view.h / o.camera.zoom);
    o.inks = (o.inks || D.inks.order).filter(function (c) { return D.inks[c]; });
    o.fx = o.fx || {};
    Object.keys(D.inkFx).forEach(function (k) { if (o.fx[k] == null) o.fx[k] = D.inkFx[k]; });
    return o;
  }

  function groundTopAt(lv, x) {
    for (var i = 0; i < lv.ground.length; i++) {
      var g = lv.ground[i];
      if (x >= g.x0 && x <= g.x1) return g.top;
    }
    return null;
  }

  // (x, y) 바로 아래(같은 높이 포함)에 땅이 있는가
  function groundBelow(lv, x, y) {
    return lv.ground.some(function (g) { return x >= g.x0 && x <= g.x1 && g.top >= y - 2; });
  }

  // 시작~도착 사이의 틈 목록 (땅 조각 사이 빈 곳). dy: 건너편이 높으면 음수
  function gaps(lv) {
    var segs = lv.ground.slice().sort(function (a, b) { return a.x0 - b.x0; }), out = [];
    var reach = null, reachTop = 0;               // 지금까지 땅이 이어진 오른쪽 끝 (겹친 조각 고려)
    segs.forEach(function (s) {
      if (reach !== null && s.x0 > reach && s.x0 >= lv.start.x && reach <= lv.goal.x) {
        out.push({ x0: reach, x1: s.x0, w: s.x0 - reach, dy: s.top - reachTop });
      }
      if (reach === null || s.x1 > reach) { reach = s.x1; reachTop = s.top; }
    });
    return out;
  }

  // 길을 막는 벽 (땅 위에 서 있고 넘어갈 수 없는 높이). 가시는 막는 벽이 아니라 함정
  function blockingWalls(lv) {
    var step = G.DATA.drop.stepUp;
    return lv.props.filter(function (p) {
      var def = G.DATA.props[p.type];
      if (!def || !def.solid || p.type === 'spike' || p.x + p.w < lv.start.x || p.x > lv.goal.x) return false;
      var top = groundTopAt(lv, p.x + p.w / 2);
      return top != null && Math.abs(p.y + p.h - top) < 4 && p.h > step;
    });
  }

  // 장애물마다 드는 잉크 대략치: 틈마다 다리(양쪽 40px 걸침, 떨어지는 선이라 양 끝이 땅에 걸쳐야 함) + 벽마다 약 30° 경사로 + 가시마다 덮개
  function obstacleCosts(lv) {
    var out = [];
    gaps(lv).forEach(function (g) { out.push({ x: g.x0, cost: Math.sqrt((g.w + 80) * (g.w + 80) + g.dy * g.dy) }); });
    blockingWalls(lv).forEach(function (w) { out.push({ x: w.x, cost: w.h * 2 }); });
    lv.props.forEach(function (p) { if (p.type === 'spike') out.push({ x: p.x, cost: p.w + 60 }); });
    return out.sort(function (a, b) { return a.x - b.x; });
  }

  // 모범 풀이 전체에 드는 잉크 대략치 (선은 사라지지 않으므로, 빨아들이지 않으면 이 합계가 필요)
  function estimateInk(lv) {
    return Math.round(obstacleCosts(lv).reduce(function (s, o) { return s + o.cost; }, 0));
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }

  // 배치된 작은 물방울 수 (평가 기준)
  function dropCount(lv) { return lv.props.filter(function (p) { return p.type === 'drop'; }).length; }

  // 경고 목록: {lv: 'error'|'warn'|'info', msg}
  function check(raw) {
    var lv = normalize(raw), out = [], D = G.DATA;
    function add(k, m) { out.push({ lv: k, msg: m }); }
    if (!lv.ground.length) add('error', '땅이 하나도 없어요');
    if (!groundBelow(lv, lv.start.x, lv.start.y)) add('warn', '시작 위치 아래에 땅이 없어요 (주인공이 떨어져요)');
    if (lv.goal.x <= lv.start.x) add('error', '도착이 시작보다 왼쪽에 있어요 (주인공은 오른쪽으로 출발)');

    var segs = lv.ground.slice().sort(function (a, b) { return a.x0 - b.x0; });
    for (var i = 1; i < segs.length; i++) {
      if (segs[i].x0 < segs[i - 1].x1) add('warn', '땅 조각이 겹쳐요 (x ' + segs[i].x0 + ')');
    }
    lv.ground.forEach(function (g) { if (g.x1 - g.x0 < 20) add('warn', '너무 짧은 땅 (x ' + g.x0 + ')'); });

    var solids = lv.props.filter(function (p) { var d = D.props[p.type]; return d && d.solid; });
    solids.forEach(function (p) { if (p.w < 8 || p.h < 8) add('warn', D.props[p.type].name + '이(가) 너무 작아요 (x ' + p.x + ')'); });
    var drops = lv.props.filter(function (p) { return p.type === 'drop'; });
    drops.forEach(function (s) {
      var r = D.drop.smallRadius, box = { x: s.x - r, y: s.y - r, w: r * 2, h: r * 2 };
      solids.forEach(function (p) { if (overlaps(box, p)) add('warn', '물방울이 ' + D.props[p.type].name + ' 안에 묻혀 있어요 (x ' + s.x + ')'); });
    });
    if (!drops.length) add('warn', '잠든 물방울이 없어요 (물방울 도착 비율 조건이 늘 만족됨)');
    if (drops.length > 20) add('warn', '물방울이 ' + drops.length + '마리예요 (시험판 권장 최대 20)');

    var minTime = Math.ceil((lv.goal.x - lv.start.x) / (lv.drops.heroSpeed * 60));
    var nStar = lv.props.filter(function (p) { return p.type === 'star'; }).length;
    add(nStar === D.level.starsPerStage ? 'info' : 'warn', '별 ' + nStar + '개 (스테이지당 ' + D.level.starsPerStage + '개 권장, 주인공이 닿아야 획득) · 쉬지 않고 걸으면 약 ' + minTime + '초');
    var est = estimateInk(lv);
    add('info', '틈 ' + gaps(lv).length + '개 · 막는 벽 ' + blockingWalls(lv).length + '개 · 모범 풀이 잉크 합계 약 ' + est + ' / 기본 잉크 ' + lv.ink + ' (우클릭으로 빨아들이면 다시 씀)');
    if (est > lv.ink * 1.5) add('warn', '잉크가 많이 모자라요 — 선을 여러 번 빨아들여 다시 써야 해요');
    if (lv.infStops) add('info', '정지 횟수 무제한 (켬)');
    else if (lv.stops < 1) add('info', '정지 횟수 0: 달리면서만 그려야 해요');
    if (lv.infInk) add('info', '잉크 무제한 (켬)');
    var cam = lv.camera, band = cam.bottom - cam.top, vh = D.view.h / cam.zoom;
    add('info', '카메라: 기본 줌 ' + cam.zoom + ' (화면 높이 ' + Math.round(vh) + ') · 위 끝 y ' + cam.top + ' · 아래 끝 y ' + cam.bottom);
    if (cam.zoom < D.art.camera.minZoom || cam.zoom > D.art.camera.maxZoom) add('warn', '기본 줌은 ' + D.art.camera.minZoom + ' ~ ' + D.art.camera.maxZoom + ' 사이로 맞춰져요');
    if (band < vh) add('warn', '화면 위 끝~아래 끝 간격(' + band + ')이 기본 줌의 화면 높이(' + Math.round(vh) + ')보다 좁아요 — 아래 끝에 맞추고 위 끝 위도 보여요');
    if (!lv.inks.length) add('error', '쓸 수 있는 색이 없어요 (스테이지 설정 → 쓸 수 있는 색)');
    else add('info', '쓸 수 있는 색: ' + lv.inks.map(function (c) { return D.inks[c].name; }).join(', ') +
      ' · 튕김 ' + lv.fx.bounce + ' · 가속 ' + lv.fx.boostPct + '% ' + (lv.fx.boostMs / 1000) + '초 · 떠오름 ' + lv.fx.riseSpeed);
    var crystals = lv.props.filter(function (p) { return p.type === 'crystal'; });
    if (crystals.length && lv.inks.indexOf('yellow') < 0) add('warn', '배치된 선이 있는데 노랑(지우기)을 쓸 수 없어요');
    add('info', '물방울 속도: 주인공 ' + lv.drops.heroSpeed + ' · 작은 물방울 ' + lv.drops.smallSpeed + ' · 서로 충돌 ' + (lv.drops.collide ? '켬' : '끔') +
      ' · 대열 ' + (lv.drops.follow ? '켬 (간격 ' + lv.drops.gap + ', 작은 물방울 속도는 이탈해 혼자 걸을 때만)' : '끔'));
    if (lv.drops.follow && lv.drops.gap <= 0) add('error', '대열 간격은 0보다 커야 해요');
    if (lv.drops.heroSpeed <= 0 || lv.drops.smallSpeed <= 0) add('error', '물방울 속도는 0보다 커야 해요');
    if (lv.drops.smallSpeed < lv.drops.heroSpeed * lv.eraser.pct / 100) add('warn', '작은 물방울이 지우개보다 느려요 — ' + (lv.drops.follow ? '대열에서 이탈해 ' : '') + '뒤처진 물방울은 모두 지워져요');
    add('info', '지우개: ' + (lv.eraser.delayMs / 1000) + '초 뒤 출발, 주인공 속도의 ' + lv.eraser.pct + '% · 구간 경계 ' + lv.segments.length + '개');
    return out;
  }

  return { normalize: normalize, groundTopAt: groundTopAt, groundBelow: groundBelow, gaps: gaps, blockingWalls: blockingWalls, estimateInk: estimateInk, dropCount: dropCount, check: check };
})();

<script>
// util.js
// 공용 도구: 시드 난수, 버전 있는 저장, 화면 글자(uitext.js) 가져오기
var G = G || {};

// mulberry32 — 같은 시드면 같은 수열
G.makeRng = function (seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

// 계정 저장. localStorage가 막혀 있어도(사생활 보호 모드 등) 게임은 돌아가게 한다
//   inkBonus: 잉크 병으로 늘어난 최대량(영구) / bottles: 먹은 잉크 병 { "구간id:병id": true }
//   records: 스테이지별 기록 { id: { starKeys{별key:true}, stars(모은 별 수), bestPurity(0~1), bestMs, clears, tries } }
G.Save = {
  blank: function () {
    return { v: G.DATA.version, timeMode: G.DATA.defaultTimeMode, stats: {}, inkBonus: 0, bottles: {}, records: {} };
  },

  // 빠진 칸을 채운다 (예전 저장에는 inkBonus 등이 없음)
  fill: function (s) {
    var b = this.blank();
    for (var k in b) if (s[k] === undefined) s[k] = b[k];
    return s;
  },

  load: function () {
    var S = G.DATA.save;
    try {
      var raw = localStorage.getItem(S.key);
      if (!raw) {                                  // 이름을 바꾸기 전 저장이 있으면 옮겨 온다
        for (var i = 0; i < S.oldKeys.length && !raw; i++) raw = localStorage.getItem(S.oldKeys[i]);
      }
      if (!raw) return this.blank();
      var s = JSON.parse(raw);
      return s && s.v === G.DATA.version ? this.fill(s) : this.blank();
    } catch (e) { return this.blank(); }
  },
  write: function (s) {
    try { localStorage.setItem(G.DATA.save.key, JSON.stringify(s)); } catch (e) { /* 무시 */ }
  }
};

// ---- 화면 글자·UI 모양 (uitext.js, 사용자 요청 2026-10-21) ----
// 글자 가져오기: G.T('hud.home', { rescued: 3, total: 5 }). 없는 이름이면 이름 그대로
G.T = function (key, vars) {
  var t = G.UITEXT.text[key];
  if (t == null) return key;
  return String(t).replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : ''; });
};
G.TS = function (key) { return G.UITEXT.style[key]; };
G.TF = function (size, bold) { return (bold ? 'bold ' : '') + G.UITEXT.style[size] + 'px ' + G.UITEXT.style.font; };

// 물감 이름은 data.js inks 에도 넣어 둠 (레벨 툴·검사가 같이 씀)
G.applyUiText = function () {
  if (!G.DATA || !G.DATA.inks) return;
  G.DATA.inks.order.forEach(function (c) { var t = G.UITEXT.text['ink.' + c]; if (t != null && G.DATA.inks[c]) G.DATA.inks[c].name = t; });
};
G.applyUiText();

<script>
// physics.js
// Matter.js 감싸기. 다른 파일은 Matter를 직접 부르지 않고 이 함수들을 쓴다.
var G = G || {};

G.Physics = (function () {
  var M = (typeof Matter !== 'undefined') ? Matter : null;

  function create() {
    var engine = M.Engine.create();
    engine.gravity.y = G.DATA.physics.gravityY;
    return engine;
  }

  function add(engine, body) { M.Composite.add(engine.world, body); return body; }
  function remove(engine, body) { M.Composite.remove(engine.world, body); }

  function staticRect(x, y, w, h, opts) {
    var o = { isStatic: true, friction: 0.8, label: 'ground' };   // 선이 미끄러지지 않게 (물방울은 마찰 0이라 쌍 마찰 = 0)
    for (var k in opts) o[k] = opts[k];

  }

  // 점 a → b 를 잇는 얇은 사각형. 끝을 둥글게 하고 살짝 길게 해 이음매 턱을 줄인다
  function segment(a, b, thick, opts) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) + thick * 0.5;
    var o = {
      isStatic: true, angle: Math.atan2(dy, dx), friction: G.DATA.ink.friction,
      chamfer: { radius: thick * 0.49 }, label: 'ink'
    };
    for (var k in opts) o[k] = opts[k];
    return M.Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len, thick, o);
  }

  // 그린 선 하나 = 선분 여러 개를 묶은 한 덩어리 몸체 (사용자 결정 2026-10-20: 한 덩어리로 회전하며 떨어짐)
  //   isStatic 이면 고정(초록이 떠오르는 동안·멈춘 뒤). 몸체와 조각 모두에 inkColor 를 붙여 접촉 판정에 씀
  function lineBody(pts, thick, color, isStatic) {
    var D = G.DATA.ink, parts = [];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy) + thick * 0.5;
      if (len < 1) continue;
      var part = M.Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len, thick, {
        angle: Math.atan2(dy, dx), chamfer: { radius: thick * 0.49 }
      });
      part.inkColor = color;
      parts.push(part);
    }
    if (!parts.length) return null;
    var body = parts.length === 1 ? parts[0] : M.Body.create({ parts: parts });
    M.Body.set(body, { friction: D.friction, frictionStatic: 0.8, restitution: 0, label: 'ink' });
    M.Body.setDensity(body, D.density);
    if (isStatic) M.Body.setStatic(body, true);
    body.inkColor = color;
    return body;
  }

  // body 가 bodies 중 하나와 겹치는가 (초록이 떠오르다 닿았는지)
  function overlapsAny(body, bodies) { return M.Query.collides(body, bodies).length > 0; }
  // body 와 겹친 몸체 목록 (조각이면 바깥 몸체로)
  function overlapping(body, bodies) {
    var out = [];
    M.Query.collides(body, bodies).forEach(function (c) {
      var o = c.bodyA.parent === body || c.bodyA === body ? c.bodyB : c.bodyA;
      o = o.parent || o;
      if (out.indexOf(o) < 0) out.push(o);
    });
    return out;
  }

  // 시간 배율 scale 로 한 스텝 진행 (scale 0이면 진행하지 않음)
  function step(engine, scale) {
    if (scale <= 0) return;
    engine.timing.timeScale = scale;
    M.Engine.update(engine, G.DATA.loop.stepMs);
  }

  // body 와 지금 닿아 있는 접촉점 목록
  function contacts(engine, body) {
    var out = [], list = engine.pairs.list;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p.isActive || p.isSensor) continue;
      if (p.bodyA !== body && p.bodyB !== body) continue;
      var c = p.collision;
      for (var j = 0; j < c.supportCount; j++) out.push(c.supports[j]);
    }
    return out;
  }

  // body 와 닿아 있는 상대 바디마다 { other, pts } (색 잉크 선을 밟았는지 보려고)
  function touching(engine, body) {
    var out = [], list = engine.pairs.list;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p.isActive || p.isSensor) continue;
      if (p.bodyA !== body && p.bodyB !== body) continue;
      var c = p.collision, pts = [];
      for (var j = 0; j < c.supportCount; j++) pts.push(c.supports[j]);
      var o = p.bodyA === body ? p.bodyB : p.bodyA;   // 묶은 몸체의 조각일 수 있음 (조각에도 inkColor)
      out.push({ other: o, root: o.parent || o, pts: pts });
    }
    return out;
  }

  function allBodies(engine) { return M.Composite.allBodies(engine.world); }

  return {
    M: M, create: create, add: add, remove: remove, staticRect: staticRect,
    segment: segment, lineBody: lineBody, overlapsAny: overlapsAny, overlapping: overlapping,
    step: step, contacts: contacts, touching: touching, allBodies: allBodies
  };
})();

<script>
// level.js
// 스테이지 만들기: levels.js 의 스테이지 데이터를 정적 물리 바디로 바꾼다
//   잠든 물방울(drop)은 깨어날 때까지 몸체가 없다 (그림만). 배치된 선(crystal)은 노랑으로 자를 수 있게 따로 목록을 둔다
var G = G || {};

G.Level = {
  build: function (engine, raw, account) {
    var P = G.Physics, lv = G.LevelCheck.normalize(raw);
    var owned = (account && account.bottles) || {};
    var out = { data: lv, goalX: lv.goal.x, sleepers: [], items: [], crystals: [], statics: [] };
    lv.ground.forEach(function (g) {
      out.statics.push(P.add(engine, P.staticRect((g.x0 + g.x1) / 2, g.top + g.h / 2, g.x1 - g.x0, g.h)));
    });
    var nBottle = 0, nStar = 0;
    lv.props.forEach(function (p) {
      if (p.type === 'crystal') {                  // 자를 수 있게 복사본으로 (원본 데이터는 그대로)
        var c = { x: p.x, y: p.y, w: p.w, h: p.h, angle: p.angle || 0, pin: p.pin || 'both', body: null };
        c.body = P.add(engine, P.staticRect(c.x + c.w / 2, c.y + c.h / 2, c.w, c.h, { label: 'crystal', angle: c.angle * Math.PI / 180 }));
        out.crystals.push(c);
        return;
      }
      var b = G.Props.build(engine, p);
      if (b) out.statics.push(b);
      if (p.type === 'drop') out.sleepers.push({ prop: p, x: p.x, y: p.y, state: 'sleep' });
      if (p.type === 'stopup') out.items.push({ prop: p, kind: 'stopup', got: false });
      if (p.type === 'star') out.items.push({ prop: p, kind: 'star', key: 'star' + nStar++, got: false });   // 다시 하면 다시 나타남 (클리어해야 기록)
      if (p.type === 'inkup') {
        var key = lv.id + ':' + (p.id || 'inkup' + nBottle++);
        out.items.push({ prop: p, kind: 'inkup', key: key, got: !!owned[key], owned: !!owned[key] });
      }
    });
    return out;
  },

  groundTopAt: function (lv, x) { return G.LevelCheck.groundTopAt(lv, x); }
};

<script>
// drop.js
// 물방울: 주인공 1 + 깨어난 작은 물방울들 (사용자 결정 2026-10-20). 모두 원형 몸체, 바닥에서 자동으로 걷고 벽에 막히면 뒤로 돎.
// 물방울끼리는 서로 통과(같은 음수 group). 색 선: 빨강 = 선과 수직으로 튕김, 파랑 = 밟는 동안·내린 뒤 잠시 빨라짐.
// 위·아래로 끼면 죽지 않고 가까운 옆으로 밀려남. 가시에 닿으면 죽음.
var G = G || {};

G.Drop = {
  GROUP: -7,

  // hero: 주인공이면 true (크기가 크고, 죽으면 실패). cfg = 스테이지 drops 설정 {heroSpeed, smallSpeed, collide}
  //   collide 가 꺼져 있으면 같은 음수 group 이라 물방울끼리 통과, 켜져 있으면 서로 부딪힘(벽처럼 뒤로 돌고 위에 올라탐)
  create: function (engine, x, y, hero, dir, cfg) {
    var D = G.DATA.drop, M = G.Physics.M, r = hero ? D.heroRadius : D.smallRadius;
    cfg = cfg || {};
    var body = M.Bodies.circle(x, y, r, {
      friction: 0, frictionAir: 0, frictionStatic: 0, restitution: 0, label: 'drop',
      collisionFilter: { group: cfg.collide ? 0 : this.GROUP }
    });
    M.Body.setDensity(body, D.density);
    M.Body.setInertia(body, Infinity);
    G.Physics.add(engine, body);
    return {
      body: body, r: r, hero: !!hero, dir: dir || 1, state: 'walk', grounded: false,
      mode: hero ? 'hero' : 'free',                // 작은 물방울: free 혼자 걷기 / join 깨어나 대열로 튀는 중 / line 대열 (사용자 결정 2026-10-20)
      speed: (hero ? cfg.heroSpeed : cfg.smallSpeed) || D.runSpeed,
      turnCdMs: 0, turns: 0, boostMs: 0, bounceCdMs: 0, bounces: 0, pinchMs: 0, onInk: null,
      events: [], dead: null
    };
  },

  // 바닥에서 걷기: 발 앞쪽 바닥 면을 따라(경사·낮은 턱이면 그 기울기대로) 목표 속도로 (사용자 요청 2026-10-20: 경사·턱을 매끄럽게)
  control: function (d, scale, fx) {
    var D = G.DATA.drop, M = G.Physics.M, v = d.body.velocity;
    if (!d.grounded) return;
    var boost = d.boostMs > 0 && fx;
    var target = d.speed * (boost ? fx.boostPct / 100 : 1) * d.dir;
    var a = Math.min(1, D.accel * (boost ? 2.5 : 1) * scale);
    var n = d.groundN || { x: 0, y: -1 }, tx = -n.y, ty = n.x;      // 바닥 면 방향 (n = 닿은 점 → 중심)
    var want = { x: tx * target, y: ty * target };
    if (want.y < -0.01) {                          // 오르막: 위로 가는 속도는 빨리 맞춰 멈칫하지 않게
      M.Body.setVelocity(d.body, { x: v.x + (want.x - v.x) * Math.max(a, D.climbAccel * scale), y: v.y + (want.y - v.y) * Math.min(1, D.climbAccel * scale) });
    } else {
      M.Body.setVelocity(d.body, { x: v.x + (want.x - v.x) * a, y: v.y });
    }
  },

  // 물리 스텝 직후: 바닥·벽·색 선·가시·끼임 판정
  sense: function (d, engine, realMs, scale, fx) {
    var D = G.DATA.drop, M = G.Physics.M, b = d.body, r = d.r, gameMs = realMs * scale;
    var stepUp = Math.max(D.stepUpMin, D.stepUp * r / D.heroRadius);
    var touch = G.Physics.touching(engine, b);
    var under = null, ground = false, wall = false, red = null, blue = false, above = null, below = false, low = false, front = null;
    d.events.length = 0;
    for (var t = 0; t < touch.length; t++) {
      var pts = touch[t].pts, other = touch[t].other, root = touch[t].root, color = other.inkColor || root.inkColor;
      if (root.label === 'spike' || other.label === 'spike') { d.dead = 'spike'; return; }
      for (var i = 0; i < pts.length; i++) {
        var dy = pts[i].y - b.position.y, dx = pts[i].x - b.position.x;
        if (dy > r * D.groundCheck) {
          ground = true; below = true;
          if (!front || dx * d.dir > front.f) front = { f: dx * d.dir, dx: dx, dy: dy };   // 가는 쪽으로 가장 앞선 바닥 접점
          if (dx * d.dir > r * 0.75) low = true;   // 발 앞쪽 모서리에 걸침 → 올라타기
          if (color && color !== 'yellow' && !under) under = color;   // 밟고 있는 색 (물들기)
          if (color === 'red') red = other;
          if (color === 'blue') blue = true;
        } else if (dy < -r * D.groundCheck) above = root;
        else if (dx * d.dir > r * 0.5 && dy < r - stepUp) wall = true;
        else if (dx * d.dir > 0 && dy >= r - stepUp) low = true;   // 가는 쪽 발치의 낮은 턱 (쓰러진 선 조각 등)
      }
    }
    d.grounded = ground;
    d.under = red ? 'red' : under;                 // 빨강을 같이 밟았으면 빨강 (닿자마자 튕겨 나가므로 놓치지 않게)
    if (front) {                                   // 바닥 면 방향 = 앞선 접점에서 중심으로 (턱 모서리면 그 기울기로 타고 오름)
      var len = Math.sqrt(front.dx * front.dx + front.dy * front.dy) || 1;
      d.groundN = { x: -front.dx / len, y: -front.dy / len };
    } else d.groundN = null;
    // 그래도 낮은 턱 앞에서 멈칫하면 살짝 들어 올려 넘김 (Matter.js 원은 턱을 스스로 넘지 못함)
    if (low && !wall && scale > 0 && Math.abs(b.velocity.x) < d.speed * 0.4) M.Body.translate(b, { x: d.dir * 1.5 * scale, y: -3 * scale });
    d.onInk = red ? 'red' : blue ? 'blue' : null;
    d.boostMs = Math.max(0, d.boostMs - gameMs);
    d.bounceCdMs = Math.max(0, d.bounceCdMs - gameMs);
    if (fx && blue) {
      if (d.boostMs <= 0) d.events.push('boost');
      d.boostMs = fx.boostMs;
    }
    if (fx && red && d.bounceCdMs === 0 && scale > 0) {
      M.Body.setVelocity(b, G.Rules.bounceVelocity(red.angle, fx.bounce, b.velocity));
      d.grounded = false;
      d.bounceCdMs = G.DATA.bounceCdMs;
      d.bounces += 1;
      d.events.push('bounce');
    }
    // 위·아래로 끼임: 일정 시간 이어지면 누르는 물체의 가까운 옆 끝 바깥으로 옮김 (사용자 결정 2026-10-20: 끼여서 죽지 않음)
    if (above && below && scale > 0) {
      d.pinchMs += gameMs;
      if (d.pinchMs >= D.pinchMs) {
        var bx = above.bounds, left = b.position.x - bx.min.x, right = bx.max.x - b.position.x;
        var nx = left < right ? bx.min.x - r - 2 : bx.max.x + r + 2;
        M.Body.setPosition(b, { x: nx, y: b.position.y });
        M.Body.setVelocity(b, { x: 0, y: 0 });
        d.pinchMs = 0;
      }
    } else d.pinchMs = 0;
    d.turnCdMs = Math.max(0, d.turnCdMs - gameMs);
    if (wall && d.turnCdMs === 0) {
      d.dir = -d.dir;
      d.turns += 1;
      d.turnCdMs = D.turnCooldownMs;
    }
  },

  // 대열 물방울: 가시에 닿았는가, 발밑(반지름 + supportTol 안)에 물방울 아닌 몸체가 있는가
  //   위치를 직접 옮기므로 걷기 판정 대신 아래로 짧은 광선을 쏴서 봄 (경사에서 살짝 떠도 바닥으로 침)
  support: function (d, engine) {
    var b = d.body, touch = G.Physics.touching(engine, b), color = null;
    for (var t = 0; t < touch.length; t++) {
      if (touch[t].root.label === 'spike' || touch[t].other.label === 'spike') return { ground: true, spike: true };
      var c = touch[t].other.inkColor || touch[t].root.inkColor;
      if (c && c !== 'yellow' && !color && touch[t].pts.some(function (q) { return q.y > b.position.y; })) color = c;   // 발밑 색 (물들기)
    }
    var M = G.Physics.M, p = b.position, reach = d.r + G.DATA.drop.follow.supportTol;
    var bodies = G.Physics.allBodies(engine).filter(function (q) { return q.label !== 'drop'; });
    var hit = M.Query.ray(bodies, { x: p.x, y: p.y }, { x: p.x, y: p.y + reach }, d.r * 1.2);
    return { ground: hit.length > 0, spike: false, color: color };
  },

  // 대열에 붙는 동안은 아무것과도 안 부딪힘 (통 튀어 날아가는 중), 대열에선 물방울끼리 통과, 혼자 걸을 땐 스테이지 설정대로
  setFilter: function (d, mode, collide) {
    var f = d.body.collisionFilter;
    f.mask = mode === 'join' ? 0 : 0xFFFFFFFF;
    f.group = mode === 'free' && collide ? 0 : this.GROUP;
  },

  // 물들기 (사용자 결정 2026-10-20): d.tc = 물든 색 [r,g,b], d.ta = 세기 0~1, d.tHold = 내려온 뒤 유지 남은 시간
  tint: function (d, ms) {
    var T = G.DATA.tint, c = d.under && T.colors[d.under];
    if (c && T.touchColors.indexOf(d.under) >= 0) d.tKick = { c: c, ms: T.inMs };   // 빨강: 닿으면 그 뒤로도 천천히 끝까지
    if (!c && d.tKick && d.tKick.ms > 0) { c = d.tKick.c; d.tKick.ms -= ms; }
    if (c) {
      if (!d.tc || (d.ta || 0) <= 0.01) d.tc = c.slice();
      var k = 1 - Math.exp(-3 * ms / T.inMs);        // 다른 색이면 섞이며 넘어감
      d.tc = d.tc.map(function (v, i) { return v + (c[i] - v) * k; });
      d.ta = Math.min(1, (d.ta || 0) + ms / T.inMs);
      d.tHold = T.holdMs;
    } else if (d.ta > 0) {
      if (d.tHold > 0) d.tHold -= ms;
      else d.ta = Math.max(0, d.ta - ms / T.fadeMs);
    }
  },

  remove: function (engine, d) { if (d.body) { G.Physics.remove(engine, d.body); d.body = null; } }
};

<script>
// draw.js
// 선 그리기: 마우스 드래그 → 잉크 소모 → 평활화 → 한 덩어리 물리 몸체 (사용자 결정 2026-10-20)
//   선은 사라지지 않고 중력으로 떨어짐(초록은 천천히 떠올라 닿으면 고정). 우클릭으로 빨아들이면 잉크를 전부 돌려받음
//   노랑은 칠한 자리의 배치된 선(crystal) 부분을 지우고 바로 사라짐 (잉크 소모)
//   정지 중에 그린 선은 점선으로 기다렸다가 재생할 때 한꺼번에 떨어짐. 달리는 중에 그린 선은 손을 떼면 바로
var G = G || {};

G.Draw = {
  begin: function (game, p) {
    if (game.status !== 'run' || (game.ink <= 0 && !game.level.data.infInk)) return false;
    game.stroke = G.Rules.newStroke(p);
    game.stroke.color = game.color;
    game.stroke.cost = game.color === 'yellow' ? G.DATA.ink.yellowCost : 1;   // 길이당 잉크 비율
    return true;
  },

  move: function (game, p) {
    if (!game.stroke) return;
    var k = game.stroke.cost || 1;
    if (game.level.data.infInk) { G.Rules.addSample(game.stroke, p, Infinity, G.DATA.ink); }   // 잉크 무제한 (레벨 툴, 사용자 요청 2026-10-21)
    else game.ink -= G.Rules.addSample(game.stroke, p, game.ink / k, G.DATA.ink) * k;
    if (game.stroke.full) this.end(game);
  },

  end: function (game) {
    var s = game.stroke;
    if (!s) return;
    game.stroke = null;
    var r = G.Rules.finishStroke(s, G.DATA.ink);
    if (!r.ok) { if (!game.level.data.infInk) game.ink += r.refund * (s.cost || 1); game.toast(G.T('toast.short')); return; }
    var line = { pts: G.Rules.simplify(r.pts, G.DATA.ink.simplifyTol), color: s.color || 'black', len: s.len, active: false, body: null, local: null, rising: false };
    game.lines.push(line);
    if (!game.stopped) this.activate(game, line);
  },

  activate: function (game, line) {
    if (line.active) return;
    line.active = true;
    if (line.color === 'yellow') { this.cut(game, line); this.drop(game, line, false); return; }
    var green = line.color === 'green';
    var body = G.Physics.lineBody(line.pts, G.DATA.ink.thickness, line.color, green);
    if (!body) { this.drop(game, line, true); return; }
    // 그릴 때의 점을 몸체 기준 좌표로 저장 → 몸체가 움직이고 돌면 그림도 따라감
    line.local = line.pts.map(function (q) { return { x: q.x - body.position.x, y: q.y - body.position.y }; });
    line.angle0 = body.angle;                      // 조각 하나짜리 몸체는 처음부터 각도가 있음 → 그 뒤 돈 만큼만 반영
    line.body = G.Physics.add(game.engine, body);
    line.rising = green;
    // 초록을 벽·발판·땅에 겹쳐 그렸으면 그 몸체는 빠져나갈 때까지 무시 (사용자 요청 2026-10-20: 겹쳐 그려도 떠오르게)
    if (green) line.ignore = G.Physics.overlapping(body, this.riseBlockers(game, line));
  },

  activateAll: function (game) {
    for (var i = 0; i < game.lines.length; i++) if (!game.lines[i].active) this.activate(game, game.lines[i]);
  },

  // 몸체 위치·각도를 반영한 지금 점들 (그리기·빨아들이기 판정용)
  worldPts: function (line) {
    if (!line.body) return line.pts;
    var b = line.body, a = b.angle - (line.angle0 || 0), c = Math.cos(a), s = Math.sin(a);
    return line.local.map(function (q) { return { x: b.position.x + q.x * c - q.y * s, y: b.position.y + q.x * s + q.y * c }; });
  },

  // 선 하나를 없앰. refund 면 잉크를 돌려받음
  drop: function (game, line, refund) {
    var i = game.lines.indexOf(line);
    if (i >= 0) game.lines.splice(i, 1);
    if (line.body) G.Physics.remove(game.engine, line.body);
    line.body = null;
    if (refund) game.ink = G.Rules.refundInk(game.ink, line.len, game.inkMax);
  },

  // 우클릭: p(월드) 가까운 선을 빨아들여 잉크를 전부 돌려받음 (달리는 중에도, 정지 중에도. 사용자 결정 2026-10-20)
  //   reach: 판정 거리(세계 px). 없으면 기본값 (화면에서 부를 때는 줌을 반영해 넘김)
  suck: function (game, p, reach) {
    reach = reach || G.DATA.ink.suckReach;
    var best = null, bestD = reach;
    for (var i = 0; i < game.lines.length; i++) {
      var pts = this.worldPts(game.lines[i]);
      for (var j = 1; j < pts.length; j++) {
        var d = G.Rules.pointSegDist(p, pts[j - 1], pts[j]);
        if (d <= bestD) { bestD = d; best = game.lines[i]; }
      }
    }
    if (!best) return false;
    game.fx.push({ type: 'suck', pts: this.worldPts(best), color: best.color, t: game.timeMs });
    this.drop(game, best, true);
    return true;
  },

  // 노랑: 칠한 자리(선에서 yellowCut 안)에 든 배치된 선 부분을 지움 (사용자 결정 2026-10-20). 못 박힌 끝이 있는 조각은 고정으로 남고,
  //   나머지 조각은 떨어지는 "배치된 선" 조각이 됨 (빨아들일 수 없음)
  cut: function (game, line) {
    var P = G.Physics, M = P.M, r = G.DATA.ink.yellowCut, list = game.level.crystals, n = 0;
    for (var i = list.length - 1; i >= 0; i--) {
      var c = list[i], pieces = G.Rules.eraseCrystal(c, line.pts, r);
      if (!pieces) continue;
      n++;
      P.remove(game.engine, c.body);
      list.splice(i, 1);
      pieces.forEach(function (q) {
        var rad = q.angle * Math.PI / 180;
        if (q.anchored) {
          q.body = P.add(game.engine, P.staticRect(q.x + q.w / 2, q.y + q.h / 2, q.w, q.h, { label: 'crystal', angle: rad }));
          list.push(q);
        } else {
          var body = M.Bodies.rectangle(q.x + q.w / 2, q.y + q.h / 2, q.w, q.h, { friction: G.DATA.ink.friction, label: 'crystal', angle: rad });
          M.Body.setDensity(body, G.DATA.ink.density);
          M.Body.setAngularVelocity(body, (game.fallen.length % 2 ? 0.02 : -0.02));   // 세워진 채 떨어져 다시 서지 않게 살짝 기울임
          game.fallen.push({ w: q.w, h: q.h, body: P.add(game.engine, body) });
        }
      });
    }
    // 이미 떨어진 조각도 칠하면 지워짐 (사용자 요청 2026-10-20). 남은 조각은 계속 떨어지는 조각으로 (속도·회전 이어받음)
    for (var f = game.fallen.length - 1; f >= 0; f--) {
      var fb = game.fallen[f], b = fb.body, deg = b.angle * 180 / Math.PI;
      var rest = G.Rules.eraseCrystal({ x: b.position.x - fb.w / 2, y: b.position.y - fb.h / 2, w: fb.w, h: fb.h, angle: deg, pin: 'none' }, line.pts, r);
      if (!rest) continue;
      n++;
      P.remove(game.engine, b);
      game.fallen.splice(f, 1);
      rest.forEach(function (q) {
        var body = M.Bodies.rectangle(q.x + q.w / 2, q.y + q.h / 2, q.w, q.h, { friction: G.DATA.ink.friction, label: 'crystal', angle: b.angle });
        M.Body.setDensity(body, G.DATA.ink.density);
        M.Body.setVelocity(body, b.velocity);
        M.Body.setAngularVelocity(body, b.angularVelocity);
        game.fallen.push({ w: q.w, h: q.h, body: P.add(game.engine, body) });
      });
    }
    if (n) game.fx.push({ type: 'cut', pts: line.pts, t: game.timeMs });
    else game.toast(G.T('toast.noCrystal'));
  },

  // 초록이 닿으면 멈추는 것들: 벽·발판·땅, 배치된 선, 떨어진 조각, 다른 선
  riseBlockers: function (game, ln) {
    return game.level.statics.concat(game.level.crystals.map(function (c) { return c.body; }),
      game.fallen.map(function (f) { return f.body; }),
      game.lines.filter(function (o) { return o !== ln && o.body; }).map(function (o) { return o.body; }));
  },

  // 초록: 떠오르다 무언가에 닿거나 꼭대기에 이르면 고정 (사용자 결정 2026-10-20)
  //   처음부터 겹쳐 있던 몸체(ln.ignore)는 빠져나갈 때까지 무시
  rise: function (game, scale, fx) {
    var M = G.Physics.M, top = G.DATA.greenTopY;
    for (var i = 0; i < game.lines.length; i++) {
      var ln = game.lines[i];
      if (!ln.rising || !ln.body) continue;
      var b = ln.body, dy = fx.riseSpeed * scale;
      M.Body.setPosition(b, { x: b.position.x, y: b.position.y - dy });
      var hit = G.Physics.overlapping(b, this.riseBlockers(game, ln)), ign = ln.ignore || [];
      ln.ignore = ign.filter(function (o) { return hit.indexOf(o) >= 0; });   // 빠져나간 몸체는 다시 막음
      var blocked = hit.some(function (o) { return ign.indexOf(o) < 0; });
      if (blocked || b.bounds.min.y <= top) {
        M.Body.setPosition(b, { x: b.position.x, y: b.position.y + dy });
        ln.rising = false;
      }
    }
  },

  // 화면 아래로 떨어져 나간 선은 정리 (잉크는 돌려받음)
  cleanup: function (game) {
    for (var i = game.lines.length - 1; i >= 0; i--) {
      var ln = game.lines[i];
      if (ln.body && ln.body.position.y > game.failY + 300) this.drop(game, ln, true);
    }
  }
};

</script>
<script>
// game.js
// 게임 상태와 한 스텝 진행 — 물방울 무리 시험판 (사용자 결정 2026-10-20). 화면(DOM)과 무관 → 브라우저 밖에서도 돌릴 수 있다.
//   주인공이 죽으면 실패. 검은 잉크병(도착)에 닿은 물방울은 흡수되어 잉크병이 정화됨.
//   주인공이 도착하면 스킵 가능(남은 물방울은 죽은 것으로). 걷는 물방울이 하나도 안 남으면 바로 클리어
//   대열 (사용자 결정 2026-10-20): 주인공이 깨운 물방울은 주인공 발자국(game.trail)을 그대로 따라옴. 밀리거나 발밑이 사라지면 이탈,
//   혼자 걷다가 주인공에 닿으면 다시 대열 끝으로. game.line = 대열 순서 (통 튀어 붙는 중인 물방울 포함)
var G = G || {};

G.Game = {
  create: function (timeModeKey, levelData, account) {
    var game = {
      modeKey: 'A', mode: G.DATA.timeModes.A,
      levelData: levelData || G.LEVELS[0],
      account: account || { inkBonus: 0, bottles: {} },
      messages: [], attempt: 0, color: null
    };
    game.toast = function (text) { game.messages.push({ text: text, ms: 1800 }); };
    this.reset(game);
    return game;
  },

  setLevel: function (game, levelData) {
    game.levelData = levelData;
    game.attempt = 0;
    this.reset(game);
  },

  reset: function (game) {
    var D = G.DATA;
    game.engine = G.Physics.create();
    game.level = G.Level.build(game.engine, game.levelData, game.account);
    var lv = game.level.data;
    game.hero = G.Drop.create(game.engine, lv.start.x, lv.start.y - D.drop.heroRadius - 1, true, 1, lv.drops);   // 시작 y = 발밑
    game.drops = [game.hero];                      // 깨어난 물방울 (주인공 포함)
    game.line = [];                                // 대열 (주인공 뒤 순서대로)
    var hp = game.hero.body.position;
    game.trail = [{ x: hp.x, y: hp.y, s: 0, nx: 0, ny: -1, g: true }];   // 주인공 발자국 (s = 지나온 길이)
    game.trailS = 0;
    game.total = game.level.sleepers.length;       // 배치된 작은 물방울 수 (평가 기준)
    game.rescued = 0;                              // 도착한 작은 물방울
    game.lost = 0;                                 // 죽은 작은 물방울
    game.heroHome = false;                         // 주인공이 잉크병에 닿음 (스킵 가능)
    game.heroIn = false;                           // 주인공이 잉크병 안에 들어감 (정화에 셈)
    game.goalQueue = [];                           // 잉크병 앞에 줄 선 물방울 (닿은 순서)
    game.entering = [];                            // 잉크병 입구로 뛰어드는 중
    game.enterCdMs = 0;
    game.lastReachMs = 0;
    game.jarCols = [];                             // 잉크병에 들어간 물방울 색 (정화된 잉크병 색에 섞임, 사용자 결정 2026-10-20)                          // 마지막으로 잉크병에 닿은 시각 (별 평가 시간 — 들어가는 연출 시간은 빼고)
    var lowest = lv.ground.reduce(function (m, g) { return Math.max(m, g.top); }, 600);
    game.failY = lowest + D.physics.failY - 600;
    game.inkMax = lv.ink + (game.account.inkBonus || 0);
    game.ink = game.inkMax;
    game.stops = G.Rules.newStops(lv.stops);
    game.stopped = false;
    game.stoppedMs = 0;
    game.stroke = null;
    game.lines = [];
    game.fallen = [];                              // 노랑으로 잘려 떨어진 배치된 선 조각
    game.fx = [];
    game.eraserX = lv.start.x - D.eraser.startBack;
    game.status = 'ready';
    game.failReason = '';
    game.timeMs = 0;
    game.runMs = 0;                                // 게임 시간 (정지 중엔 안 흐름) — 지우개 출발에 씀
    game.finishedAt = 0;
    game.result = null;
    game.stopsUsedThisRun = 0;
    game.starKeys = [];                            // 이번 판에 주인공이 주운 별
    game.starsTotal = game.level.items.filter(function (it) { return it.kind === 'star'; }).length;
    game.attempt += 1;
    if (lv.inks.indexOf(game.color) < 0) game.color = lv.inks.indexOf('black') >= 0 ? 'black' : (lv.inks[0] || 'black');
  },

  start: function (game) { if (game.status === 'ready') game.status = 'run'; },
  setMode: function () {},

  setColor: function (game, c) {
    if (!G.DATA.inks[c]) return false;
    if (game.level.data.inks.indexOf(c) < 0) { game.toast(G.T('toast.inkLocked', { ink: G.DATA.inks[c].name })); return false; }
    game.color = c;
    return true;
  },

  toggleStop: function (game) {
    if (game.status !== 'run') return;
    if (game.stopped) { this.resume(game); return; }
    if (!game.level.data.infStops && !G.Rules.useStop(game.stops)) { game.toast(G.T('toast.noStops')); return; }   // 정지 무제한이면 안 줄어듦 (레벨 툴, 사용자 요청 2026-10-21)
    game.stopped = true;
    game.stoppedMs = 0;
    game.stopsUsedThisRun += 1;
  },

  resume: function (game) {
    if (!game.stopped) return;
    G.Draw.end(game);
    G.Draw.activateAll(game);
    game.stopped = false;
  },

  scale: function (game) { return game.stopped ? 0 : 1; },

  walking: function (game) { return game.drops.filter(function (d) { return d.state === 'walk'; }); },

  update: function (game, realMs) {
    for (var i = game.messages.length - 1; i >= 0; i--) {
      game.messages[i].ms -= realMs;
      if (game.messages[i].ms <= 0) game.messages.splice(i, 1);
    }
    if (game.status !== 'run') return;
    if (game.fx.length) game.fx = game.fx.filter(function (f) { return f.real ? Date.now() - f.real < 1500 : game.timeMs - f.t < 1000; });
    if (game.stopped) game.stoppedMs += realMs;
    game.timeMs += realMs;
    var s = this.scale(game);
    if (s <= 0) return;                            // 완전 정지: 물리·지우개 모두 멈춤
    var fx = game.level.data.fx, self = this, walk = this.walking(game);
    game.runMs += realMs * s;
    var free = walk.filter(function (d) { return d.mode === 'hero' || d.mode === 'free'; });
    var liners = walk.filter(function (d) { return d.mode === 'line'; });
    var joiners = walk.filter(function (d) { return d.mode === 'join'; });

    var vyBefore = free.map(function (d) { return { g: d.grounded, vy: d.body.velocity.y }; });
    free.forEach(function (d) { G.Drop.control(d, s, fx); });
    liners.forEach(function (d) { self.placeLine(game, d); });
    G.Physics.step(game.engine, s);
    liners.forEach(function (d) { self.checkLine(game, d); });
    free.forEach(function (d, k) {
      G.Drop.sense(d, game.engine, realMs, s, fx);
      d.events.forEach(function (e) { game.fx.push({ type: e, x: d.body.position.x, y: d.body.position.y + d.r, dir: d.dir, t: game.timeMs }); });
      if (!vyBefore[k].g && d.grounded && vyBefore[k].vy >= G.DATA.art.fx.landVy && d.hero) {
        game.fx.push({ type: 'land', x: d.body.position.x, y: d.body.position.y + d.r, t: game.timeMs });
      }
    });
    this.recordTrail(game);
    walk.forEach(function (d) { if (d.state === 'walk' && d.mode !== 'join') G.Drop.tint(d, realMs * s); });
    joiners.forEach(function (d) { self.moveJoin(game, d, realMs * s); });
    G.Draw.rise(game, s, fx);
    G.Draw.cleanup(game);
    this.moveEraser(game, s);

    walk.forEach(function (d) {
      if (d.state !== 'walk' || game.status !== 'run') return;
      var p = d.body.position;
      if (d.dead) return self.kill(game, d, d.dead);
      if (p.y > game.failY) return self.kill(game, d, 'fall');
      if (p.x - d.r < game.eraserX) return self.kill(game, d, 'erased');
      self.collect(game, d);
      if (d.hero || !game.level.data.drops.follow) self.wake(game, d);
      if (d.mode === 'free' && game.level.data.drops.follow) self.rejoin(game, d);
      if (self.inGoal(game, p)) self.arrive(game, d);
    });
    if (game.status !== 'run') return;
    this.updateGoal(game, realMs * s);
    if (game.heroHome && !this.walking(game).length && !game.goalQueue.length && !game.entering.length) this.clear(game);
  },

  // 지우개: 출발 delay 뒤 주인공 속도의 pct% 로 오른쪽으로 (게임 시간 기준이라 정지 중엔 멈춤)
  moveEraser: function (game, s) {
    var E = game.level.data.eraser;
    if (game.runMs < E.delayMs) return;
    game.eraserX += game.level.data.drops.heroSpeed * E.pct / 100 * s;
    for (var i = game.lines.length - 1; i >= 0; i--) {   // 지우개가 지나간 선도 지움 (잉크는 돌아오지 않음)
      var ln = game.lines[i], pts = G.Draw.worldPts(ln), maxX = -Infinity;
      pts.forEach(function (q) { maxX = Math.max(maxX, q.x); });
      if (maxX < game.eraserX) {
        var lp = pts[pts.length - 1];
        game.fx.push({ type: 'erasePuff', x: lp.x, y: lp.y, r: 14, line: true, real: Date.now(), t: game.timeMs });
        G.Draw.drop(game, ln, false);
      }
    }
  },

  // ── 대열 ──
  // 주인공 발자국: 1px 이상 움직일 때마다 위치·바닥 방향·바닥에 있었는지 기록. 대열이 다 지나간 앞부분은 버림
  recordTrail: function (game) {
    var h = game.hero, tr = game.trail;
    if (h.state !== 'walk' || !h.body) return;
    var p = h.body.position, last = tr[tr.length - 1], dx = p.x - last.x, dy = p.y - last.y, len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return;
    var n = h.groundN || { x: 0, y: -1 };
    game.trailS += len;
    tr.push({ x: p.x, y: p.y, s: game.trailS, nx: n.x, ny: n.y, g: !!h.grounded, c: h.under || null });   // c: 주인공이 밟은 색 (대열 물들기)
    if (tr.length > 3000) {
      var minS = game.trailS - game.level.data.drops.gap * (game.line.length + 2);
      game.line.forEach(function (d) { if (d.s != null) minS = Math.min(minS, d.s); });
      var cut = 0;
      while (cut < tr.length - 2 && tr[cut + 1].s < minS - 50) cut++;
      if (cut) tr.splice(0, cut);
    }
  },

  // 발자국 위 길이 s 지점 (사이는 보간). 작은 물방울 중심 = 주인공 중심을 바닥 방향으로 반지름 차만큼 내린 곳
  trailAt: function (game, s, r) {
    var tr = game.trail, lo = 0, hi = tr.length - 1;
    if (s <= tr[0].s) hi = 0;
    else if (s >= tr[hi].s) lo = hi;
    else {
      while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (tr[mid].s <= s) lo = mid; else hi = mid; }
    }
    var a = tr[lo], b = tr[hi], u = b.s > a.s ? (s - a.s) / (b.s - a.s) : 0, off = G.DATA.drop.heroRadius - r;
    return { x: a.x + (b.x - a.x) * u - a.nx * off, y: a.y + (b.y - a.y) * u - a.ny * off, g: a.g && b.g };
  },

  // 발자국 s0 ~ s1 사이에서 주인공이 밟은 색. 닿자마자 튕기는 색(빨강)이 있으면 그 색 먼저
  //   (사용자 요청 2026-10-21: 주인공은 빨강에 1~2스텝만 닿고 튕겨서, 발자국을 따라 옮겨지는 대열 물방울은 빨강에 직접 닿지 못해 안 물들던 문제)
  trailColor: function (game, s0, s1) {
    var tr = game.trail, lo = 0, hi = tr.length - 1, out = null, touch = G.DATA.tint.touchColors;
    if (s0 == null || !(s1 > s0)) return null;
    while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (tr[mid].s <= s0) lo = mid; else hi = mid; }
    for (var i = lo; i < tr.length && tr[i].s <= s1; i++) {
      var c = tr[i].c;
      if (!c || tr[i].s < s0) continue;
      if (touch.indexOf(c) >= 0) return c;
      out = out || c;
    }
    return out;
  },

  // 대열에서 내 자리: 주인공 뒤 (순서 + 1) × 간격. 주인공이 도착했으면 모두 발자국 끝(잉크병)으로
  slotS: function (game, d) {
    if (game.heroHome) return game.trailS;
    return Math.max(game.trail[0].s, game.trailS - game.level.data.drops.gap * (game.line.indexOf(d) + 1));
  },

  // 물리 스텝 전: 대열 물방울을 제자리(발자국 위)로 옮김
  placeLine: function (game, d) {
    var F = G.DATA.drop.follow, M = G.Physics.M, want = this.slotS(game, d), s0 = d.s;
    if (game.heroHome) d.s = Math.min(want, d.s + Math.max(game.level.data.drops.heroSpeed, (want - d.s) * F.catchUp));
    else if (want > d.s) d.s += (want - d.s) * F.catchUp;
    var t = this.trailAt(game, d.s, d.r);
    d.trailC = this.trailColor(game, s0, d.s);
    d.prev = { x: d.body.position.x, y: d.body.position.y };
    d.expect = t;
    M.Body.setPosition(d.body, { x: t.x, y: t.y });
    M.Body.setVelocity(d.body, { x: 0, y: 0 });
  },

  // 물리 스텝 뒤: 밀렸거나(새로 그린 선·떨어지는 선) 주인공이 밟았던 바닥이 사라졌으면 이탈
  checkLine: function (game, d) {
    var F = G.DATA.drop.follow, M = G.Physics.M, b = d.body, e = d.expect;
    var dx = b.position.x - e.x, dy = b.position.y - e.y, disp = Math.sqrt(dx * dx + dy * dy);
    var sup = G.Drop.support(d, game.engine);
    if (sup.spike) { d.dead = 'spike'; return; }
    d.vel = { x: e.x - d.prev.x, y: e.y - d.prev.y };
    d.under = d.trailC || sup.color;               // 주인공이 그 자리에서 밟은 색이 먼저 (직접 닿은 색은 그다음)
    if (Math.abs(d.vel.x) > 0.05) d.dir = d.vel.x > 0 ? 1 : -1;
    d.nudge = disp > F.nudgeDist ? (d.nudge || 0) + 1 : 0;
    d.unsup = e.g && !sup.ground ? (d.unsup || 0) + 1 : 0;
    if (disp > F.breakDist || d.nudge > F.nudgeSteps || d.unsup > F.unsupportedSteps) { this.detach(game, d); return; }
    M.Body.setPosition(b, { x: e.x, y: e.y });     // 중력으로 살짝 내려간 만큼 되돌림
    d.grounded = e.g;
  },

  detach: function (game, d) {
    this.unline(game, d);
    d.mode = 'free';
    G.Drop.setFilter(d, 'free', game.level.data.drops.collide);
    G.Physics.M.Body.setVelocity(d.body, d.vel || { x: 0, y: 0 });
    d.nudge = d.unsup = 0; d.s = null; d.turnCdMs = 0;
    d.detaches = (d.detaches || 0) + 1;
    d.detachAt = game.runMs;
  },

  unline: function (game, d) { var i = game.line.indexOf(d); if (i >= 0) game.line.splice(i, 1); },

  // 대열 끝에 붙기 시작: wakeMs 동안 제자리에서 깨어나는 모션 → hopMs 동안 대열 끝자리로 통 튐 (사용자 결정 2026-10-20)
  startJoin: function (game, d, wakeMs) {
    d.mode = 'join';
    G.Drop.setFilter(d, 'join');
    game.line.push(d);
    d.join = { t: 0, wake: wakeMs, from: { x: d.body.position.x, y: d.body.position.y } };
    d.s = null;
  },

  moveJoin: function (game, d, ms) {
    var F = G.DATA.drop.follow, M = G.Physics.M, j = d.join, prev = { x: d.body.position.x, y: d.body.position.y }, p;
    j.t += ms;
    if (j.t < j.wake) p = j.from;
    else {
      var u = Math.min(1, (j.t - j.wake) / F.hopMs), slot = this.slotS(game, d), tp = this.trailAt(game, slot, d.r);
      p = { x: j.from.x + (tp.x - j.from.x) * u, y: j.from.y + (tp.y - j.from.y) * u - F.hopHeight * 4 * u * (1 - u) };
      if (u >= 1) {
        d.mode = 'line'; d.s = slot; d.join = null; d.nudge = d.unsup = 0;
        G.Drop.setFilter(d, 'line');
      }
    }
    M.Body.setPosition(d.body, p);
    M.Body.setVelocity(d.body, { x: 0, y: 0 });
    d.vel = { x: p.x - prev.x, y: p.y - prev.y };
    if (Math.abs(d.vel.x) > 0.05) d.dir = d.vel.x > 0 ? 1 : -1;
    d.grounded = d.mode === 'line' || j.t < j.wake;
  },

  // 혼자 걷는 물방울이 주인공에 닿으면 다시 대열 끝으로
  rejoin: function (game, d) {
    var h = game.hero;
    if (h.state !== 'walk' || !h.body || !d.grounded) return;              // 떨어지는 중엔 안 붙음
    if (d.detachAt != null && game.runMs - d.detachAt < G.DATA.drop.follow.rejoinCdMs) return;
    var reach = (d.r + h.r) * G.DATA.drop.follow.rejoinReach, dx = d.body.position.x - h.body.position.x, dy = d.body.position.y - h.body.position.y;
    if (dx * dx + dy * dy > reach * reach) return;
    this.startJoin(game, d, 0);
    game.fx.push({ type: 'star', x: d.body.position.x, y: d.body.position.y, t: game.timeMs });
  },

  // 잠든 물방울: 주인공이 닿으면 깨어나 대열 끝에 붙음 (대열 켬). 대열 끔이면 걷는 물방울 누구나 깨우고 그 방향으로 출발 (사용자 결정 2026-10-20)
  wake: function (game, d) {
    var D = G.DATA.drop, p = d.body.position;
    game.level.sleepers.forEach(function (sl) {
      if (sl.state !== 'sleep') return;
      var reach = (d.r + D.smallRadius) * D.wakeReach, dx = sl.x - p.x, dy = sl.y - p.y;
      if (dx * dx + dy * dy > reach * reach) return;
      sl.state = 'awake';
      var nd = G.Drop.create(game.engine, sl.x, sl.y, false, d.dir, game.level.data.drops);
      game.drops.push(nd);
      if (game.level.data.drops.follow) G.Game.startJoin(game, nd, G.DATA.drop.follow.wakeMs);
      game.fx.push({ type: 'star', x: sl.x, y: sl.y, t: game.timeMs });
    });
  },

  // 아이템: 아무 물방울이나 닿으면 획득, 별은 주인공만 (사용자 결정 2026-10-20). 정지 +1 은 이 스테이지에서만
  collect: function (game, d) {
    var D = G.DATA, p = d.body.position, acc = game.account;
    game.level.items.forEach(function (it) {
      if (it.got) return;
      if (it.kind === 'star' && !d.hero) return;   // 별은 주인공만 (사용자 결정 2026-10-20)
      var q = it.prop, reach = d.r + (q.size || D.props[it.kind].size) * D.level.pickup;
      var dx = q.x - p.x, dy = q.y - p.y;
      if (dx * dx + dy * dy > reach * reach) return;
      it.got = true; it.gotMs = game.timeMs;
      game.fx.push({ type: 'star', x: q.x, y: q.y, t: game.timeMs });
      if (it.kind === 'star') game.starKeys.push(it.key);
      else if (it.kind === 'stopup') {
        game.stops.left += D.stopUp; game.stops.max += D.stopUp;
        game.toast(G.T('toast.stopUp', { n: D.stopUp }));
      } else if (it.kind === 'inkup') {
        acc.bottles[it.key] = true;
        acc.inkBonus = (acc.inkBonus || 0) + D.ink.upAmount;
        game.inkMax += D.ink.upAmount; game.ink += D.ink.upAmount;
        game.toast(G.T('toast.inkUp', { n: D.ink.upAmount }));
        if (game.onAccountChange) game.onAccountChange(game);
      }
    });
  },

  // 잉크병에 닿음: 몸체를 빼고 잉크병 앞 줄에 섬 → 닿은 순서대로 하나씩 입구로 뛰어듦 (사용자 요청 2026-10-20: 한꺼번에 빨리 들어가지 않게)
  arrive: function (game, d) {
    d.state = 'queue';
    this.unline(game, d);
    d.qx = d.body.position.x; d.qy = d.body.position.y;
    G.Drop.remove(game.engine, d);
    game.goalQueue.push(d);
    game.lastReachMs = game.timeMs;
    if (d.hero) { game.heroHome = true; game.toast(G.T('toast.heroHome')); }
  },

  // 잉크병에 닿았는가: 도착 x 오른쪽이면서 잉크병 높이 안 (사용자 결정 2026-10-20: 도착을 위아래로도 옮김)
  inGoal: function (game, p) {
    var J = G.DATA.art.goalJar, g = game.level.data.goal;
    return p.x >= g.x && p.x <= g.x + J.w && p.y >= g.y - J.h - 60 && p.y <= g.y + 10;
  },

  // 잉크병 입구 (그림 기준: 왼쪽 끝 ≈ 도착 x)
  goalMouth: function (game) {
    var J = G.DATA.art.goalJar, gx = game.level.goalX, gy = game.level.data.goal.y;
    return { x: gx - 10 + J.w * J.mouth, y: gy - J.h * 0.95, gy: gy };
  },

  // 줄: 잉크병 왼쪽 앞으로 간격대로 섬 (미끄러져 자리로). 맨 앞부터 gapMs 마다 하나씩 enterMs 동안 포물선으로 뛰어들며 작아짐
  updateGoal: function (game, ms) {
    var E = G.DATA.goalEnter, m = this.goalMouth(game), self = this;
    game.enterCdMs = Math.max(0, game.enterCdMs - ms);
    game.goalQueue.forEach(function (d, k) {
      var tx = game.level.goalX - E.spacing * (k + 0.5), ty = m.gy - d.r;   // 잉크병 바닥 높이에 줄 섬 (공중 잉크병이어도)
      d.qx += (tx - d.qx) * Math.min(1, E.slide * ms / 16.7);
      d.qy += (ty - d.qy) * Math.min(1, E.slide * ms / 16.7);
    });
    if (game.goalQueue.length && game.enterCdMs <= 0) {
      var d = game.goalQueue.shift();
      d.state = 'enter';
      d.enter = { t: 0, x0: d.qx, y0: d.qy };
      game.entering.push(d);
      game.enterCdMs = E.gapMs;
    }
    game.entering = game.entering.filter(function (d) {
      d.enter.t += ms;
      if (d.enter.t < E.enterMs) return true;
      self.absorb(game, d, m);
      return false;
    });
  },

  // 입구로 뛰어드는 중인 물방울 위치·크기 (그리기용)
  enterPose: function (game, d) {
    var E = G.DATA.goalEnter, m = this.goalMouth(game), u = Math.min(1, d.enter.t / E.enterMs), e = d.enter;
    var top = Math.min(e.y0, m.y) - E.hopHeight;
    var x = e.x0 + (m.x - e.x0) * u;
    var y = (1 - u) * (1 - u) * e.y0 + 2 * u * (1 - u) * top + u * u * m.y;   // 2차 베지어 포물선
    return { x: x, y: y, scale: 1 - u * (1 - E.endScale), u: u };
  },

  absorb: function (game, d, m) {
    d.state = 'home';
    game.fx.push({ type: 'absorb', x: m.x, y: 0, t: game.timeMs });
    var base = G.DATA.colors.jarClear, a = d.tc ? (d.ta || 0) : 0;
    game.jarCols.push(base.map(function (v, i) { return v + ((d.tc ? d.tc[i] : v) - v) * a; }));
    if (d.hero) game.heroIn = true; else game.rescued += 1;
  },

  // reason: 실패 이유 이름 fall / erased / spike (글자는 uitext.js fail.*). 스킵으로 지울 때는 ''
  kill: function (game, d, reason) {
    if (reason === 'erased' && d.body) {   // 지워지는 순간: 가루 효과 + 지워진 얼굴 (화면 시간으로, 실패 뒤에도 재생)
      game.fx.push({ type: 'erasePuff', x: d.body.position.x, y: d.body.position.y, r: d.r, real: Date.now(), t: game.timeMs });
    }
    d.state = 'dead';
    this.unline(game, d);
    G.Drop.remove(game.engine, d);
    if (d.hero) { this.finish(game, 'fail', reason ? G.T('fail.' + reason) : ''); return; }
    game.lost += 1;
  },

  // 정화 정도 0~1: 도착한 물방울(주인공 포함) / 전체(주인공 + 배치된 작은 물방울)
  // 정화된 잉크병 색: 들어간 물방울 색의 평균 (없으면 하늘색)
  jarColor: function (game) {
    var n = game.jarCols.length;
    if (!n) return G.DATA.colors.jarClear;
    var sum = [0, 0, 0];
    game.jarCols.forEach(function (c) { sum[0] += c[0]; sum[1] += c[1]; sum[2] += c[2]; });
    return sum.map(function (v) { return v / n; });
  },

  purity: function (game) { return (game.rescued + (game.heroIn ? 1 : 0)) / (game.total + 1); },

  canSkip: function (game) { return game.status === 'run' && game.heroHome; },
  skip: function (game) {
    if (!this.canSkip(game)) return;
    var self = this;
    this.walking(game).forEach(function (d) { self.kill(game, d, ''); });   // 기다리지 않은 물방울은 죽은 것 (사용자 결정 2026-10-20)
    var m = this.goalMouth(game);                  // 이미 잉크병에 닿아 줄 선 물방울은 바로 들어간 것으로
    game.goalQueue.concat(game.entering).forEach(function (d) { self.absorb(game, d, m); });
    game.goalQueue = []; game.entering = [];
    this.clear(game);
  },

  clear: function (game) { this.finish(game, 'clear', ''); },

  finish: function (game, status, reason) {
    game.status = status;
    game.finishedAt = Date.now();
    game.failReason = reason;
    game.stopped = false;
    game.stroke = null;
    game.result = null;
    if (status === 'clear') {
      game.result = G.Rules.clearResult({
        stars: game.starKeys, starsTotal: game.starsTotal, rescued: game.rescued, total: game.total, heroIn: game.heroIn,
        timeMs: game.lastReachMs || game.timeMs
      });
    }
    if (game.onFinish) game.onFinish(game);
  }
};

</script>
<script>
// assets.js
// 이미지 불러오기. 단일 파일 빌드는 G.EMBED(내장 이미지)를 먼저 보고, 개발본은 assets/ 폴더에서 읽는다.
// 이미지가 없거나 아직 안 불러졌으면 get()이 null → 화면은 색 블록으로 그린다.
// (개발본에서 없는 파일은 브라우저 콘솔에 404로 남지만 게임에는 영향 없음)
var G = G || {};

G.Assets = {
  img: {},

  load: function () {
    var self = this, art = G.DATA.art;
    art.images.forEach(function (name) {
      var src = G.EMBED && G.EMBED[name];
      if (!src) {
        if (G.SINGLE_FILE) return;               // 제출본은 외부 파일을 읽지 않는다
        src = art.dir + name + '.png';
      }
      var im = new Image();
      im.onload = function () { self.img[name] = im; };
      im.src = src;
    });
  },

  get: function (name) { return this.img[name] || null; }
};

</script>
<script>
// props.js
// 땅·프랍 그리기와 물리 바디 만들기. 게임(ui.js)과 레벨 툴(tools/editor.js)이 같은 함수를 써서 보이는 모습이 같다.
var G = G || {};

G.Props = (function () {
  function def(type) { return G.DATA.props[type]; }

  // 화면에서 차지하는 사각형 (선택·충돌 검사용)
  function rect(p) {
    var d = def(p.type);
    if (d && d.box) return { x: p.x, y: p.y, w: p.w, h: p.h };
    if (p.type === 'text') {
      var s = p.size || d.size, w = (p.text || '').length * s * 0.95;
      return { x: p.x, y: p.y - s, w: Math.max(w, s), h: s * 1.3 };
    }
    var size = p.size || (d && d.size) || 40;
    return { x: p.x - size / 2, y: p.y - size / 2, w: size, h: size };
  }

  // 원본 조각(sx,sy,sw,sh)을 화면 칸(dx,dy,dw,dh)에 한 조각 크기(tw,th)로 반복해서 채운다. 끝은 잘라서
  function tile(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh, tw, th) {
    for (var y = 0; y < dh - 0.01; y += th) {
      var hh = Math.min(th, dh - y), fh = hh / th;
      for (var x = 0; x < dw - 0.01; x += tw) {
        var ww = Math.min(tw, dw - x), fw = ww / tw;
        ctx.drawImage(img, sx, sy, sw * fw, sh * fh, dx + x, dy + y, ww, hh);
      }
    }
  }

  // 이미지를 방식에 맞춰 x,y,w,h 에 그린다
  function drawImg(ctx, name, mode, img, x, y, w, h) {
    var A = G.DATA.art;
    if (mode === 'nine') {
      // 9분할: 테두리(모서리·변)는 원본 비율 그대로, 가운데·변은 늘리지 않고 같은 크기로 반복 (벽돌 무늬가 찌그러지지 않게)
      var sl = A.slices[name] || { src: 32, dst: 16 }, s = sl.src, k = sl.dst / sl.src;
      var d = Math.min(sl.dst, w / 2, h / 2), iw = img.width, ih = img.height;
      var sx = [0, s, iw - s, iw], dx = [x, x + d, x + w - d, x + w];
      var sy = [0, s, ih - s, ih], dy = [y, y + d, y + h - d, y + h];
      for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) {
        var dw = dx[i + 1] - dx[i], dh = dy[j + 1] - dy[j], sw = sx[i + 1] - sx[i], sh = sy[j + 1] - sy[j];
        if (dw <= 0 || dh <= 0) continue;
        tile(ctx, img, sx[i], sy[j], sw, sh, dx[i], dy[j], dw, dh, i === 1 ? sw * k : dw, j === 1 ? sh * k : dh);
      }
    } else if (mode === 'stack') {               // 폭에 맞춰 위에서부터 세로로 쌓기 (입체 돌 블록용)
      var cr = A.wallCrop, th = w * cr[3] / cr[2];
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      for (var yy = y; yy < y + h; yy += th) ctx.drawImage(img, cr[0], cr[1], cr[2], cr[3], x, yy, w, th);
      ctx.restore();
    } else if (mode === 'tile') {                 // 높이에 맞춰 가로로 반복 (가시)
      var tw = img.width * h / img.height;
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      for (var xx = x; xx < x + w; xx += tw) ctx.drawImage(img, xx, y, tw, h);
      ctx.restore();
    } else {                                      // fit: 비율 유지, 가운데
      var k = Math.min(w / img.width, h / img.height), fw = img.width * k, fh = img.height * k;
      ctx.drawImage(img, x + (w - fw) / 2, y + (h - fh) / 2, fw, fh);
    }
  }

  // 목록에서 있는 이미지 하나를 골라 그린다. 없으면 false
  function drawFirst(ctx, list, r) {
    for (var i = 0; i < (list || []).length; i++) {
      var img = G.Assets.get(list[i][0]);
      if (img) { drawImg(ctx, list[i][0], list[i][1], img, r.x, r.y, r.w, r.h); return true; }
    }
    return false;
  }

  function drawStarShape(ctx, cx, cy, r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  // 배치된 선: 검은 다이아몬드처럼 광이 나는 막대 (사용자 결정 2026-10-20). 이미지(prop_crystal)가 있으면 9분할
  //   r = { x, y, w(길이), h(두께), angle(도) } — 가운데 기준으로 돌려 그림. 양 끝은 그대로, 가운데는 반복하지 않고 늘림 (사용자 결정 2026-10-20: 하나로 보이게)
  function drawCrystal(ctx, r) {
    var img = G.Assets.get('prop_crystal'), len = r.w, th = r.h;
    ctx.save();
    ctx.translate(r.x + r.w / 2, r.y + r.h / 2);

      if (len - eL - eR > 0.5) ctx.drawImage(img, A.left, 0, mid, img.height, x0 + eL - 0.3, y0, len - eL - eR + 0.6, th);

    }

    ctx.beginPath();                               // 양 끝이 뾰족한 결정 모양
    ctx.moveTo(x0, 0); ctx.lineTo(x0 + t * 0.6, y0); ctx.lineTo(x0 + len - t * 0.6, y0); ctx.lineTo(x0 + len, 0); ctx.lineTo(x0 + len - t * 0.6, y0 + t); ctx.lineTo(x0 + t * 0.6, y0 + t);

  // 잠든 물방울 (그림 drop_sleep, 없으면 작은 캐릭터를 흐리게 + 감은 눈 "z")
  function drawSleeper(ctx, x, y, r) {

    ctx.globalAlpha = 1;
    ctx.fillStyle = C.outline; ctx.font = 'bold ' + Math.round(r * 0.9) + 'px sans-serif';

  // opts: { editor: true } 이면 그림이 없는 장식도 자리 표시
  function draw(ctx, p, opts) {
    var d = def(p.type), C = G.DATA.colors, r = rect(p);

    }
    if (p.type === 'crystal') { drawCrystal(ctx, p); return; }   // 돌린 막대 (사용자 결정 2026-10-20)
    if (drawFirst(ctx, d.imgs, r)) return;
    if (p.type === 'inkup') {                    // 그림이 없을 때: 먹색 잉크 병 + "+"
      var bw = r.w * 0.5, bh = r.h * 0.62, bx = p.x - bw / 2, by = p.y - bh / 2 + r.h * 0.08;

      ctx.fillStyle = '#C9A26B'; ctx.fillRect(p.x - bw * 0.25, by - r.h * 0.18, bw * 0.5, r.h * 0.18);
      ctx.strokeRect(p.x - bw * 0.25, by - r.h * 0.18, bw * 0.5, r.h * 0.18);

    }

      ctx.fillStyle = d.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.lineWidth = 3; ctx.strokeStyle = C.outline; ctx.stroke();
      ctx.fillStyle = C.outline; ctx.font = 'bold ' + Math.round(rr * 0.9) + 'px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('+1', p.x, p.y + rr * 0.32); ctx.textAlign = 'left';
      return;
    }
    if (p.type === 'shooter') {                  // 그림이 없을 때: 회색 상자 + 쏘는 방향의 포구
      var a = (p.angle != null ? p.angle : d.angle) * Math.PI / 180, cx = p.x + p.w / 2, cy = p.y + p.h / 2, mr = Math.min(p.w, p.h) * 0.22;

      ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fillStyle = '#1E1A22'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - Math.cos(a) * mr, cy - Math.sin(a) * mr - 4, 4, 0, 6.283); ctx.fill();

    }

      ctx.fillStyle = C.star; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = C.outline; ctx.stroke();

    }

  // 땅: 속은 ground_fill 무늬(없으면 색), 윗면은 ground_top 띠(없으면 굵은 선)
  var patterns = {};
  // 땅 여러 개를 한꺼번에 (사용자 요청 2026-10-20: 겹치거나 맞붙인 땅의 이음새가 안 보이게)
  //   1) 채우기 전부 → 2) 세로 테두리는 바깥쪽이 빈 곳인 부분만 → 3) 윗면 그림은 더 높은 땅 속에 묻힌 부분을 빼고, 세계 좌표에 맞춰 이어 붙임
  function drawGrounds(ctx, list) {
    var C = G.DATA.colors, A = G.DATA.art, D0 = G.DATA.level.groundDepth;
    function hh(g) { return g.h || D0; }          // 땅 높이 (사용자 결정 2026-10-20: 땅마다 h)

    if (fill && A.groundTint) { ctx.fillStyle = A.groundTint; list.forEach(function (g) { ctx.fillRect(g.x0, g.top, g.x1 - g.x0, hh(g)); }); }

    // 구간 [a, b] 에서 빼야 할 구간들을 뺀 나머지
    function minus(a, b, cuts) {

      [[g.x0, g.x0 - eps], [g.x1, g.x1 + eps]].forEach(function (e) {
        var cuts = list.filter(function (h) { return h !== g && h.x0 <= e[1] && e[1] <= h.x1; })
          .map(function (h) { return [h.top, h.top + hh(h)]; });
        minus(g.top, g.top + hh(g), cuts).forEach(function (s) { ctx.moveTo(e[0], s[0]); ctx.lineTo(e[0], s[1]); });
      });
    });
    list.forEach(function (g) {                   // 아랫면: 바로 아래에 다른 땅이 있는 폭은 숨김 (공중 땅의 밑면)
      var by = g.top + hh(g), cuts = list.filter(function (h) { return h !== g && h.top <= by + eps && by + eps <= h.top + hh(h); })
        .map(function (h) { return [h.x0, h.x1]; });
      minus(g.x0, g.x1, cuts).forEach(function (sp) { ctx.moveTo(sp[0], by); ctx.lineTo(sp[1], by); });
    });
    ctx.stroke();

    list.forEach(function (g) {                   // 윗면: 더 높은 땅의 채우기 속에 있는 부분은 빼고 그림
      var cuts = list.filter(function (h) { return h !== g && h.top < g.top - 1 && g.top < h.top + hh(h); })
        .map(function (h) { return [h.x0, h.x1]; });
      var spans = minus(g.x0, g.x1, cuts);
      if (top) {
        var th = A.groundTop.h, tw = top.width * th / top.height, y = g.top - A.groundTop.up;
        spans.forEach(function (s) {
          ctx.save();
          ctx.beginPath(); ctx.rect(s[0], y - 2, s[1] - s[0], th + 4); ctx.clip();
          for (var x = Math.floor(s[0] / tw) * tw; x < s[1]; x += tw) ctx.drawImage(top, x, y, tw, th);   // 세계 좌표 기준 → 맞붙여도 무늬가 이어짐
          ctx.restore();
        });
      } else {
        ctx.beginPath();
        spans.forEach(function (s) { ctx.moveTo(s[0], g.top); ctx.lineTo(s[1], g.top); });
        ctx.stroke();
      }
    });
  }
  function drawGround(ctx, g) { drawGrounds(ctx, [g]); }

  // 물리: 단단한 프랍만 정적 사각형으로
  function build(engine, p) {
    var d = def(p.type);
    if (!d || !d.solid) return null;
    if (p.type === 'crystal') return null;          // 배치된 선은 level.js 가 따로 만듦 (자를 수 있게)
    return G.Physics.add(engine, G.Physics.staticRect(p.x + p.w / 2, p.y + p.h / 2, p.w, p.h, { label: p.type }));

  return { def: def, rect: rect, draw: draw, drawGround: drawGround, drawGrounds: drawGrounds, build: build, drawStarShape: drawStarShape,

})();

<script>
// ui.js
// 화면 그리기 — 물방울 무리 시험판 (사용자 결정 2026-10-20). 이미지가 없으면 코드로 그린 임시 모양.
//   카메라 (사용자 결정 2026-10-21): 주인공과 대열만 따라감(기본 줌, 스테이지 camera.zoom). 이탈한 물방울 때문에 줌 아웃하지 않음.
//   마우스 휠이 우선이고 잠시 뒤 기본 줌으로 돌아옴. 화면 위 끝·아래 끝(camera.top/bottom) 밖은 안 보여 줌.
//   화면 밖 물방울은 가장자리 화살표. 글자·UI 크기는 uitext.js (G.T / G.TS). 지우개(왼쪽 흰 영역), 검은 잉크병 정화, 아래 5색 병 선반, 스킵 버튼
var G = G || {};

G.UI = (function () {
  var C = G.DATA.colors, V = G.DATA.view;
  var cam = { x: 0, y: 0, z: 1, manualZ: null, manualMs: 0, inited: false };
  var specks = null;

  function makeSpecks() {
    var rnd = G.makeRng(G.DATA.seed), out = [];
    for (var i = 0; i < 160; i++) out.push({ x: rnd() * 4000, y: rnd() * 720, r: 1 + rnd() * 2 });
    return out;
  }

  // ---- 카메라 ----
  // 따라갈 물방울: 주인공 + 대열(붙는 중 포함). 혼자 걷는(이탈한) 물방울은 빼고 화살표로만 (사용자 결정 2026-10-21)
  function focusBox(game) {
    var list = G.Game.walking(game).filter(function (d) { return d.mode !== 'free'; }), box = null;
    if (!list.length) {                            // 아무도 안 걸으면 잉크병 쪽
      var gx = game.level.goalX, gy = game.level.data.goal.y;
      return { x0: gx - 200, x1: gx + 300, y0: gy - 200, y1: gy, hx: gx, hy: gy - 30 };
    }
    list.forEach(function (d) {
      var p = d.body.position;
      if (!box) box = { x0: p.x, x1: p.x, y0: p.y, y1: p.y };
      box.x0 = Math.min(box.x0, p.x); box.x1 = Math.max(box.x1, p.x);
      box.y0 = Math.min(box.y0, p.y); box.y1 = Math.max(box.y1, p.y);
    });
    var lead = game.hero.state === 'walk' ? game.hero : list[0];
    box.hx = lead.body.position.x; box.hy = lead.body.position.y;
    box.x0 = Math.max(box.x0, game.eraserX);         // 왼쪽은 지우개까지만 (사용자 결정 2026-10-20)
    return box;
  }

  function updateCamera(game, realMs) {
    if (game.status === 'fail' && cam.inited) return;   // 실패하면 그 자리에서 멈춤
    var A = G.DATA.art.camera, box = focusBox(game), LC = game.level.data.camera;
    if (cam.manualMs > 0 && G.Game.scale(game) > 0) cam.manualMs -= realMs || 16;
    if (cam.manualMs <= 0) cam.manualZ = null;
    var base = Math.max(A.minZoom, Math.min(A.maxZoom, LC.zoom));      // 기본 줌 (스테이지마다, 레벨 툴)
    var tz = cam.manualZ != null ? cam.manualZ : G.Rules.fitZoom(box, V, A, base);   // 대열이 길 때만 조금 줄어듦
    // 줌 아웃은 빠르게, 줌 인은 천천히 (사용자 요청 2026-10-20: 화면이 확 바뀌지 않게). 휠 줌은 바로
    var k = cam.manualZ != null ? A.zoomOutEase : (tz > cam.z ? A.zoomInEase : A.zoomOutEase);

    var room = Math.max(0, vw / 2 - A.margin);
    var cx = Math.max(box.hx - room, Math.min(box.hx + room, (box.x0 + box.x1) / 2));
    var cy = (box.y0 + box.y1) / 2;
    // 땅이 화면 아래쪽에 오게. 화면 아래 끝 밑·위 끝 위는 안 보여 줌 (사이가 화면보다 좁으면 아래 끝에 맞춤)

  }

  // 휠: 사용자 결정 2026-10-20 — 카메라 줌 (휠이 우선, manualMs 동안 쓰지 않으면 자동으로)
  function wheel(dy) {
    var A = G.DATA.art.camera;
    var z = (cam.manualZ != null ? cam.manualZ : cam.z) * (dy > 0 ? 0.9 : 1.1);
    cam.manualZ = Math.max(A.minZoom, Math.min(A.maxZoom, z));
    cam.manualMs = A.manualMs;
  }
  function resetCamera() { cam.inited = false; cam.manualZ = null; cam.manualMs = 0; }

  function toWorld(sx, sy) { return { x: sx / cam.z + cam.x, y: sy / cam.z + cam.y }; }
  function toScreen(wx, wy) { return { x: (wx - cam.x) * cam.z, y: (wy - cam.y) * cam.z }; }

  function poly(ctx, verts) {
    ctx.beginPath(); ctx.moveTo(verts[0].x, verts[0].y);
    for (var i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
  }
  function path(ctx, pts) {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  }

  // 배경 (레벨 툴도 사용)
  function drawBackground(ctx, name, camX, w, h) {
    w = w || V.w; h = h || V.h;
    ctx.fillStyle = C.paper;
    ctx.fillRect(0, 0, w, h);
    var bg = name && name !== 'none' && G.Assets.get(name);
    if (bg) {
      var bw = bg.width * h / bg.height;
      var off = ((camX * G.DATA.art.bgParallax) % bw + bw) % bw;
      for (var x = -off; x < w; x += bw) ctx.drawImage(bg, x, 0, bw, h);
      return;
    }
    if (!specks) specks = makeSpecks();
    ctx.fillStyle = 'rgba(43,33,24,0.08)';

  // 시작 구멍 (스케치북을 뚫고 나온 구멍)

    ctx.beginPath();
    for (i = 0; i <= n; i++) { a = i / n * 6.283; rr = s * (0.30 + rnd() * 0.06); ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.92); }

    if (dark && empty) {                           // 검은 잉크병 이미지가 정화된 만큼 옅어짐 (아래 하늘색 잉크가 드러남)

  }

  // 지우개 (사용자 요청 2026-10-20: 벽이 아니라 진짜 지우개가 문지르며 다가오게). 그림이 없으면 예전 eraser_edge / 점선
  //   본체는 게임 시간(정지 중엔 멈춤)으로 위아래로 문지르고, 가루는 화면에만 있는 효과(물리 없음)
  var crumbs = [], lastRun = 0, crumbAcc = 0;
  function drawEraser(ctx, game) {
    var E = G.DATA.art.eraser, ex = game.eraserX, top = cam.y - 50, vh = V.h / cam.z, bottom = cam.y + vh + 50;
    var body = G.Assets.get('eraser_body'), smudge = G.Assets.get('eraser_smudge');
    var dt = game.runMs - lastRun; lastRun = game.runMs;
    if (dt < 0 || dt > 200) { dt = 0; crumbs = []; }          // 새 판이거나 오래 멈췄다 돌아오면 가루 비움
    if (ex < cam.x - 300) { crumbs = []; return; }
    // 지운 자리: 흰 종이
    ctx.fillStyle = '#FFFFFF';
    if (ex > cam.x - 10) ctx.fillRect(cam.x - 10, top, ex - cam.x + 10, bottom - top);
    if (!body) {                                    // 그림이 없을 때: 예전 가장자리 그림
      var img = G.Assets.get('eraser_edge');
      if (img) { var eh = bottom - top, ew = img.width * eh / img.height * 0.6; ctx.drawImage(img, ex - ew * 0.75, top, ew, eh); }
      else { ctx.strokeStyle = 'rgba(43,33,24,0.25)'; ctx.lineWidth = 3; ctx.setLineDash([6, 8]); ctx.beginPath(); ctx.moveTo(ex, top); ctx.lineTo(ex, bottom); ctx.stroke(); ctx.setLineDash([]); }
      return;
    }
    // 경계 띠: 왼쪽 흰색이 지운 자리와 이어지고 오른쪽으로 문지른 자국이 옅어짐. 세로로 반복
    if (smudge) {
      var sw = E.smudgeW, sh = smudge.height * sw / smudge.width, sx = ex - sw * 0.35;
      for (var y = Math.floor(top / sh) * sh; y < bottom; y += sh) ctx.drawImage(smudge, sx, y, sw, sh);
    }
    // 본체: 닳은 아래 모서리가 경계 앞 땅(없으면 화면 아래쪽)까지 내려왔다 올라가며 문지름
    var bh = vh * E.bodyH, bw = body.width * bh / body.height, ph = game.runMs / E.rubMs * Math.PI * 2;
    var gTop = G.Level.groundTopAt(game.level.data, ex + 30), base = gTop == null ? cam.y + vh * 0.8 : Math.min(gTop, cam.y + vh * 0.95);
    var cornerY = base - Math.abs(Math.sin(ph)) * vh * E.rubAmp * 2, tilt = Math.sin(ph * 2) * 0.05;
    // 가루: 문지르는 동안 경계에서 오른쪽 위로 튀어 나가 떨어짐 (게임 시간 기준)
    var parts = [G.Assets.get('eraser_crumb_1'), G.Assets.get('eraser_crumb_2'), G.Assets.get('eraser_crumb_3')].filter(Boolean);
    if (parts.length && dt > 0) {

      while (crumbAcc >= E.crumbMs) {

          s: E.crumb[0] + rnd() * (E.crumb[1] - E.crumb[0]), img: parts[Math.floor(rnd() * parts.length)], life: E.crumbLife });
