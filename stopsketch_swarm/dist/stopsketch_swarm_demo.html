    ctx.save();
    ctx.translate(ex, cornerY); ctx.rotate(tilt);
    ctx.drawImage(body, -bw * 0.97, -bh * 0.85, bw, bh);   // 그림 오른쪽 아래(닳은 모서리)가 경계에
    ctx.restore();
    crumbs.forEach(function (c) {
      ctx.save(); ctx.globalAlpha = Math.min(1, c.life / 400); ctx.translate(c.x, c.y); ctx.rotate(c.a);

  }

  // 물감 선 + 색각 보조 무늬 (검정=없음, 빨강=점, 파랑=화살, 노랑=X, 초록=위 화살)
  function drawInkLine(ctx, pts, color, pending) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    ctx.strokeStyle = C[color] || C.ink;
    ctx.setLineDash(pending ? [14, 10] : []);
    path(ctx, pts); ctx.stroke();
    ctx.setLineDash([]);
    if (pending || color === 'black') return;

      if (!len) continue;
      var ux = dx / len, uy = dy / len;

        ctx.beginPath();

        else if (color === 'blue') { ctx.moveTo(x - ux * 3 - uy * 3, y - uy * 3 + ux * 3); ctx.lineTo(x + ux * 2, y + uy * 2); ctx.lineTo(x - ux * 3 + uy * 3, y - uy * 3 - ux * 3); ctx.stroke(); }

  // 물방울 그림: 주인공·작은 물방울 같은 그림, 크기만 다름. 대열·붙는 중인 물방울은 위치를 직접 옮기므로 옮긴 거리로 속도를 봄
  function dropVel(d) { return (d.mode === 'line' || d.mode === 'join') && d.vel ? d.vel : d.body.velocity; }
  // 그림 이름을 고름 (없으면 char_idle). 그림마다 바라보는 방향이 달라 art.charFace 로 진행 방향에 맞춰 뒤집음 (사용자 요청 2026-10-20)
  function dropImageName(d) {
    var v = dropVel(d), A = G.DATA.art, get = G.Assets.get.bind(G.Assets), n;
    if (!d.grounded && v.y < -A.airVy) n = 'char_jump';
    else if (!d.grounded && v.y > A.airVy) n = 'char_fall';
    else n = Math.abs(v.x) > 0.5 ? 'char_run' : 'char_idle';
    return get(n) ? n : 'char_idle';
  }
  // 물든 그림 (사용자 결정 2026-10-20): 그림 위에 물든 색을 곱하기로 칠하고 그림 모양으로 잘라 냄 (테두리는 어두운 채로)
  var tintCv = null;
  function tinted(img, d) {
    var a = d.tc ? (d.ta || 0) : 0;

    if (!tintCv) tintCv = document.createElement('canvas');
    var w = img.width, h = img.height, x = tintCv.getContext('2d');

  }

  // 걷기 (사용자 요청 2026-10-20: 코드로 걷는 모습): 움직인 거리만큼 걸음 위상이 돌고, 걸음마다 통통 튀고(bob)·좌우로 기울고(sway)·
  //   발이 닿을 때 눌림(squash). 빠르면 걸음이 빨라짐. 수치는 data.js art.walk
  function walkPose(d) {
    var W = G.DATA.art.walk, p = d.body.position, moved = d.lastDraw ? Math.abs(p.x - d.lastDraw.x) : 0;
    d.lastDraw = { x: p.x, y: p.y };

  // 잉크병 앞에 줄 선 물방울(제자리에서 통통) + 입구로 뛰어드는 물방울(작아지며 회전)
  function drawGoalDrops(ctx, game) {
    var get = G.Assets.get.bind(G.Assets), A = G.DATA.art;
    function one(d, x, y, sc, rot, name) {
      var img = get(name) || get('char_idle'), r = d.r * sc, face = (A.charFace && A.charFace[name]) || 1;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(face, 1);

  // lineLen: 주인공이면 머리 위에 대열 길이 "×N" (사용자 결정 2026-10-20)
  function drawDrop(ctx, d, lineLen) {
    var b = d.body, r = d.r, v = dropVel(d), A = G.DATA.art;
    var stretch = Math.max(-0.25, Math.min(0.25, -v.y * 0.03));
    var pose = walkPose(d), name = dropImageName(d), img = G.Assets.get(name);
    ctx.save();
    ctx.translate(b.position.x, b.position.y + pose.bob);
    ctx.translate(0, r); ctx.rotate(pose.sway); ctx.translate(0, -r);   // 발밑을 축으로 기움
    if (d.join && d.join.t < d.join.wake) {        // 깨어나는 모션: 기지개(위로 늘었다 줄기) + 좌우 흔들기

    ctx.translate(0, r); ctx.scale((1 - stretch * 0.6) * d.dir * face, 1 + stretch); ctx.translate(0, -r);
    if (img) { var s = r * G.DATA.art.charSize; ctx.drawImage(tinted(img, d), -s / 2, r - s, s, s); }
    else {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fillStyle = tintFill(d); ctx.fill();
      ctx.lineWidth = d.hero ? 4 : 2.5; ctx.strokeStyle = C.outline; ctx.stroke();
      ctx.fillStyle = C.outline;

  function drawWorld(ctx, game, debug) {
    ctx.save();
    ctx.scale(cam.z, cam.z);
    ctx.translate(-cam.x, -cam.y);
    var lv = game.level.data;
    lv.props.forEach(function (p) { if (p.type === 'deco' || p.type === 'text') G.Props.draw(ctx, p); });
    G.Props.drawGrounds(ctx, lv.ground);
    lv.props.forEach(function (p) { var d = G.Props.def(p.type); if (d && d.solid && p.type !== 'crystal') G.Props.draw(ctx, p); });
    game.level.crystals.forEach(function (c) { G.Props.drawCrystal(ctx, c); });
    game.fallen.forEach(function (f) {             // 잘려 떨어진 배치된 선 조각
      ctx.save(); ctx.translate(f.body.position.x, f.body.position.y); ctx.rotate(f.body.angle);
      G.Props.drawCrystal(ctx, { x: -f.w / 2, y: -f.h / 2, w: f.w, h: f.h }); ctx.restore();
    });
    drawStart(ctx, lv.start.x, lv.start.y);
    drawGoal(ctx, lv.goal.x, lv.goal.y, jarShown, G.Game.jarColor(game));
    game.level.items.forEach(function (it) {
      if (it.owned) { ctx.save(); ctx.globalAlpha = 0.2; G.Props.draw(ctx, it.prop); ctx.restore(); return; }
      if (!it.got) G.Props.draw(ctx, it.prop);
    });
    game.level.sleepers.forEach(function (sl) { if (sl.state === 'sleep') G.Props.drawSleeper(ctx, sl.x, sl.y, G.DATA.drop.smallRadius); });

    game.lines.forEach(function (ln) {
      ctx.globalAlpha = ln.active ? 1 : 0.5;
      drawInkLine(ctx, G.Draw.worldPts(ln), ln.color, !ln.active);
    });
    ctx.globalAlpha = 1;
    if (game.stroke && game.stroke.pts.length > 1) {
      ctx.globalAlpha = 0.6; drawInkLine(ctx, game.stroke.pts, game.stroke.color, true); ctx.globalAlpha = 1;
    }
    G.Game.walking(game).forEach(function (d) { if (!d.hero) drawDrop(ctx, d); });
    if (game.hero.state === 'walk') drawDrop(ctx, game.hero, game.level.data.drops.follow ? game.line.length : 0);
    drawGoalDrops(ctx, game);
    drawEraser(ctx, game);
    drawFx(ctx, game);                             // 지워지는 순간 효과가 흰 종이 위에 보이게 지우개 다음에

    if (debug.showBoxes) {
      ctx.lineWidth = 1.5 / cam.z; ctx.strokeStyle = '#ff00cc';
      G.Physics.allBodies(game.engine).forEach(function (b) {

      });
    }
    ctx.restore();
  }

  // 효과: 별 반짝(깨어남·아이템), 착지 먼지, 튕김·가속, 흡수, 빨아들임·자름
  function drawFx(ctx, game) {
    var F = G.DATA.art.fx;
    game.fx.forEach(function (f) {
      var t, img, k, i;
      if (f.type === 'suck' || f.type === 'cut') {
        t = (game.timeMs - f.t) / 350;
        if (t < 0 || t >= 1) return;
        ctx.save(); ctx.globalAlpha = 1 - t; ctx.setLineDash([4, 6]);
        ctx.lineWidth = (f.type === 'cut' ? G.DATA.ink.yellowCut * 2 : G.DATA.ink.thickness) * (1 - t); ctx.strokeStyle = f.type === 'cut' ? C.yellow : (C[f.color] || C.ink);
        path(ctx, f.pts); ctx.stroke(); ctx.restore();
        return;
      }
      if (f.type === 'erasePuff') {                 // 지우개에 지워지는 순간 (화면 시간): 가루 퍼짐 + 물방울은 지워진 얼굴이 흐려짐
        t = (Date.now() - f.real) / G.DATA.art.eraser.puffMs;
        if (t < 0 || t >= 1) return;
        img = G.Assets.get('fx_erase_puff');
        ctx.save();
        if (!f.line) {
          var face = G.Assets.get('char_erased');
          if (face) { var fs = f.r * G.DATA.art.charSize; ctx.globalAlpha = 1 - t; ctx.drawImage(face, f.x - fs / 2, f.y + f.r - fs, fs, fs); }
        }
        k = f.r * (3 + t * 3);
        ctx.globalAlpha = 1 - t * t;
        if (img) ctx.drawImage(img, f.x - k / 2, f.y - k / 2, k, k);
        else { ctx.strokeStyle = 'rgba(43,33,24,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, k / 2, 0, 6.283); ctx.stroke(); }
        ctx.restore();
        return;
      }
      if (f.type === 'absorb') {
        var lv = game.level.data, gy = lv.goal.y;
        t = (game.timeMs - f.t) / 500;
        img = G.Assets.get('fx_absorb');
        if (t < 0 || t >= 1) return;
        ctx.save(); ctx.globalAlpha = 1 - t;
        if (img) { k = 90 + t * 50; ctx.drawImage(img, f.x - k / 2, gy - G.DATA.art.goalJar.h * 0.8 - k / 2, k, k); }
        else { ctx.strokeStyle = C.blue; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, gy - 120, 20 + t * 40, 0, 6.283); ctx.stroke(); }
        ctx.restore();
        return;
      }
      if (f.type === 'bounce' || f.type === 'boost') {
        t = (game.timeMs - f.t) / F.inkMs;
        if (t < 0 || t >= 1) return;
        img = G.Assets.get('fx_' + f.type);
        ctx.save(); ctx.globalAlpha = 1 - t * t;
        if (img) { ctx.translate(f.x, f.y); if (f.dir < 0) ctx.scale(-1, 1); ctx.drawImage(img, -45, -40, 90, 45); ctx.restore(); return; }
        ctx.lineWidth = 3; ctx.lineCap = 'round'; k = 10 + t * 18;
        ctx.strokeStyle = f.type === 'bounce' ? C.red : C.blue;
        for (i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(f.x + i * 9, f.y - 4); ctx.lineTo(f.x + i * 16, f.y - 4 - k); ctx.stroke(); }
        ctx.restore();
        return;
      }
      var star = f.type === 'star';
      img = G.Assets.get(star ? 'fx_star_pop' : 'fx_land');
      t = (game.timeMs - f.t) / (star ? F.starPopMs : F.landMs);
      if (!img || t < 0 || t >= 1) return;
      ctx.save(); ctx.globalAlpha = 1 - t * t;
      if (star) { var s = 60 + t * 60; ctx.drawImage(img, f.x - s / 2, f.y - s / 2, s, s); }
      else { var w = 70 + t * 50, h = w / 2; ctx.drawImage(img, f.x - w / 2, f.y - h * 0.75, w, h); }
      ctx.restore();
    });
  }

  // 화면 밖 물방울: 가장자리 화살표 (사용자 결정 2026-10-20). 주인공은 노란 화살표
  function drawArrows(ctx, game) {
    var img = G.Assets.get('ui_arrow'), pad = 26, top = G.TS('hudH') + 14, bottom = V.h - 96;
    G.Game.walking(game).forEach(function (d) {
      var p = toScreen(d.body.position.x, d.body.position.y);
      if (p.x >= 0 && p.x <= V.w && p.y >= G.TS('hudH') && p.y <= V.h) return;
      var cx = Math.max(pad, Math.min(V.w - pad, p.x)), cy = Math.max(top, Math.min(bottom, p.y));
      var a = Math.atan2(p.y - cy, p.x - cx), s = d.hero ? 18 : 12;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
      if (img) ctx.drawImage(img, -s, -s, s * 2, s * 2);
      else {
        ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, -s * 0.75); ctx.lineTo(-s * 0.7, s * 0.75); ctx.closePath();
        ctx.fillStyle = d.hero ? C.star : C.player; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.outline; ctx.stroke();
      }
      ctx.restore();
    });
  }

  // 위 막대 (글자·크기·위치는 uitext.js, 사용자 요청 2026-10-21). 잉크·정지 무제한이면 "무제한"·"∞"
  function drawHUD(ctx, game) {
    var S = G.TS, H = S('hudH'), y1 = H - 21, y2 = H - 8, gy = (H - 56) / 2, lv = game.level.data, ink = S('textColor');
    ctx.fillStyle = S('hudBg');
    ctx.fillRect(0, 0, V.w, H);
    ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(V.w, H); ctx.stroke();

    var ix = S('inkX');
    ctx.fillStyle = ink; ctx.font = G.TF('hudLabelSize', true);
    ctx.fillText(G.T('hud.ink'), ix, y1);
    var gx = ix + ctx.measureText(G.T('hud.ink')).width + 14, gw = S('inkGaugeW'), ratio = lv.infInk ? 1 : Math.max(0, game.ink / game.inkMax);
    var frame = G.Assets.get('ui_gauge_frame');
    ctx.fillStyle = ratio > 0 ? 'rgba(43,33,24,0.85)' : '#999';
    if (frame) { ctx.fillRect(gx + 4, gy + 15, (gw - 8) * ratio, 26); ctx.drawImage(frame, gx - 6, gy + 7, gw + 12, 44); }
    else { ctx.strokeRect(gx, gy + 18, gw, 22); ctx.fillRect(gx + 2, gy + 20, (gw - 4) * ratio, 18); }
    ctx.fillStyle = ink; ctx.font = G.TF('hudValueSize');
    var inkTxt = lv.infInk ? G.T('hud.inkInf') : Math.round(game.ink) + ' / ' + game.inkMax;
    ctx.fillText(inkTxt, gx + gw + 10, y1);

    var sx0 = Math.max(S('stopX'), gx + gw + 10 + ctx.measureText(inkTxt).width + 20);   // 잉크 글자가 길어지면 겹치지 않게 밀림
    ctx.font = G.TF('hudLabelSize', true);
    ctx.fillText(G.T('hud.stop'), sx0, y1);
    var stopImg = G.Assets.get('ui_stop_on'), first = sx0 + ctx.measureText(G.T('hud.stop')).width + 28, nStop = lv.infStops ? 1 : game.stops.max;
    for (var i = 0; i < nStop; i++) {
      var on = lv.infStops || i < game.stops.left, cx = first + i * 34;
      if (stopImg) { ctx.globalAlpha = on ? 1 : 0.22; ctx.drawImage(stopImg, cx - 16, gy + 12, 32, 32); ctx.globalAlpha = 1; continue; }
      ctx.beginPath(); ctx.arc(cx, gy + 29, 12, 0, 6.283);
      ctx.fillStyle = on ? C.star : 'rgba(43,33,24,0.12)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = C.outline; ctx.stroke();
    }
    if (lv.infStops) { ctx.fillStyle = ink; ctx.font = G.TF('hudLabelSize', true); ctx.fillText(G.T('hud.stopInf'), first + 22, y1); }

    // 물방울: 걷는 수 · 도착 · 잠든 수 / 정화
    var walking = G.Game.walking(game).length, sleeping = game.level.sleepers.filter(function (s) { return s.state === 'sleep'; }).length;
    var px = first + 10 + Math.max(3, nStop) * 34;
    ctx.fillStyle = ink; ctx.font = G.TF('hudHomeSize', true);
    ctx.fillText(G.T('hud.home', { rescued: game.rescued, total: game.total }), px, y1 - 5);
    ctx.font = G.TF('hudSmallSize');
    if (lv.drops.follow) {                         // 대열 · 이탈(혼자 걷는 중) · 잠듦 · 잃음 (사용자 결정 2026-10-20)
      var alone = G.Game.walking(game).filter(function (d) { return d.mode === 'free'; }).length;
      ctx.fillText(G.T('hud.lineInfo', { line: game.line.length, alone: alone, sleep: sleeping, lost: game.lost }), px, y2);
    } else ctx.fillText(G.T('hud.walkInfo', { walk: walking, sleep: sleeping, lost: game.lost }), px, y2);

    // 오른쪽: 이번 판에 주운 별 (사용자 결정 2026-10-20) + 스테이지 이름·시간·정화
    var sx = V.w - 22 - 26 * Math.max(0, game.starsTotal - 1);
    for (var k = 0; k < game.starsTotal; k++) drawStarIcon(ctx, sx + k * 26 - 4, gy + 20, 11, k < game.starKeys.length);
    ctx.textAlign = 'right'; ctx.font = G.TF('hudSmallSize'); ctx.fillStyle = ink;
    ctx.fillText(G.T('hud.stage', { name: lv.name, attempt: game.attempt, time: (game.timeMs / 1000).toFixed(1), purity: Math.round(G.Game.purity(game) * 100) }), V.w - 20, y2);
    ctx.textAlign = 'left';
  }

  // 스킵 버튼: 주인공이 도착하면 화면 위 가운데 (사용자 결정 2026-10-20)
  function skipRect() { var w = G.TS('skipW'); return { x: V.w / 2 - w / 2, y: G.TS('skipY'), w: w, h: 44 }; }
  function drawSkip(ctx, game) {
    if (!G.Game.canSkip(game)) return;
    var r = skipRect(), all = game.total + 1;        // 끝내면: 들어간 + 줄 선(곧 들어갈) 물방울
    var purity = game.rescued + (game.heroIn ? 1 : 0) + game.goalQueue.length + game.entering.length;
    ctx.fillStyle = 'rgba(255,253,246,0.95)'; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, 10); else ctx.rect(r.x, r.y, r.w, r.h);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = G.TS('textColor'); ctx.font = G.TF('skipSize', true); ctx.textAlign = 'center';
    ctx.fillText(G.T('skip.button', { n: purity, all: all }), V.w / 2, r.y + 28);
    ctx.textAlign = 'left';
  }
  function skipAt(sx, sy) { var r = skipRect(); return sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h; }

  // 아래 5색 병 선반 (병 클릭 / 숫자 키 1~5)
  function shelfSlots() {
    var S = G.DATA.art.shelf;
    return G.DATA.inks.order.map(function (c, i) {
      return { color: c, key: i + 1, x: S.x + i * S.slot, y: V.h - S.h, w: S.slot - 6, h: S.h };
    });
  }
  function inkAt(sx, sy) {
    var hit = null;
    shelfSlots().forEach(function (b) { if (sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h) hit = b.color; });
    return hit;
  }
  function drawShelf(ctx, game) {
    var S = G.DATA.art.shelf, slots = shelfSlots(), allowed = game.level.data.inks, ink = G.TS('textColor');
    var shelfW = S.x * 2 + slots.length * S.slot - 6, shelfImg = G.Assets.get('ui_shelf');
    if (shelfImg) ctx.drawImage(shelfImg, 0, V.h - 30, shelfW + 10, 30);
    else { ctx.fillStyle = '#B07A45'; ctx.fillRect(4, V.h - 16, shelfW, 12); ctx.strokeStyle = C.outline; ctx.lineWidth = 2.5; ctx.strokeRect(4, V.h - 16, shelfW, 12); }
    var sel = G.Assets.get('ink_select');
    slots.forEach(function (b) {
      var on = allowed.indexOf(b.color) >= 0, picked = game.color === b.color;
      var img = G.Assets.get('ink_' + b.color), bw = S.bottle * 0.75, bh = S.bottle;
      var cx = b.x + b.w / 2, by = V.h - 16 - bh;
      if (picked) {
        if (sel) ctx.drawImage(sel, cx - bw * 0.75, by - 10, bw * 1.5, bh + 20);
        else { ctx.fillStyle = 'rgba(245,197,24,0.4)'; ctx.fillRect(cx - bw * 0.7, by - 6, bw * 1.4, bh + 8); }
      }
      ctx.save(); ctx.globalAlpha = on ? 1 : 0.25;
      if (img) ctx.drawImage(img, cx - bw / 2, by, bw, bh);
      else {
        ctx.fillStyle = C[b.color]; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
        ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(cx - bw / 2, by + bh * 0.25, bw, bh * 0.75, 8); else ctx.rect(cx - bw / 2, by + bh * 0.25, bw, bh * 0.75);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#C9A26B'; ctx.fillRect(cx - bw * 0.2, by + bh * 0.08, bw * 0.4, bh * 0.17); ctx.strokeRect(cx - bw * 0.2, by + bh * 0.08, bw * 0.4, bh * 0.17);
      }
      ctx.restore();
      ctx.fillStyle = on ? ink : 'rgba(43,33,24,0.35)'; ctx.font = 'bold 14px ' + G.TS('font'); ctx.textAlign = 'center';
      ctx.fillText(on ? String(b.key) : G.T('shelf.locked'), cx, by - 4);
      ctx.textAlign = 'left';
    });
    var cur = G.DATA.inks[game.color];
    ctx.fillStyle = ink; ctx.font = G.TF('shelfNameSize', true);
    ctx.fillText(cur ? cur.name : '', shelfW + 12, V.h - 40);
    ctx.font = G.TF('shelfHelpSize'); ctx.fillStyle = 'rgba(43,33,24,0.6)';
    ctx.fillText(G.T('shelf.help'), shelfW + 12, V.h - 20);
  }

  function drawStopOverlay(ctx, game) {
    if (!game.stopped) return;
    var H = G.TS('hudH'), col = G.TS('stopColor');
    ctx.fillStyle = C.stopTint;
    ctx.fillRect(0, H, V.w, V.h - H);
    ctx.strokeStyle = col; ctx.lineWidth = 6;
    ctx.strokeRect(3, H + 3, V.w - 6, V.h - H - 6);
    ctx.fillStyle = col; ctx.font = G.TF('stopBannerSize', true); ctx.textAlign = 'center';
    ctx.fillText(G.T('stop.banner'), V.w / 2, G.TS('stopBannerY'));
    ctx.textAlign = 'left';
  }

  function drawMessages(ctx, game) {
    ctx.textAlign = 'center'; ctx.font = G.TF('msgSize', true);
    game.messages.forEach(function (m, i) {
      ctx.globalAlpha = Math.min(1, m.ms / 400);
      ctx.fillStyle = G.TS('msgColor');
      ctx.fillText(m.text, V.w / 2, G.TS('msgY') + i * (G.TS('msgSize') + 8));
    });
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  // 별 하나 (on = 주움). 그림이 있으면 그림, 없으면 도형
  function drawStarIcon(ctx, x, y, r, on) {
    var img = G.Assets.get(on ? 'star_full' : 'star_empty');
    if (img) { ctx.drawImage(img, x - r, y - r, r * 2, r * 2); return; }
    G.Props.drawStarShape(ctx, x, y, r);
    if (on) { ctx.fillStyle = C.star; ctx.fill(); }
    ctx.lineWidth = 2; ctx.strokeStyle = on ? C.outline : 'rgba(43,33,24,0.35)'; ctx.stroke();
  }

  // 클리어 결과 창은 잉크병이 다 밝아진 뒤 resultDelayMs 더 기다렸다가 (사용자 요청 2026-10-20: 정화되는 모습을 1초 더)
  var jarDoneAt = 0;
  function resultReady(game) {
    if (game.status !== 'clear') return true;
    if (jarShown < G.Game.purity(game) - 1e-6) { jarDoneAt = 0; return false; }
    if (!jarDoneAt) jarDoneAt = Date.now();
    return Date.now() - jarDoneAt >= G.DATA.goalEnter.resultDelayMs;
  }

  function drawResult(ctx, game) {
    var ink = G.TS('textColor');
    if (game.status === 'run') return;
    if (game.status === 'ready') {
      var ry = G.TS('readyY');
      ctx.textAlign = 'center'; ctx.fillStyle = ink; ctx.font = G.TF('readyTitleSize', true);
      ctx.fillText(G.T('ready.title'), V.w / 2, ry);
      ctx.font = G.TF('readyHelpSize');
      ctx.fillText(G.T('ready.help'), V.w / 2, ry + 35);
      ctx.textAlign = 'left';
      return;
    }
    if (!resultReady(game)) return;
    ctx.fillStyle = 'rgba(43,33,24,0.35)';
    ctx.fillRect(0, 0, V.w, V.h);
    var clear = game.status === 'clear' && game.result;
    var w = 560, h = clear ? 340 : 250, x = (V.w - w) / 2, y = (V.h - h) / 2;
    var panel = G.Assets.get('ui_panel');
    if (panel) ctx.drawImage(panel, x - 40, y - 30, w + 80, h + 60);
    else { ctx.fillStyle = C.paper; ctx.fillRect(x, y, w, h); ctx.strokeStyle = C.outline; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h); }
    var face = G.Assets.get(game.status === 'fail' ? 'char_erased' : 'char_goal');
    if (face && !clear) ctx.drawImage(face, x + 28, y + 6, 136, 136);
    ctx.textAlign = 'center'; ctx.fillStyle = game.status === 'clear' ? G.TS('clearColor') : G.TS('failColor');
    ctx.font = G.TF('resultTitleSize', true);
    ctx.fillText(game.status === 'clear' ? G.T('result.clear') : game.failReason, V.w / 2, y + 70);
    ctx.fillStyle = ink;
    if (clear) {                                   // 별 n/3 과 정화 % 를 따로 (사용자 결정 2026-10-20)
      var r = game.result, best = game.best;
      ctx.font = G.TF('resultSize', true); ctx.fillStyle = ink;
      ctx.fillText(G.T('result.stars', { stars: r.stars, total: r.starsTotal }), V.w / 2, y + 102);
      for (var k = 0; k < r.starsTotal; k++) drawStarIcon(ctx, V.w / 2 + (k - (r.starsTotal - 1) / 2) * 56, y + 136, 25, k < r.stars);
      // 정화 막대
      var bw = 300, bx = V.w / 2 - bw / 2, by = y + 186;
      ctx.font = G.TF('resultSize', true); ctx.fillStyle = ink;
      // 캐릭터: 정화 막대 왼쪽 위 꼭지점 위에 앉음 (사용자 요청 2026-10-20: 136 → 170). 정화 글자는 캐릭터를 비켜 오른쪽으로
      var fs = 170;
      if (face) ctx.drawImage(face, bx - fs / 2 + 4, by - fs * 0.93, fs, fs);
      ctx.fillText(G.T('result.purity', { purity: Math.round(r.purity * 100), inJar: r.inJar, all: r.all }), bx + 80 + (bw - 80) / 2, by - 8);
      ctx.fillStyle = 'rgba(43,33,24,0.12)'; ctx.fillRect(bx, by, bw, 14);
      ctx.fillStyle = mix(C.jarDark, G.Game.jarColor(game), r.purity); ctx.fillRect(bx, by, bw * r.purity, 14);
      ctx.lineWidth = 2; ctx.strokeStyle = C.outline; ctx.strokeRect(bx, by, bw, 14);
      ctx.fillStyle = ink; ctx.font = G.TF('resultSize');
      ctx.fillText(G.T('result.time', { time: (r.timeMs / 1000).toFixed(1) }) + (best ? G.T('result.best', { stars: best.stars || 0, total: r.starsTotal,
        purity: Math.round((best.bestPurity || 0) * 100) }) : ''), V.w / 2, y + 236);
    } else {
      ctx.font = G.TF('resultRetrySize');
      ctx.fillText(G.T('result.failInfo', { rescued: game.rescued, total: game.total, attempt: game.attempt }), V.w / 2, y + 125);
      ctx.fillText(G.T('result.time', { time: (game.timeMs / 1000).toFixed(1) }), V.w / 2, y + 158);
    }
    ctx.font = G.TF('resultRetrySize', true); ctx.fillStyle = ink;
    ctx.fillText(G.T('result.retry') + (game.status === 'clear' && game.hasNext ? G.T('result.next') : ''), V.w / 2, y + h - (clear ? 74 : 30));   // 사용자 요청 2026-10-20: 조금 위로
    ctx.textAlign = 'left';
  }

  // 잉크병 밝기: 들어간 물방울 수(정화)를 향해 서서히 (사용자 요청 2026-10-20: 갑자기 밝아지지 않게). 새 시도면 바로 어둡게
  var jarShown = 0;
  function updateJar(game, dt) {
    var target = G.Game.purity(game), step = G.DATA.goalEnter.jarFadePerSec * dt / 1000;
    if (target < jarShown) jarShown = target;
    else jarShown = Math.min(target, jarShown + step);
  }

  var lastT = 0;
  function render(ctx, game, debug) {
    var now = Date.now(), dt = lastT ? Math.min(100, now - lastT) : 16;
    lastT = now;
    updateCamera(game, dt);
    updateJar(game, dt);
    drawBackground(ctx, game.level.data.bg, cam.x);
    drawWorld(ctx, game, debug);
    drawArrows(ctx, game);
    drawStopOverlay(ctx, game);
    drawHUD(ctx, game);
    drawSkip(ctx, game);
    drawShelf(ctx, game);
    drawMessages(ctx, game);
    drawResult(ctx, game);
  }

  return { render: render, toWorld: toWorld, toScreen: toScreen, cam: cam, wheel: wheel, resetCamera: resetCamera,
           drawBackground: drawBackground, drawGoal: drawGoal, drawStart: drawStart,
           inkAt: inkAt, skipAt: skipAt, drawInkLine: drawInkLine };
})();

</script>
<script>
// debug.js
// 디버그 패널 (D키): 구간 선택, 시간 배율 전환, 정지 횟수 충전, 충돌 박스 표시, FPS, 모드별 기록
var G = G || {};

G.Debug = {
  state: { open: false, showBoxes: false, fps: 0 },
  el: null,

  init: function (app) {
    var el = document.createElement('div');
    el.id = 'debug';
    el.style.display = 'none';
    document.body.appendChild(el);
    this.el = el;
    var self = this;
    el.addEventListener('click', function (e) {
      var a = e.target.getAttribute('data-act');
      if (!a) return;
      if (a.indexOf('mode:') === 0) app.setMode(a.slice(5));
      if (a === 'stops') { G.Rules.rechargeStops(app.game.stops); }
      if (a === 'ink') { app.game.ink = app.game.inkMax; }
      if (a.indexOf('level:') === 0) app.goLevel(+a.slice(6));
      if (a === 'boxes') { self.state.showBoxes = !self.state.showBoxes; }
      if (a === 'reset') { app.restart(); }
      if (a === 'clear') { app.save.stats = {}; G.Save.write(app.save); }
      if (a === 'account' && confirm('잉크 성장(먹은 잉크 병)과 구간 기록을 지울까요?')) app.resetAccount();
      self.refresh(app);
    });
    el.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  },

  toggle: function (app) {
    this.state.open = !this.state.open;
    this.el.style.display = this.state.open ? 'block' : 'none';
    this.refresh(app);
  },

  // FPS 숫자만 바꾼다 (패널 전체를 다시 만들면 버튼 클릭이 씹힐 수 있음)
  tick: function () {
    var f = this.state.open && document.getElementById('dbg-fps');
    if (f) f.textContent = this.state.fps;
  },

  refresh: function (app) {
    if (!this.state.open) return;
    var g = app.game, s = this.state, modes = G.DATA.timeModes;
    var html = '<b>디버그 (D로 닫기)</b>';
    html += '<div>FPS <span id="dbg-fps">' + s.fps + '</span> · 시드 ' + G.DATA.seed + '</div>';
    html += '<div class="row">구간' + (app.testMode ? ' (레벨 툴 테스트)' : '') + '</div><div class="row">';
    app.levels.forEach(function (lv, i) {
      html += '<button data-act="level:' + i + '"' + (app.levelIndex === i ? ' class="on"' : '') + '>' + lv.name + '</button>';
    });
    html += '</div><div class="row">시간 정지 방식 (A 확정 · 비교용 Q/W/E)</div><div class="row">';
    Object.keys(modes).forEach(function (k) {
      html += '<button data-act="mode:' + k + '"' + (g.modeKey === k ? ' class="on"' : '') + '>' + modes[k].name + '</button>';
    });
    html += '</div><div class="row">';
    html += '<button data-act="stops">정지 횟수 충전</button>';
    html += '<button data-act="ink">잉크 충전</button>';
    html += '<button data-act="boxes"' + (s.showBoxes ? ' class="on"' : '') + '>충돌 박스</button>';
    html += '<button data-act="reset">구간 다시 (R)</button>';
    html += '</div><div class="row">모드별 기록 (이 브라우저에 저장)</div>';
    html += '<table><tr><th>모드</th><th>시도</th><th>도착</th><th>실패</th><th>평균 정지</th></tr>';
    Object.keys(modes).forEach(function (k) {
      var st = app.save.stats[k] || { tries: 0, clears: 0, fails: 0, stopsUsed: 0 };
      var avg = st.tries ? (st.stopsUsed / st.tries).toFixed(1) : '-';
      html += '<tr><td>' + k + '</td><td>' + st.tries + '</td><td>' + st.clears + '</td><td>' + st.fails + '</td><td>' + avg + '</td></tr>';
    });
    html += '</table><button data-act="clear">기록 지우기</button>';
    var acc = app.account || app.save, rec = acc.records[g.level.data.id];
    html += '<div class="row">계정' + (app.testMode ? ' (테스트: 저장 안 됨)' : '') + ': 잉크 최대량 +' + (acc.inkBonus || 0) +
      ' (먹은 병 ' + Object.keys(acc.bottles || {}).length + '개)' +
      (rec ? ' · 이 스테이지 별 ' + (rec.stars || 0) + ' · 최고 정화 ' + Math.round((rec.bestPurity || 0) * 100) + '%, ' + rec.clears + '/' + rec.tries + '번 성공' : '') + '</div>';
    html += '<button data-act="account">계정 초기화 (잉크 성장·구간 기록)</button>';
    this.el.innerHTML = html;
  }
};

</script>
<script>
// main.js
// 시작점: 캔버스, 입력, 고정 타임스텝 루프 — 물방울 무리 시험판
// 조작 (사용자 결정 2026-10-20): 왼쪽 드래그 그리기 · 스페이스 시간 정지 · 우클릭 선 빨아들이기 · 1~5/병 클릭 색 · 휠 줌 · Enter 스킵
var G = G || {};

(function () {
  var D = G.DATA;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  G.Assets.load();
  canvas.width = D.view.w;
  canvas.height = D.view.h;

  var app = {
    save: G.Save.load(),
    game: null,
    // 시간 정지 방식은 A로 확정 (사용자 결정 2026-10-19). B·C 는 비교용으로 Q/W/E, 저장하지 않음
    setMode: function (k) {
      if (!D.timeModes[k]) return;
      G.Game.setMode(app.game, k);
      app.restart();
      app.game.toast(D.timeModes[k].name + ' (구간 다시 시작)');
    },
    restart: function () { G.Game.reset(app.game); G.UI.resetCamera(); },
    // 구간 목록: 보통은 levels.js, 레벨 툴의 "테스트 플레이"는 주소 #test= 로 구간 하나를 넘겨준다
    levels: G.LEVELS.filter(function (l) { return !l.test; }),   // 테스트용 스테이지(test: true)는 게임·제출본에서 숨김 (사용자 결정 2026-10-20)
    levelIndex: 0,
    testMode: false,
    goLevel: function (i) {
      if (!app.levels[i]) return;
      app.levelIndex = i;
      G.Game.setLevel(app.game, app.levels[i]);
      G.UI.resetCamera();
      app.game.hasNext = !!app.levels[i + 1];
      G.Debug.refresh(app);
    }
  };
  var m = /#test=(.+)$/.exec(location.hash);
  if (m) {
    try { app.levels = [JSON.parse(decodeURIComponent(m[1]))]; app.testMode = true; } catch (e) { /* 잘못된 주소면 무시 */ }
  }
  // 계정: 잉크 성장(inkBonus·먹은 병)과 구간 기록. 레벨 툴 테스트는 계정을 건드리지 않게 복사본으로 (저장 안 함)
  app.account = app.testMode ? JSON.parse(JSON.stringify(app.save)) : app.save;
  app.game = G.Game.create(D.defaultTimeMode, app.levels[0], app.account);
  app.game.hasNext = !!app.levels[1];
  if (app.testMode) app.game.toast(G.T('toast.test', { name: app.levels[0].name }));
  function persist() { if (!app.testMode) G.Save.write(app.save); }
  app.game.onAccountChange = function () { persist(); G.Debug.refresh(app); };
  app.game.onFinish = function (g) {
    var st = app.save.stats[g.modeKey] || (app.save.stats[g.modeKey] = { tries: 0, clears: 0, fails: 0, stopsUsed: 0 });
    st.tries += 1;
    st[g.status === 'clear' ? 'clears' : 'fails'] += 1;
    st.stopsUsed += g.stopsUsedThisRun;
    var id = g.level.data.id, rec = app.account.records[id] || (app.account.records[id] = { clears: 0, tries: 0 });
    rec.tries += 1;
    if (g.status === 'clear' && g.result) {       // 최고 기록: 별(모은 별 누적)·정화(최고 %) 따로 (사용자 결정 2026-10-20)
      rec.clears += 1;
      G.Rules.mergeRecord(rec, g.result);
    }
    g.best = rec.clears ? rec : null;
    persist();
    G.Debug.refresh(app);
  };
  // 계정 초기화 (잉크 성장·먹은 병·구간 기록). 시간 정지 방식 설정과 모드별 기록은 남김
  app.resetAccount = function () {
    app.account.inkBonus = 0; app.account.bottles = {}; app.account.records = {};
    persist();
    app.restart();
    app.game.toast('계정 초기화: 잉크 성장·기록을 지웠어요');
  };
  G.Debug.init(app);
  G.app = app;

  // ---- 입력 ----
  function mouseScreen(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * D.view.w / r.width, y: (e.clientY - r.top) * D.view.h / r.height };
  }

  window.addEventListener('keydown', function (e) {
    var g = app.game;
    if (e.code === 'Space') {                       // 출발 / 시간 정지 (사용자 결정 2026-10-20)
      e.preventDefault();
      if (e.repeat) return;
      if (g.status === 'ready') G.Game.start(g); else G.Game.toggleStop(g);
      return;
    }
    if (e.code === 'Enter') { e.preventDefault(); if (g.status === 'ready') G.Game.start(g); else G.Game.skip(g); return; }
    if (e.code === 'KeyR') app.restart();
    else if (e.code === 'KeyN') { if (g.status === 'clear' && g.hasNext) app.goLevel(app.levelIndex + 1); }
    else if (e.code === 'KeyD') G.Debug.toggle(app);
    else if (/^[1-9]$/.test(e.key) && D.inks.order[+e.key - 1]) G.Game.setColor(g, D.inks.order[+e.key - 1]);
  });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); if (e.deltaY) G.UI.wheel(e.deltaY); }, { passive: false });
  canvas.addEventListener('mousedown', function (e) {
    var g = app.game, sp = mouseScreen(e);
    if (e.button === 2) {                          // 우클릭: 선 빨아들이기 (달리는 중에도)
      if (g.status === 'run' && !G.Draw.suck(g, G.UI.toWorld(sp.x, sp.y), D.ink.suckReach / G.UI.cam.z)) g.toast(G.T('toast.noSuck'));
      return;
    }
    if (e.button !== 0) return;
    var bottle = G.UI.inkAt(sp.x, sp.y);
    if (bottle && g.status !== 'clear' && g.status !== 'fail') { G.Game.setColor(g, bottle); return; }
    if (G.Game.canSkip(g) && G.UI.skipAt(sp.x, sp.y)) { G.Game.skip(g); return; }
    if (g.status === 'ready') { G.Game.start(g); return; }
    if (g.status !== 'run') { app.restart(); return; }
    if (g.ink <= 0 && !g.level.data.infInk) { g.toast(G.T('toast.noInk')); return; }
    G.Draw.begin(g, G.UI.toWorld(sp.x, sp.y));
  });
  window.addEventListener('mousemove', function (e) { if (app.game.stroke) { var sp = mouseScreen(e); G.Draw.move(app.game, G.UI.toWorld(sp.x, sp.y)); } });
  window.addEventListener('mouseup', function (e) { if (e.button === 0) G.Draw.end(app.game); });

  // ---- 루프 (고정 타임스텝) ----
  var last = performance.now(), acc = 0, frames = 0, fpsT = 0;
  function frame(now) {
    var dt = Math.min(250, now - last);
    last = now;
    acc += dt;
    var n = 0;
    while (acc >= D.loop.stepMs && n < D.loop.maxStepsPerFrame) {
      G.Game.update(app.game, D.loop.stepMs);
      acc -= D.loop.stepMs;
      n++;
    }
    if (n === D.loop.maxStepsPerFrame) acc = 0;   // 너무 밀리면 버린다 (탭 전환 등)
    G.UI.render(ctx, app.game, G.Debug.state);

    frames++; fpsT += dt;
    if (fpsT >= 500) {
      G.Debug.state.fps = Math.round(frames * 1000 / fpsT);
      frames = 0; fpsT = 0;
      G.Debug.tick();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
