<title>스톱 앤 스케치 — 물방울 무리 시험판</title>
<style>
  html, body { margin: 0; height: 100%; background: #2B2118; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  #game { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #F3E9D2; cursor: crosshair; display: block; }
  #debug { position: fixed; right: 10px; bottom: 10px; width: 340px; padding: 10px; background: rgba(255,255,255,0.95);
           border: 2px solid #2B2118; font-size: 13px; color: #2B2118; }
  #debug .row { margin-top: 8px; }
  #debug button { margin: 2px; font-size: 12px; padding: 3px 6px; cursor: pointer; }
  #debug button.on { background: #1F6FE0; color: #fff; }
  #debug table { border-collapse: collapse; margin: 4px 0; width: 100%; }
  #debug td, #debug th { border: 1px solid #ccc; padding: 2px 4px; text-align: center; }
</style>
