<script>
// data.js
// 스톱 앤 스케치 (가제, 구 잉크 런) — 모든 수치는 이 파일 한 곳에 모은다.
// 단위: 거리 px, 시간은 따로 적지 않으면 ms. 속도는 "1스텝(1/60초)당 px".
var G = G || {};

G.DATA = {
  version: 1,
  seed: 20261019,

  // 캐릭터를 오른쪽으로 갈 때 화면 30%, 왼쪽으로 갈 때 70% 지점에 둔다 (가는 쪽을 넓게 보여 줌)
  view: { w: 1280, h: 720, playerScreenX: 0.3, playerScreenXBack: 0.7 },

  loop: { stepMs: 1000 / 60, maxStepsPerFrame: 5 },

  physics: {
    gravityY: 1,           // Matter.js 기본 중력 배율
    failY: 1100            // 땅 높이 600 기준, 이 아래로 떨어지면 실패 (가장 낮은 땅에 맞춰 함께 내려감)
  },

  player: {
    radius: 22,
    runSpeed: 5.2,         // 목표 달리기 속도 (스텝당 px, 약 312px/초)
    accel: 0.12,           // 바닥에 있을 때 목표 속도로 다가가는 비율 (0~1)
                           // 점프는 없음 (사용자 결정 2026-10-19: 그림으로만 조작)
    groundCheck: 0.45,     // 접촉점이 몸 중심보다 반지름 × 이 값 이상 아래면 "바닥", 그보다 위면 "벽"
                           //   → 약 63°보다 가파른 선은 벽으로 취급
    stepUp: 16,            // 이 높이(px) 이하의 턱은 벽이 아니라 넘어가는 턱 (선 끝과 바닥 이음매 등)
    turnCooldownMs: 250,   // 벽에 부딪혀 뒤로 돈 뒤 다시 돌 수 있기까지 (떨림 방지)
    stuckMs: 3500          // 이 시간 동안 거의 안 움직이면 "막혔다" 안내
  },

  stop: {
    perSection: 3          // 구간당 정지 횟수
  },

  // 시간 정지 방식 (사용자 결정 2026-10-19: A 완전 정지로 확정 — 지우개 추격·실시간 그리기 등 압박 장치가 많아서).
  // B·C 는 비교용으로만 남김 (Q/W/E 키, 저장하지 않음 → 열 때마다 A). scale = 정지 중 시간 배율
  timeModes: {
    A: { name: 'A. 완전 정지', scale: 0, limitMs: 0, activateOnStrokeEnd: false },
    B: { name: 'B. 슬로 모션', scale: 0.3, limitMs: 0, activateOnStrokeEnd: true },
    C: { name: 'C. 정지 + 3초 제한', scale: 0, limitMs: 3000, activateOnStrokeEnd: false }
  },
  defaultTimeMode: 'A',

  // 잉크 (사용자 결정 2026-10-19): 모든 색이 같은 잉크를 씀 / 발판 선이 사라지면 그만큼 돌려받음 /
  // 잉크 병을 먹으면 최대량이 계정에 영구히 늘어남 / 잉크 웅덩이에 닿아 있으면 줄어듦
  ink: {
    max: 1800,             // 구간 기본 잉크 최대량 (선 길이 px). 구간마다 levels.js 의 ink 로 바꿀 수 있음
    upAmount: 300,         // 잉크 병 하나당 최대량 증가 (계정에 저장, 영구)
    drainPerSec: 400,      // 잉크 웅덩이에 닿아 있는 동안 초당 줄어드는 양
    sampleDist: 8,         // 마우스 점을 이 거리마다 하나씩 기록
    minStrokeLen: 30,      // 이보다 짧은 선은 취소하고 잉크를 돌려준다
    maxStrokeLen: 700,     // 한 번에 그릴 수 있는 최대 길이 (한 번에 잉크 전부 쓰기 방지)
    smoothPasses: 2,       // 평활화 횟수
    lifeMs: 5000,          // 선이 발판이 된 뒤 사라지기까지 (게임 시간: 완전 정지 중에는 줄지 않음, 슬로 모션은 천천히)
    fadeMs: 1200,          // 사라지기 전 이 시간 동안 점점 흐려짐 (경고)
    thickness: 8,          // 선 두께 (물리 바디도 같은 두께)

<script>
// rules.js
// 순수 계산 규칙 (화면·물리 없음). node tools/test.js 가 이 파일만 시험한다.
var G = G || {};

G.Rules = (function () {
  function dist(a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function polylineLength(pts) {
    var len = 0;
    for (var i = 1; i < pts.length; i++) len += dist(pts[i - 1], pts[i]);
    return len;
  }

  // ---- 선 그리기 ----
  // stroke = { pts: [...], len: 0, full: false }
  function newStroke(p) {
    return { pts: [{ x: p.x, y: p.y }], len: 0, full: false };
  }

  // 마우스 점 p를 선에 더한다. 잉크·한 번 최대 길이를 넘으면 그 지점에서 잘라 선을 끝낸다.
  // 반환: 이번에 쓴 잉크 양 (0이면 추가 안 됨)
  function addSample(stroke, p, inkLeft, cfg) {
    if (stroke.full) return 0;
    var last = stroke.pts[stroke.pts.length - 1];
    var d = dist(last, p);
    if (d < cfg.sampleDist) return 0;
    var room = Math.min(inkLeft, cfg.maxStrokeLen - stroke.len);
    if (room <= 0) { stroke.full = true; return 0; }
    var q = { x: p.x, y: p.y };
    if (d > room) {                       // 남은 만큼만 그리고 멈춘다
      var t = room / d;
      q = { x: last.x + (p.x - last.x) * t, y: last.y + (p.y - last.y) * t };
      d = room;
      stroke.full = true;
    }
    stroke.pts.push(q);
    stroke.len += d;
    return d;
  }

  // 양 끝은 그대로 두고 가운데 점을 이웃 평균 쪽으로 당긴다
  function smooth(pts, passes) {
    var out = pts.slice();
    for (var k = 0; k < passes; k++) {
      if (out.length < 3) break;
      var next = [out[0]];
      for (var i = 1; i < out.length - 1; i++) {
        next.push({
          x: (out[i - 1].x + out[i].x * 2 + out[i + 1].x) / 4,
          y: (out[i - 1].y + out[i].y * 2 + out[i + 1].y) / 4
        });
      }
      next.push(out[out.length - 1]);
      out = next;
    }
    return out;
  }

  // 선을 끝낼 때: 너무 짧으면 취소하고 쓴 잉크를 돌려준다
  function finishStroke(stroke, cfg) {
    if (stroke.pts.length < 2 || stroke.len < cfg.minStrokeLen) {
      return { ok: false, refund: stroke.len };
    }
    return { ok: true, refund: 0, pts: smooth(stroke.pts, cfg.smoothPasses) };
  }

  // ---- 선 수명 ----
  // 발판이 된 뒤 ageMs 가 지나면 사라진다. 마지막 fadeMs 동안 1 → 0 으로 흐려짐
  function lineAlpha(ageMs, lifeMs, fadeMs) {
    var left = lifeMs - ageMs;
    if (left <= 0) return 0;
    return left >= fadeMs ? 1 : left / fadeMs;
  }
  function lineExpired(ageMs, lifeMs) { return ageMs >= lifeMs; }

  // ---- 정지 횟수 ----
  function newStops(n) { return { left: n, max: n }; }
  function canStop(s) { return s.left > 0; }
  function useStop(s) {
    if (s.left <= 0) return false;
    s.left -= 1;
    return true;
  }
  function rechargeStops(s) { s.left = s.max; }

  // ---- 잉크 회복 (사용자 결정 2026-10-19) ----
  // 발판 선이 사라지면 그 선에 쓴 잉크만큼 돌려받는다. 최대량을 넘지 않는다
  function refundInk(ink, len, inkMax) { return Math.min(inkMax, ink + len); }
  // 잉크 웅덩이에 닿아 있는 동안 초당 rate 만큼 줄어든다 (0 아래로는 안 감)
  function drainInk(ink, rate, ms) { return Math.max(0, ink - rate * ms / 1000); }

  // ---- 클리어 평가: 조건을 몇 개 만족했는가 → 별 0~3 (사용자 결정 2026-10-19) ----
  // rate = { timeSec, allStars, maxTries } (levels.js 구간마다), res = { timeMs, starsGot, starsTotal, tries }
  function rateClear(rate, res, labels) {
    var checks = [
      { key: 'time', ok: res.timeMs <= rate.timeSec * 1000, label: rate.timeSec + '초 안에 도착' },
      { key: 'stars', ok: !rate.allStars || res.starsGot >= res.starsTotal,
        label: rate.allStars ? '수집 별 모두 (' + res.starsGot + '/' + res.starsTotal + ')' : '수집 별 조건 없음' },
      { key: 'tries', ok: res.tries <= rate.maxTries, label: rate.maxTries + '번 안에 성공 (' + res.tries + '번째)' }
    ];
    var n = checks.filter(function (c) { return c.ok; }).length;
    return { checks: checks, stars: n };
  }

  // ---- 색 잉크 (사용자 결정 2026-10-19) ----
  // 쓸 수 있는 색 목록 list 안에서 cur 다음(d=+1)/이전(d=-1) 색. 목록에 cur 가 없으면 첫 색
  function nextColor(list, cur, d) {
    if (!list.length) return null;
    var i = list.indexOf(cur);
    if (i < 0) return list[0];
    return list[(i + d + list.length) % list.length];
  }
  // 빨강 선(기울기 angle 라디안)을 밟았을 때 튕기는 속도: 선과 수직이면서 위쪽 방향으로 bounce, 선을 따라가는 속도는 유지
  function bounceVelocity(angle, bounce, v) {
    var nx = Math.sin(angle), ny = -Math.cos(angle);
    if (ny > 0) { nx = -nx; ny = -ny; }          // 늘 위쪽을 향하게
    var along = v.x * Math.cos(angle) + v.y * Math.sin(angle);
    return { x: Math.cos(angle) * along + nx * bounce, y: Math.sin(angle) * along + ny * bounce };
  }
  // 점 p 와 선분 a-b 사이 거리 (투사체가 초록 선에 닿았는지)
  function pointSegDist(p, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    var t = l2 ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2)) : 0;
    return dist(p, { x: a.x + dx * t, y: a.y + dy * t });
  }

  // ---- 시간 배율 ----
  function timeScale(mode, stopped) { return stopped ? mode.scale : 1; }
  function shouldAutoResume(mode, stopped, stoppedMs) {
    return stopped && mode.limitMs > 0 && stoppedMs >= mode.limitMs;
  }

  return {
    dist: dist, polylineLength: polylineLength,
    newStroke: newStroke, addSample: addSample, smooth: smooth, finishStroke: finishStroke,
    lineAlpha: lineAlpha, lineExpired: lineExpired,
    refundInk: refundInk, drainInk: drainInk, rateClear: rateClear,
    nextColor: nextColor, bounceVelocity: bounceVelocity, pointSegDist: pointSegDist,
    newStops: newStops, canStop: canStop, useStop: useStop, rechargeStops: rechargeStops,
    timeScale: timeScale, shouldAutoResume: shouldAutoResume
  };
})();

</script>
<script>
// levelcheck.js
// 구간 데이터 계산·검사 (화면·물리 없음). 게임, 레벨 툴, node 테스트가 함께 쓴다.
var G = G || {};

G.LevelCheck = (function () {
  // 빠진 값을 기본값으로 채운 복사본
  function normalize(lv) {
    var D = G.DATA, o = JSON.parse(JSON.stringify(lv || {}));
    o.id = o.id || 'new';
    o.name = o.name || '새 구간';
    o.bg = o.bg || 'bg_a';
    o.ink = o.ink || D.ink.max;
    o.stops = o.stops != null ? o.stops : D.stop.perSection;
    o.start = o.start || { x: 200 };
    o.goal = o.goal || { x: 2000 };
    o.ground = o.ground || [];
    o.props = o.props || [];
    var r = D.level.rate;                          // 클리어 평가 조건 (빠진 칸만 기본값)
    o.rate = o.rate || {};
    if (o.rate.timeSec == null) o.rate.timeSec = r.timeSec;
    if (o.rate.allStars == null) o.rate.allStars = r.allStars;
    if (o.rate.maxTries == null) o.rate.maxTries = r.maxTries;
    // 쓸 수 있는 색 (없으면 3색 모두), 색 효과 세기 (빠진 칸만 기본값)
    o.inks = (o.inks || D.inks.order).filter(function (c) { return D.inks[c]; });
    o.fx = o.fx || {};
    Object.keys(D.inkFx).forEach(function (k) { if (o.fx[k] == null) o.fx[k] = D.inkFx[k]; });
    return o;
  }

  function groundTopAt(lv, x) {
    for (var i = 0; i < lv.ground.length; i++) {
      var g = lv.ground[i];
      if (x >= g.x0 && x <= g.x1) return g.top;
    }
    return null;
  }

  // 시작~도착 사이의 틈 목록 (땅 조각 사이 빈 곳). dy: 건너편이 높으면 음수
  function gaps(lv) {
    var segs = lv.ground.slice().sort(function (a, b) { return a.x0 - b.x0; }), out = [];
    var reach = null, reachTop = 0;               // 지금까지 땅이 이어진 오른쪽 끝 (겹친 조각 고려)
    segs.forEach(function (s) {
      if (reach !== null && s.x0 > reach && s.x0 >= lv.start.x && reach <= lv.goal.x) {
        out.push({ x0: reach, x1: s.x0, w: s.x0 - reach, dy: s.top - reachTop });
      }
      if (reach === null || s.x1 > reach) { reach = s.x1; reachTop = s.top; }
    });
    return out;
  }

  // 길을 막는 벽 (땅 위에 서 있고 넘어갈 수 없는 높이)
  function blockingWalls(lv) {
    var step = G.DATA.player.stepUp;
    return lv.props.filter(function (p) {
      var def = G.DATA.props[p.type];
      if (!def || !def.solid || p.x + p.w < lv.start.x || p.x > lv.goal.x) return false;
      var top = groundTopAt(lv, p.x + p.w / 2);
      return top != null && Math.abs(p.y + p.h - top) < 4 && p.h > step;
    });
  }

  // 장애물마다 드는 잉크 대략치: 틈마다 다리(양쪽 20px 걸침) + 벽마다 약 30° 경사로. [{x, cost}]
  function obstacleCosts(lv) {
    var out = [];
    gaps(lv).forEach(function (g) { out.push({ x: g.x0, cost: Math.sqrt((g.w + 40) * (g.w + 40) + g.dy * g.dy) }); });
    blockingWalls(lv).forEach(function (w) { out.push({ x: w.x, cost: w.h * 2 }); });
    return out.sort(function (a, b) { return a.x - b.x; });
  }

  // 모범 풀이 전체에 드는 잉크 대략치 (합계)
  function estimateInk(lv) {
    return Math.round(obstacleCosts(lv).reduce(function (s, o) { return s + o.cost; }, 0));
  }

  // 선은 사라지면 잉크를 돌려주므로, 실제로 모자라는지는 "선 수명 동안 달리는 거리" 안의 장애물 합으로 본다
  function peakInk(lv) {
    var D = G.DATA, span = D.player.runSpeed * 60 * D.ink.lifeMs / 1000, obs = obstacleCosts(lv), best = 0;
    obs.forEach(function (o) {
      var sum = 0;
      obs.forEach(function (q) { if (q.x >= o.x && q.x <= o.x + span) sum += q.cost; });
      best = Math.max(best, sum);
    });
    return { peak: Math.round(best), span: Math.round(span) };
  }

  function overlaps(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }

  // 경고 목록: {lv: 'error'|'warn'|'info', msg}
  function check(raw) {
    var lv = normalize(raw), out = [], D = G.DATA;
    function add(k, m) { out.push({ lv: k, msg: m }); }
    if (!lv.ground.length) add('error', '땅이 하나도 없어요');
    if (groundTopAt(lv, lv.start.x) == null) add('error', '시작 위치 아래에 땅이 없어요');
    if (groundTopAt(lv, lv.goal.x) == null) add('error', '도착 위치 아래에 땅이 없어요');
    if (lv.goal.x <= lv.start.x) add('error', '도착이 시작보다 왼쪽에 있어요 (캐릭터는 오른쪽으로 출발)');

    var segs = lv.ground.slice().sort(function (a, b) { return a.x0 - b.x0; });
    for (var i = 1; i < segs.length; i++) {
      if (segs[i].x0 < segs[i - 1].x1) add('warn', '땅 조각이 겹쳐요 (x ' + segs[i].x0 + ')');
    }
    lv.ground.forEach(function (g) { if (g.x1 - g.x0 < 20) add('warn', '너무 짧은 땅 (x ' + g.x0 + ')'); });

    var stars = lv.props.filter(function (p) { return p.type === 'star'; });
    if (stars.length !== D.level.starsPerLevel) add('warn', '별이 ' + stars.length + '개예요 (권장 ' + D.level.starsPerLevel + '개)');
    var solids = lv.props.filter(function (p) { var d = D.props[p.type]; return d && d.solid; });
    solids.forEach(function (p) { if (p.w < 10 || p.h < 10) add('warn', D.props[p.type].name + '이(가) 너무 작아요 (x ' + p.x + ')'); });
    stars.forEach(function (s) {
      var r = s.size / 2, box = { x: s.x - r, y: s.y - r, w: r * 2, h: r * 2 };
      solids.forEach(function (p) { if (overlaps(box, p)) add('warn', '별이 ' + D.props[p.type].name + ' 안에 묻혀 있어요 (x ' + s.x + ')'); });
    });

    var bottles = lv.props.filter(function (p) { return p.type === 'inkup'; });
    var drains = lv.props.filter(function (p) { return p.type === 'drain'; });
    if (bottles.length || drains.length) add('info', '잉크 병 ' + bottles.length + '개 (먹으면 최대량 +' + D.ink.upAmount + ', 영구) · 잉크 웅덩이 ' + drains.length + '개');
    var ids = {};
    bottles.forEach(function (b) { if (b.id && ids[b.id]) add('warn', '잉크 병 id가 겹쳐요 (' + b.id + ') — 계정 저장이 섞임'); ids[b.id] = 1; });
    var minTime = Math.ceil((lv.goal.x - lv.start.x) / (D.player.runSpeed * 60));
    if (lv.rate.timeSec < minTime) add('warn', '목표 시간 ' + lv.rate.timeSec + '초는 너무 짧아요 (쉬지 않고 달려도 약 ' + minTime + '초)');
    add('info', '별 평가 조건: ' + lv.rate.timeSec + '초 안 · ' + (lv.rate.allStars ? '수집 별 모두 · ' : '') + lv.rate.maxTries + '번 안');
    var est = estimateInk(lv), pk = peakInk(lv);
    add('info', '틈 ' + gaps(lv).length + '개 · 막는 벽 ' + blockingWalls(lv).length + '개 · 모범 풀이 잉크 합계 약 ' + est +
      ' · 한꺼번에 필요한 최대(선 수명 동안 ' + pk.span + 'px 구간) 약 ' + pk.peak + ' / 기본 잉크 ' + lv.ink);
    if (pk.peak > lv.ink * 0.9) add('warn', '한꺼번에 필요한 잉크가 빠듯하거나 모자라요 (약 ' + pk.peak + ', 기본 ' + lv.ink + '). 잉크 병 없이도 깰 수 있게 기본량으로 맞추세요');
    if (lv.stops < 1) add('info', '정지 횟수 0: 달리면서만 그려야 해요');
    if (!lv.inks.length) add('error', '쓸 수 있는 색이 없어요 (구간 설정 → 쓸 수 있는 색)');
    else add('info', '쓸 수 있는 색: ' + lv.inks.map(function (c) { return D.inks[c].name; }).join(', ') +
      ' · 튕김 ' + lv.fx.bounce + ' · 가속 ' + lv.fx.boostPct + '% ' + (lv.fx.boostMs / 1000) + '초');
    var shooters = lv.props.filter(function (p) { return p.type === 'shooter'; });
    if (shooters.length && lv.inks.indexOf('green') < 0) add('warn', '발사기가 있는데 초록(막기)을 쓸 수 없어요');
    return out;
  }

  return { normalize: normalize, groundTopAt: groundTopAt, gaps: gaps, blockingWalls: blockingWalls, estimateInk: estimateInk, peakInk: peakInk, check: check };
})();

</script>
<script>
// util.js
// 공용 도구: 시드 난수, 버전 있는 저장
var G = G || {};

// mulberry32 — 같은 시드면 같은 수열
G.makeRng = function (seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

// 계정 저장. localStorage가 막혀 있어도(사생활 보호 모드 등) 게임은 돌아가게 한다
//   inkBonus: 잉크 병으로 늘어난 최대량(영구) / bottles: 먹은 잉크 병 { "구간id:병id": true }
//   records: 구간별 기록 { 구간id: { stars(최고), bestMs, clears, tries } }
G.Save = {
  blank: function () {
    return { v: G.DATA.version, timeMode: G.DATA.defaultTimeMode, stats: {}, inkBonus: 0, bottles: {}, records: {} };
  },

  // 빠진 칸을 채운다 (예전 저장에는 inkBonus 등이 없음)
  fill: function (s) {
    var b = this.blank();
    for (var k in b) if (s[k] === undefined) s[k] = b[k];
    return s;
  },

  load: function () {
    var S = G.DATA.save;
    try {
      var raw = localStorage.getItem(S.key);
      if (!raw) {                                  // 이름을 바꾸기 전 저장이 있으면 옮겨 온다
        for (var i = 0; i < S.oldKeys.length && !raw; i++) raw = localStorage.getItem(S.oldKeys[i]);
      }
      if (!raw) return this.blank();
      var s = JSON.parse(raw);
      return s && s.v === G.DATA.version ? this.fill(s) : this.blank();
    } catch (e) { return this.blank(); }
  },
  write: function (s) {
    try { localStorage.setItem(G.DATA.save.key, JSON.stringify(s)); } catch (e) { /* 무시 */ }
  }
};

</script>
<script>
// physics.js
// Matter.js 감싸기. 다른 파일은 Matter를 직접 부르지 않고 이 함수들을 쓴다.
var G = G || {};

G.Physics = (function () {
  var M = (typeof Matter !== 'undefined') ? Matter : null;

  function create() {
    var engine = M.Engine.create();
    engine.gravity.y = G.DATA.physics.gravityY;
    return engine;
  }

  function add(engine, body) { M.Composite.add(engine.world, body); return body; }
  function remove(engine, body) { M.Composite.remove(engine.world, body); }

  function staticRect(x, y, w, h, opts) {
    var o = { isStatic: true, friction: 0, label: 'ground' };
    for (var k in opts) o[k] = opts[k];
    return M.Bodies.rectangle(x, y, w, h, o);
  }

  // 점 a → b 를 잇는 얇은 사각형. 끝을 둥글게 하고 살짝 길게 해 이음매 턱을 줄인다
  function segment(a, b, thick, opts) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) + thick * 0.5;
    var o = {
      isStatic: true, angle: Math.atan2(dy, dx), friction: G.DATA.ink.friction,
      chamfer: { radius: thick * 0.49 }, label: 'ink'
    };
    for (var k in opts) o[k] = opts[k];
    return M.Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len, thick, o);
  }

  // 시간 배율 scale 로 한 스텝 진행 (scale 0이면 진행하지 않음)
  function step(engine, scale) {
    if (scale <= 0) return;
    engine.timing.timeScale = scale;
    M.Engine.update(engine, G.DATA.loop.stepMs);
  }

  // body 와 지금 닿아 있는 접촉점 목록
  function contacts(engine, body) {
    var out = [], list = engine.pairs.list;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p.isActive || p.isSensor) continue;
      if (p.bodyA !== body && p.bodyB !== body) continue;
      var c = p.collision;
      for (var j = 0; j < c.supportCount; j++) out.push(c.supports[j]);
    }
    return out;
  }

  // body 와 닿아 있는 상대 바디마다 { other, pts } (색 잉크 선을 밟았는지 보려고)
  function touching(engine, body) {
    var out = [], list = engine.pairs.list;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p.isActive || p.isSensor) continue;
      if (p.bodyA !== body && p.bodyB !== body) continue;
      var c = p.collision, pts = [];
      for (var j = 0; j < c.supportCount; j++) pts.push(c.supports[j]);
      out.push({ other: p.bodyA === body ? p.bodyB : p.bodyA, pts: pts });
    }
    return out;
  }

  function allBodies(engine) { return M.Composite.allBodies(engine.world); }

  return {
    M: M, create: create, add: add, remove: remove, staticRect: staticRect,
    segment: segment, step: step, contacts: contacts, touching: touching, allBodies: allBodies
  };
})();

</script>
<script>
// level.js
// 구간 만들기: levels.js 의 구간 데이터를 정적 물리 바디로 바꾼다
var G = G || {};

G.Level = {
  // account: 계정 저장. 이미 먹은 잉크 병은 got=true 로 시작 (다시 먹을 수 없음)
  build: function (engine, raw, account) {
    var P = G.Physics, lv = G.LevelCheck.normalize(raw), depth = G.DATA.level.groundDepth;
    var owned = (account && account.bottles) || {};
    var out = { data: lv, goalX: lv.goal.x, stars: [], bottles: [], drains: [], shooters: [] };
    lv.ground.forEach(function (g) {
      P.add(engine, P.staticRect((g.x0 + g.x1) / 2, g.top + depth / 2, g.x1 - g.x0, depth));
    });
    var nBottle = 0;
    lv.props.forEach(function (p) {
      G.Props.build(engine, p);
      if (p.type === 'star') out.stars.push({ prop: p, got: false });
      if (p.type === 'inkup') {
        var key = G.Level.bottleKey(lv, p, nBottle++);
        out.bottles.push({ prop: p, key: key, got: !!owned[key], owned: !!owned[key] });
      }
      if (p.type === 'drain') out.drains.push({ x: p.x, y: p.y, w: p.w, h: p.h, prop: p });
      if (p.type === 'shooter') out.shooters.push({ prop: p, ms: 0 });
    });
    return out;
  },

  // 잉크 병의 계정 저장 이름: "구간id:병id" (레벨 툴이 병마다 id 를 붙임. 없으면 구간 안 순서)
  bottleKey: function (lv, p, i) { return lv.id + ':' + (p.id || 'inkup' + i); },

  groundTopAt: function (lv, x) { return G.LevelCheck.groundTopAt(lv, x); }
};

</script>
<script>
// player.js
// 캐릭터: 원형 몸체. 바닥에 있으면 바라보는 방향으로 목표 속도까지 가속(자동 달리기).
// 벽에 부딪히면 뒤로 돈다 (레밍즈식). 점프 없음 — 플레이어는 그림으로만 조작 (사용자 결정 2026-10-19).
var G = G || {};

G.Player = {
  create: function (engine, x, y) {
    var D = G.DATA.player, M = G.Physics.M;
    var body = M.Bodies.circle(x, y, D.radius, {
      friction: 0, frictionAir: 0, frictionStatic: 0, restitution: 0, label: 'player'
    });
    M.Body.setInertia(body, Infinity);   // 굴러가지 않게 (회전 없음)
    G.Physics.add(engine, body);
    return {
      body: body, dir: 1, grounded: false,
      turnCdMs: 0, turns: 0, stillMs: 0, lastX: x,
      boostMs: 0, bounceCdMs: 0, bounces: 0, onInk: null, events: []   // events: 이번 스텝의 색 효과 (화면 효과용)
    };
  },

  // 물리 스텝 직전에 호출. scale = 지금 시간 배율
  // fx = 구간의 색 효과 세기 (levels.js fx). 파랑을 밟는 중이거나 내린 직후면 더 빠른 목표 속도
  control: function (pl, scale, fx) {
    var D = G.DATA.player, M = G.Physics.M, v = pl.body.velocity;
    if (!pl.grounded) return;                     // 공중에서는 물리에 맡김
    var boost = pl.boostMs > 0 && fx;
    var target = D.runSpeed * (boost ? fx.boostPct / 100 : 1) * pl.dir;
    var vx = v.x + (target - v.x) * Math.min(1, D.accel * (boost ? 2.5 : 1) * scale);
    M.Body.setVelocity(pl.body, { x: vx, y: v.y });
  },

  // 물리 스텝 직후에 호출: 바닥 판정, 벽 판정(뒤로 돌기), 막힘 판정
  //   색 잉크: 빨강 선을 밟으면 선과 수직으로 튕김, 파랑 선을 밟는 동안·내린 뒤 boostMs 동안 빠름 (사용자 결정 2026-10-19)
  sense: function (pl, engine, realMs, scale, fx) {
    var D = G.DATA.player, b = pl.body, r = D.radius, gameMs = realMs * scale;
    var touch = G.Physics.touching(engine, b);
    var ground = false, wall = false, red = null, blue = false;
    pl.events.length = 0;
    for (var t = 0; t < touch.length; t++) {
      var pts = touch[t].pts, color = touch[t].other.inkColor;
      for (var i = 0; i < pts.length; i++) {
        var dy = pts[i].y - b.position.y, dx = pts[i].x - b.position.x;
        if (dy > r * D.groundCheck) {
          ground = true;
          if (color === 'red') red = touch[t].other;
          if (color === 'blue') blue = true;
        }
        else if (dx * pl.dir > r * 0.5 && dy < r - D.stepUp) wall = true;   // 가는 쪽 옆구리, 낮은 턱은 제외
      }
    }
    pl.grounded = ground;
    pl.onInk = red ? 'red' : blue ? 'blue' : null;
    pl.boostMs = Math.max(0, pl.boostMs - gameMs);
    pl.bounceCdMs = Math.max(0, pl.bounceCdMs - gameMs);
    if (fx && blue) {
      if (pl.boostMs <= 0) pl.events.push('boost');
      pl.boostMs = fx.boostMs;
    }
    if (fx && red && pl.bounceCdMs === 0 && scale > 0) {
      G.Physics.M.Body.setVelocity(b, G.Rules.bounceVelocity(red.angle, fx.bounce, b.velocity));
      pl.grounded = false;
      pl.bounceCdMs = G.DATA.bounceCdMs;
      pl.bounces += 1;
      pl.events.push('bounce');
    }
    pl.turnCdMs = Math.max(0, pl.turnCdMs - gameMs);
    if (wall && pl.turnCdMs === 0) {
      pl.dir = -pl.dir;
      pl.turns += 1;
      pl.turnCdMs = D.turnCooldownMs;
    }
    if (scale > 0) {
      if (Math.abs(b.position.x - pl.lastX) < 0.3 * scale) pl.stillMs += realMs;
      else pl.stillMs = 0;
    }
    pl.lastX = b.position.x;
  },

  isStuck: function (pl) { return pl.stillMs >= G.DATA.player.stuckMs; }
};

</script>
<script>
// draw.js
// 선 그리기: 마우스 드래그 → 잉크 소모 → 평활화 → 얇은 선분 체인 물리 바디
// 달리는 중에도 그릴 수 있다(사용자 결정 2026-10-19). 정지는 "여유 있게 설계"하는 수단.
// 화면(DOM)과 무관하다. 좌표는 모두 월드 좌표.
var G = G || {};

G.Draw = {
  begin: function (game, p) {
    if (game.status !== 'run' || game.ink <= 0) return false;
    game.stroke = G.Rules.newStroke(p);
    game.stroke.color = game.color;               // 그리기 시작할 때 고른 색 (그리는 중 바꿔도 이 선은 그대로)
    return true;
  },

  move: function (game, p) {
    if (!game.stroke) return;
    var used = G.Rules.addSample(game.stroke, p, game.ink, G.DATA.ink);
    game.ink -= used;
    if (game.stroke.full) this.end(game);   // 잉크·최대 길이 도달 → 자동으로 끝냄
  },

  end: function (game) {
    var s = game.stroke;
    if (!s) return;
    game.stroke = null;
    var r = G.Rules.finishStroke(s, G.DATA.ink);
    if (!r.ok) { game.ink += r.refund; game.toast('선이 너무 짧아요 (잉크 반환)'); return; }
    var line = { pts: r.pts, bodies: [], active: false, len: s.len, ageMs: 0, color: s.color || 'green' };
    game.lines.push(line);
    // 달리는 중에 그린 선, 슬로 모션 중에 그린 선은 바로 물리에 반영. 완전 정지 중 선은 재생 때 반영
    if (!game.stopped || game.mode.activateOnStrokeEnd) this.activate(game, line);
  },

  activate: function (game, line) {
    if (line.active) return;
    var P = G.Physics, th = G.DATA.ink.thickness;
    for (var i = 1; i < line.pts.length; i++) {
      line.bodies.push(P.add(game.engine, P.segment(line.pts[i - 1], line.pts[i], th, { inkColor: line.color })));
    }
    line.active = true;
  },

  // 재생할 때: 정지 중 그린 선을 한꺼번에 물리에 넣는다
  activateAll: function (game) {
    for (var i = 0; i < game.lines.length; i++) this.activate(game, game.lines[i]);
  },

  // 발판이 된 선만 나이를 먹고, 수명이 다하면 물리에서 빼고 지운다 (사용자 결정 2026-10-19)
  // gameMs = 게임 시간 (실제 시간 × 시간 배율)
  age: function (game, gameMs) {
    var life = G.DATA.ink.lifeMs;
    for (var i = game.lines.length - 1; i >= 0; i--) {
      var ln = game.lines[i];
      if (!ln.active) continue;
      ln.ageMs += gameMs;
      if (G.Rules.lineExpired(ln.ageMs, life)) {
        for (var j = 0; j < ln.bodies.length; j++) G.Physics.remove(game.engine, ln.bodies[j]);
        game.lines.splice(i, 1);
        var before = game.ink;                    // 사라진 선의 잉크를 돌려받음 (사용자 결정 2026-10-19)
        game.ink = G.Rules.refundInk(game.ink, ln.len, game.inkMax);
        game.inkRefunded = (game.inkRefunded || 0) + (game.ink - before);
      }
    }
  }
};

</script>
<script>
// game.js
// 게임 상태와 한 스텝 진행. 화면(DOM)과 무관 → 브라우저 밖에서도 돌릴 수 있다.
var G = G || {};

G.Game = {
  // levelData: levels.js 의 구간 하나 (없으면 첫 구간)
  // account: 계정 저장 (G.Save). 잉크 최대량 성장·먹은 잉크 병을 여기에 기록한다. 없으면 빈 계정
  create: function (timeModeKey, levelData, account) {
    var game = {
      modeKey: timeModeKey, mode: G.DATA.timeModes[timeModeKey],
      levelData: levelData || G.LEVELS[0],
      account: account || { inkBonus: 0, bottles: {} },
      messages: [], attempt: 0, color: null
    };
    game.toast = function (text) { game.messages.push({ text: text, ms: 1800 }); };
    this.reset(game);
    return game;
  },

  setLevel: function (game, levelData) {
    game.levelData = levelData;
    game.attempt = 0;
    this.reset(game);
  },

  // 구간 처음부터 (잉크·정지 횟수·선·별 모두 초기화)
  reset: function (game) {
    var D = G.DATA;
    game.engine = G.Physics.create();
    game.level = G.Level.build(game.engine, game.levelData, game.account);
    var lv = game.level.data;
    var top = G.Level.groundTopAt(lv, lv.start.x);
    if (top == null) top = 600;                    // 레벨 툴에서 잘못 놓은 경우에도 멈추지 않게
    game.player = G.Player.create(game.engine, lv.start.x, top - D.player.radius - 1);
    var lowest = lv.ground.reduce(function (m, g) { return Math.max(m, g.top); }, 600);
    game.failY = lowest + D.physics.failY - 600;   // 가장 낮은 땅보다 500 아래로 떨어지면 실패
    game.inkMax = lv.ink + (game.account.inkBonus || 0);   // 구간 기본량 + 계정에 쌓인 잉크 병 보너스
    game.ink = game.inkMax;
    game.inkRefunded = 0;         // 이번 판에 사라진 선에서 돌려받은 양 (확인용)
    game.inkDrained = 0;          // 이번 판에 웅덩이로 잃은 양
    game.stops = G.Rules.newStops(lv.stops);
    game.stopped = false;
    game.stoppedMs = 0;
    game.stroke = null;
    game.lines = [];
    game.fx = [];                 // 짧은 효과 (별 반짝, 착지 먼지, 튕김·가속·막기)
    game.projs = [];              // 날아가는 투사체 {x, y, vx, vy, ms}
    game.blocked = 0;             // 초록 선으로 막은 투사체 수
    game.finishedAt = 0;          // 끝난 시각 (Date.now, 도착 물감 통이 차오르는 연출용)
    // 고른 색: 이 구간에서 쓸 수 있으면 그대로, 아니면 첫 색 (사용자 결정 2026-10-19: 병 클릭 / 휠 / 1·2·3)
    //   처음에는 초록(보통 발판)이 있으면 초록
    if (lv.inks.indexOf(game.color) < 0) game.color = lv.inks.indexOf('green') >= 0 ? 'green' : (lv.inks[0] || 'green');
    game.status = 'ready';        // ready(시작 대기) | run | clear | fail
    game.failReason = '';
    game.timeMs = 0;              // 구간 진행 시간(실제 시간 기준)
    game.stopsUsedThisRun = 0;
    game.attempt += 1;
  },

  start: function (game) { if (game.status === 'ready') game.status = 'run'; },

  setMode: function (game, key) {
    game.modeKey = key;
    game.mode = G.DATA.timeModes[key];
  },

  toggleStop: function (game) {
    if (game.status !== 'run') return;
    if (game.stopped) { this.resume(game); return; }
    if (!G.Rules.useStop(game.stops)) { game.toast('정지 횟수가 없어요'); return; }
    game.stopped = true;
    game.stoppedMs = 0;
    game.stopsUsedThisRun += 1;
  },

  resume: function (game) {
    if (!game.stopped) return;
    G.Draw.end(game);
    G.Draw.activateAll(game);
    game.stopped = false;
  },

  // 색 고르기. 이 구간에서 아직 못 쓰는 색이면 안내만
  setColor: function (game, c) {
    if (!G.DATA.inks[c]) return false;
    if (game.level.data.inks.indexOf(c) < 0) { game.toast(G.DATA.inks[c].name + ': 이 구간에서는 아직 못 써요'); return false; }
    game.color = c;
    return true;
  },
  cycleColor: function (game, d) { game.color = G.Rules.nextColor(game.level.data.inks, game.color, d) || game.color; },

  scale: function (game) { return G.Rules.timeScale(game.mode, game.stopped); },

  // 고정 타임스텝 한 번 (realMs = 실제 시간 1스텝)
  update: function (game, realMs) {
    for (var i = game.messages.length - 1; i >= 0; i--) {
      game.messages[i].ms -= realMs;
      if (game.messages[i].ms <= 0) game.messages.splice(i, 1);
    }
    if (game.status !== 'run') return;
    if (game.fx.length) game.fx = game.fx.filter(function (f) { return game.timeMs - f.t < 1000; });

    if (game.stopped) {
      game.stoppedMs += realMs;
      if (G.Rules.shouldAutoResume(game.mode, game.stopped, game.stoppedMs)) {
        this.resume(game);
        game.toast('시간 제한! 재생');
      }
    }
    game.timeMs += realMs;

    var s = this.scale(game), pl = game.player;
    if (s > 0) {
      var wasGrounded = pl.grounded, vyBefore = pl.body.velocity.y;
      var fx = game.level.data.fx;
      G.Player.control(pl, s, fx);
      G.Physics.step(game.engine, s);
      G.Player.sense(pl, game.engine, realMs, s, fx);
      pl.events.forEach(function (e) {             // 튕김·가속 효과
        game.fx.push({ type: e, x: pl.body.position.x, y: pl.body.position.y + G.DATA.player.radius, dir: pl.dir, t: game.timeMs });
      });
      if (!wasGrounded && pl.grounded && vyBefore >= G.DATA.art.fx.landVy) {   // 높은 곳에서 떨어져 닿음 → 먼지
        game.fx.push({ type: 'land', x: pl.body.position.x, y: pl.body.position.y + G.DATA.player.radius, t: game.timeMs });
      }
      G.Draw.age(game, realMs * s);
      this.shoot(game, realMs * s);
      this.moveProjectiles(game, s);
    }

    var pos = pl.body.position;
    this.collectStars(game, pos);
    this.collectBottles(game, pos);
    if (s > 0) this.drain(game, pos, realMs * s);
    if (game.status !== 'run') return;             // 투사체에 맞음
    if (pos.y > game.failY) this.finish(game, 'fail', '떨어졌어요');
    else if (pos.x >= game.level.goalX) this.finish(game, 'clear', '');
    else if (!game.stopped && G.Player.isStuck(pl)) this.finish(game, 'fail', '막혔어요');
  },

  collectStars: function (game, pos) {
    var D = G.DATA, r = D.player.radius;
    game.level.stars.forEach(function (s) {
      if (s.got) return;
      var p = s.prop, reach = r + (p.size || D.props.star.size) * D.level.starPickup;
      var dx = p.x - pos.x, dy = p.y - pos.y;
      if (dx * dx + dy * dy <= reach * reach) {
        s.got = true; s.gotMs = game.timeMs;
        game.fx.push({ type: 'star', x: p.x, y: p.y, t: game.timeMs });
      }
    });
  },

  starsGot: function (game) { return game.level.stars.filter(function (s) { return s.got; }).length; },

  // 잉크 병: 계정에 아직 없는 병이면 먹고 최대량이 영구히 늘어남 (먹은 순간 계정에 저장, 실패해도 유지)
  collectBottles: function (game, pos) {
    var D = G.DATA, r = D.player.radius, acc = game.account;
    game.level.bottles.forEach(function (b) {
      if (b.got) return;
      var p = b.prop, reach = r + (p.size || D.props.inkup.size) * D.level.starPickup;
      var dx = p.x - pos.x, dy = p.y - pos.y;
      if (dx * dx + dy * dy > reach * reach) return;
      b.got = true; b.gotMs = game.timeMs;
      acc.bottles[b.key] = true;
      acc.inkBonus = (acc.inkBonus || 0) + D.ink.upAmount;
      game.inkMax += D.ink.upAmount;
      game.ink += D.ink.upAmount;
      game.fx.push({ type: 'star', x: p.x, y: p.y, t: game.timeMs });
      game.toast('잉크 최대량 +' + D.ink.upAmount + ' (영구)');
      if (game.onAccountChange) game.onAccountChange(game);
    });
  },

  // 잉크 웅덩이: 캐릭터(원)가 웅덩이 사각형에 닿아 있는 동안 잉크가 줄어듦 (gameMs = 게임 시간)
  drain: function (game, pos, gameMs) {
    var r = G.DATA.player.radius, touching = false;
    game.level.drains.forEach(function (d) {
      var cx = Math.max(d.x, Math.min(pos.x, d.x + d.w)), cy = Math.max(d.y, Math.min(pos.y, d.y + d.h));
      var dx = pos.x - cx, dy = pos.y - cy;
      if (dx * dx + dy * dy < r * r) touching = true;
    });
    game.draining = touching;
    if (!touching) return;
    var before = game.ink;
    game.ink = G.Rules.drainInk(game.ink, G.DATA.ink.drainPerSec, gameMs);
    game.inkDrained += before - game.ink;
  },

  // 발사기: periodMs 마다 angle 방향으로 투사체 (gameMs = 게임 시간이라 정지 중에는 안 쏨)
  shoot: function (game, gameMs) {
    var D = G.DATA, def = D.props.shooter;
    game.level.shooters.forEach(function (sh) {
      var p = sh.prop, period = p.periodMs || def.periodMs;
      sh.ms += gameMs;
      if (sh.ms < period) return;
      sh.ms -= period;
      var a = (p.angle != null ? p.angle : def.angle) * Math.PI / 180, sp = p.speed || def.speed;
      var cx = p.x + p.w / 2, cy = p.y + p.h / 2, reach = Math.max(p.w, p.h) / 2 + D.projectile.radius + 2;
      game.projs.push({ x: cx + Math.cos(a) * reach, y: cy + Math.sin(a) * reach, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, ms: 0, from: p });
    });
  },

  // 투사체 이동: 초록 선(발판이 된 것)에 닿으면 막힘, 땅·단단한 프랍에 닿으면 사라짐, 캐릭터에 닿으면 실패
  moveProjectiles: function (game, s) {
    var D = G.DATA, pr = D.projectile.radius, th = D.ink.thickness / 2, lv = game.level.data;
    var pl = game.player.body.position, hitR = D.player.radius + pr * 0.8;
    for (var i = game.projs.length - 1; i >= 0; i--) {
      var q = game.projs[i], gone = false;
      q.x += q.vx * s; q.y += q.vy * s; q.ms += D.loop.stepMs * s;
      for (var k = 0; k < game.lines.length && !gone; k++) {
        var ln = game.lines[k];
        if (!ln.active || ln.color !== 'green') continue;
        for (var j = 1; j < ln.pts.length; j++) {
          if (G.Rules.pointSegDist(q, ln.pts[j - 1], ln.pts[j]) <= pr + th) { gone = 'block'; break; }
        }
      }
      if (!gone) {
        var top = G.LevelCheck.groundTopAt(lv, q.x);
        if (top != null && q.y + pr * 0.5 >= top) gone = 'hit';
        lv.props.forEach(function (p) {
          var d = D.props[p.type];
          if (gone || p === q.from || !d || !d.solid) return;
          if (q.x > p.x - pr * 0.5 && q.x < p.x + p.w + pr * 0.5 && q.y > p.y - pr * 0.5 && q.y < p.y + p.h + pr * 0.5) gone = 'hit';
        });
      }
      if (!gone && q.ms > D.projectile.lifeMs) gone = 'old';
      if (!gone) {
        var dx = q.x - pl.x, dy = q.y - pl.y;
        if (dx * dx + dy * dy < hitR * hitR) { game.projs.splice(i, 1); this.finish(game, 'fail', '투사체에 맞았어요'); return; }
        continue;
      }
      if (gone === 'block') { game.blocked += 1; game.fx.push({ type: 'block', x: q.x, y: q.y, t: game.timeMs }); }
      game.projs.splice(i, 1);
    }
  },

  finish: function (game, status, reason) {
    game.status = status;
    game.finishedAt = Date.now();
    game.failReason = reason;
    game.stopped = false;
    game.stroke = null;
    game.result = null;
    if (status === 'clear') {
      game.result = G.Rules.rateClear(game.level.data.rate, {
        timeMs: game.timeMs, starsGot: this.starsGot(game), starsTotal: game.level.stars.length, tries: game.attempt
      });
    }
    if (game.onFinish) game.onFinish(game);
  }
};

</script>
<script>
// assets.js
// 이미지 불러오기. 단일 파일 빌드는 G.EMBED(내장 이미지)를 먼저 보고, 개발본은 assets/ 폴더에서 읽는다.
// 이미지가 없거나 아직 안 불러졌으면 get()이 null → 화면은 색 블록으로 그린다.
// (개발본에서 없는 파일은 브라우저 콘솔에 404로 남지만 게임에는 영향 없음)
var G = G || {};

G.Assets = {
  img: {},

  load: function () {
    var self = this, art = G.DATA.art;
    art.images.forEach(function (name) {
      var src = G.EMBED && G.EMBED[name];
      if (!src) {
        if (G.SINGLE_FILE) return;               // 제출본은 외부 파일을 읽지 않는다
        src = art.dir + name + '.png';
      }
      var im = new Image();
      im.onload = function () { self.img[name] = im; };
      im.src = src;
    });
  },

  get: function (name) { return this.img[name] || null; }
};

</script>
<script>
// props.js
// 땅·프랍 그리기와 물리 바디 만들기. 게임(ui.js)과 레벨 툴(tools/editor.js)이 같은 함수를 써서 보이는 모습이 같다.
var G = G || {};

G.Props = (function () {
  function def(type) { return G.DATA.props[type]; }

  // 화면에서 차지하는 사각형 (선택·충돌 검사용)
  function rect(p) {
    var d = def(p.type);
    if (d && d.box) return { x: p.x, y: p.y, w: p.w, h: p.h };
    if (p.type === 'text') {
      var s = p.size || d.size, w = (p.text || '').length * s * 0.95;
      return { x: p.x, y: p.y - s, w: Math.max(w, s), h: s * 1.3 };
    }
    var size = p.size || (d && d.size) || 40;
    return { x: p.x - size / 2, y: p.y - size / 2, w: size, h: size };
  }

  // 원본 조각(sx,sy,sw,sh)을 화면 칸(dx,dy,dw,dh)에 한 조각 크기(tw,th)로 반복해서 채운다. 끝은 잘라서
  function tile(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh, tw, th) {
    for (var y = 0; y < dh - 0.01; y += th) {
      var hh = Math.min(th, dh - y), fh = hh / th;
      for (var x = 0; x < dw - 0.01; x += tw) {
        var ww = Math.min(tw, dw - x), fw = ww / tw;
        ctx.drawImage(img, sx, sy, sw * fw, sh * fh, dx + x, dy + y, ww, hh);
      }
    }
  }

  // 이미지를 방식에 맞춰 x,y,w,h 에 그린다
  function drawImg(ctx, name, mode, img, x, y, w, h) {
    var A = G.DATA.art;
    if (mode === 'nine') {
      // 9분할: 테두리(모서리·변)는 원본 비율 그대로, 가운데·변은 늘리지 않고 같은 크기로 반복 (벽돌 무늬가 찌그러지지 않게)
      var sl = A.slices[name] || { src: 32, dst: 16 }, s = sl.src, k = sl.dst / sl.src;
      var d = Math.min(sl.dst, w / 2, h / 2), iw = img.width, ih = img.height;
      var sx = [0, s, iw - s, iw], dx = [x, x + d, x + w - d, x + w];
      var sy = [0, s, ih - s, ih], dy = [y, y + d, y + h - d, y + h];
      for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) {
        var dw = dx[i + 1] - dx[i], dh = dy[j + 1] - dy[j], sw = sx[i + 1] - sx[i], sh = sy[j + 1] - sy[j];
        if (dw <= 0 || dh <= 0) continue;
        tile(ctx, img, sx[i], sy[j], sw, sh, dx[i], dy[j], dw, dh, i === 1 ? sw * k : dw, j === 1 ? sh * k : dh);
      }
    } else if (mode === 'stack') {               // 폭에 맞춰 위에서부터 세로로 쌓기 (입체 돌 블록용)
      var cr = A.wallCrop, th = w * cr[3] / cr[2];
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      for (var yy = y; yy < y + h; yy += th) ctx.drawImage(img, cr[0], cr[1], cr[2], cr[3], x, yy, w, th);
      ctx.restore();
    } else {                                      // fit: 비율 유지, 가운데
      var k = Math.min(w / img.width, h / img.height), fw = img.width * k, fh = img.height * k;
      ctx.drawImage(img, x + (w - fw) / 2, y + (h - fh) / 2, fw, fh);
    }
  }

  // 목록에서 있는 이미지 하나를 골라 그린다. 없으면 false
  function drawFirst(ctx, list, r) {
    for (var i = 0; i < (list || []).length; i++) {
      var img = G.Assets.get(list[i][0]);
      if (img) { drawImg(ctx, list[i][0], list[i][1], img, r.x, r.y, r.w, r.h); return true; }
    }
    return false;
  }

  function drawStarShape(ctx, cx, cy, r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  // opts: { editor: true } 이면 그림이 없는 장식도 자리 표시
  function draw(ctx, p, opts) {
    var d = def(p.type), C = G.DATA.colors, r = rect(p);
    if (!d) return;
    if (p.type === 'text') {
      ctx.fillStyle = 'rgba(43,33,24,0.55)';
      ctx.font = (p.size || d.size) + 'px sans-serif';
      ctx.fillText(p.text || '', p.x, p.y);
      return;
    }
    if (p.type === 'deco') {
      var img = G.Assets.get(p.img || d.img);
      if (img) drawImg(ctx, p.img, 'fit', img, r.x, r.y, r.w, r.h);
      else if (opts && opts.editor) {
        ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(43,33,24,0.4)'; ctx.lineWidth = 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(43,33,24,0.5)'; ctx.font = '13px sans-serif';
        ctx.fillText((p.img || d.img) + ' (그림 없음)', r.x + 6, r.y + 18);
      }
      return;
    }
    if (drawFirst(ctx, d.imgs, r)) return;
    if (p.type === 'inkup') {                    // 그림이 없을 때: 먹색 잉크 병 + "+"
      var bw = r.w * 0.5, bh = r.h * 0.62, bx = p.x - bw / 2, by = p.y - bh / 2 + r.h * 0.08;
      ctx.fillStyle = C.ink; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#C9A26B'; ctx.fillRect(p.x - bw * 0.25, by - r.h * 0.18, bw * 0.5, r.h * 0.18);
      ctx.strokeRect(p.x - bw * 0.25, by - r.h * 0.18, bw * 0.5, r.h * 0.18);
      ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(r.w * 0.36) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.fillText('+', p.x, by + bh * 0.68); ctx.textAlign = 'left';
      return;
    }
    if (p.type === 'drain') {                    // 그림이 없을 때: 검보라 웅덩이
      ctx.fillStyle = d.color; ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, r.h / 2); else ctx.rect(r.x, r.y, r.w, r.h);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(r.x + r.w * 0.15, r.y + 3, r.w * 0.2, 2);
      return;
    }
    if (p.type === 'shooter') {                  // 그림이 없을 때: 회색 상자 + 쏘는 방향의 포구
      var a = (p.angle != null ? p.angle : d.angle) * Math.PI / 180, cx = p.x + p.w / 2, cy = p.y + p.h / 2, mr = Math.min(p.w, p.h) * 0.22;
      ctx.fillStyle = d.color; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.lineWidth = 4; ctx.strokeStyle = C.outline; ctx.strokeRect(r.x, r.y, r.w, r.h);
      var mx = cx + Math.cos(a) * (p.w / 2 - mr * 0.4), my = cy + Math.sin(a) * (p.h / 2 - mr * 0.4);
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, 6.283); ctx.fillStyle = '#1E1A22'; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - Math.cos(a) * mr, cy - Math.sin(a) * mr - 4, 4, 0, 6.283); ctx.fill();
      return;
    }
    if (p.type === 'star') {
      drawStarShape(ctx, p.x, p.y, r.w / 2);
      ctx.fillStyle = C.star; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = C.outline; ctx.stroke();
      return;
    }
    ctx.fillStyle = d.color || C.ground; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.lineWidth = 4; ctx.strokeStyle = C.outline; ctx.strokeRect(r.x, r.y, r.w, r.h);
  }

  // 땅: 속은 ground_fill 무늬(없으면 색), 윗면은 ground_top 띠(없으면 굵은 선)
  var patterns = {};
  function drawGround(ctx, g) {
    var C = G.DATA.colors, A = G.DATA.art, depth = G.DATA.level.groundDepth;
    var w = g.x1 - g.x0, fill = G.Assets.get('ground_fill'), top = G.Assets.get('ground_top');
    if (fill) {
      if (!patterns.fill) patterns.fill = ctx.createPattern(fill, 'repeat');
      ctx.fillStyle = patterns.fill;
    } else ctx.fillStyle = C.ground;
    ctx.fillRect(g.x0, g.top, w, depth);
    if (fill && A.groundTint) { ctx.fillStyle = A.groundTint; ctx.fillRect(g.x0, g.top, w, depth); }
    if (top) {
      ctx.lineWidth = 3; ctx.strokeStyle = C.outline;   // 땅 양 끝 세로 테두리 (틈이 틈으로 보이게)
      ctx.beginPath(); ctx.moveTo(g.x0, g.top); ctx.lineTo(g.x0, g.top + depth); ctx.moveTo(g.x1, g.top); ctx.lineTo(g.x1, g.top + depth); ctx.stroke();
      var th = A.groundTop.h, tw = top.width * th / top.height, y = g.top - A.groundTop.up;
      ctx.save();
      ctx.beginPath(); ctx.rect(g.x0, y - 2, w, th + 4); ctx.clip();
      for (var x = g.x0; x < g.x1; x += tw) ctx.drawImage(top, x, y, tw, th);
      ctx.restore();
    } else {
      ctx.lineWidth = 4; ctx.strokeStyle = C.outline;
      ctx.beginPath(); ctx.moveTo(g.x0, g.top + depth); ctx.lineTo(g.x0, g.top); ctx.lineTo(g.x1, g.top); ctx.lineTo(g.x1, g.top + depth); ctx.stroke();
    }
  }

  // 물리: 단단한 프랍만 정적 사각형으로
  function build(engine, p) {
    var d = def(p.type);
    if (!d || !d.solid) return null;
    return G.Physics.add(engine, G.Physics.staticRect(p.x + p.w / 2, p.y + p.h / 2, p.w, p.h, { label: p.type }));
  }

  return { def: def, rect: rect, draw: draw, drawGround: drawGround, build: build, drawStarShape: drawStarShape };
})();

</script>
<script>
// ui.js
// 화면 그리기 (캔버스). 이미지가 없으면 색 블록으로 그린다. 땅·프랍은 props.js 를 레벨 툴과 함께 쓴다.
var G = G || {};

G.UI = (function () {
  var C = G.DATA.colors, V = G.DATA.view;
  var cam = { x: 0, y: 0, frac: V.playerScreenX };
  var specks = null;

  function makeSpecks() {
    var rnd = G.makeRng(G.DATA.seed), out = [];
    for (var i = 0; i < 160; i++) out.push({ x: rnd() * 4000, y: rnd() * 720, r: 1 + rnd() * 2 });
    return out;
  }

  function updateCamera(game) {
    var p = game.player.body.position;
    var tf = game.player.dir > 0 ? V.playerScreenX : V.playerScreenXBack;
    if (G.Game.scale(game) > 0) cam.frac += (tf - cam.frac) * 0.04;   // 뒤로 돌면 천천히 가는 쪽을 넓게
    cam.x = p.x - V.w * cam.frac;
    var ty = Math.min(0, p.y - 320);              // 높이 올라가면 따라 올라감
    if (p.y > 700) ty = cam.y;                    // 떨어질 때는 따라가지 않음
    cam.y += (ty - cam.y) * 0.1;
  }

  function toWorld(sx, sy) { return { x: sx + cam.x, y: sy + cam.y }; }

  function poly(ctx, verts) {
    ctx.beginPath();
    ctx.moveTo(verts[0].x, verts[0].y);
    for (var i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
    ctx.closePath();
  }

  function path(ctx, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  }

  // 화면 크기 w×h 에 배경 그리기. name: 구간의 bg (levels.js), camX: 카메라 x (레벨 툴도 사용)
  function drawBackground(ctx, name, camX, w, h) {
    w = w || V.w; h = h || V.h;
    ctx.fillStyle = C.paper;
    ctx.fillRect(0, 0, w, h);
    var bg = name && name !== 'none' && G.Assets.get(name);
    if (bg) {                                     // 화면 높이에 맞춰 가로로 이어 붙인다
      var bw = bg.width * h / bg.height;
      var off = ((camX * G.DATA.art.bgParallax) % bw + bw) % bw;
      for (var x = -off; x < w; x += bw) ctx.drawImage(bg, x, 0, bw, h);
      return;
    }
    if (!specks) specks = makeSpecks();
    ctx.fillStyle = 'rgba(43,33,24,0.08)';
    var off2 = ((camX * 0.5) % 4000 + 4000) % 4000;
    for (var i = 0; i < specks.length; i++) {
      var s = specks[i], sx = s.x - off2;
      if (sx < -10) sx += 4000;
      if (sx > w + 10) continue;
      ctx.beginPath(); ctx.arc(sx, s.y * h / V.h, s.r, 0, 6.283); ctx.fill();
    }
  }

  // 시작 구멍: 스케치북을 뚫고 나온 구멍 (사용자 결정 2026-10-19). 캐릭터 뒤에 그림. 이미지 없으면 코드로 찢긴 구멍
  function drawStart(ctx, sx, gy) {
    if (gy == null) return;
    var A = G.DATA.art.startHole, s = A.size, cx = sx, cy = gy - A.up;
    var img = G.Assets.get('start_hole');
    if (img) { ctx.drawImage(img, cx - s / 2, cy - s / 2, s, s); return; }
    var rnd = G.makeRng(7), n = 18, i, a, rr;
    ctx.save();
    ctx.beginPath();                               // 찢긴 종이 가장자리 (흰 종이 뒷면)
    for (i = 0; i <= n; i++) {
      a = i / n * 6.283; rr = s * (0.42 + rnd() * 0.08);
      ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.92);
    }
    ctx.closePath(); ctx.fillStyle = '#FFFDF6'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = C.outline; ctx.stroke();
    ctx.beginPath();                               // 안쪽 어두운 구멍
    for (i = 0; i <= n; i++) {
      a = i / n * 6.283; rr = s * (0.30 + rnd() * 0.06);
      ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.92);
    }
    ctx.closePath(); ctx.fillStyle = '#1E1A22'; ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2;   // 소용돌이 몇 줄
    for (i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(cx, cy, s * 0.07 * i, i, i + 3.6); ctx.stroke(); }
    ctx.restore();
  }

  // 도착 물감 통 (사용자 결정 2026-10-19): 비어 있다가 도착하면 차오름. fill 0~1. 왼쪽 끝 ≈ 도착 x, 바닥 = 땅 윗면
  //   goal_jar_empty / goal_jar_full 이미지가 있으면 빈 통 위에 찬 통을 아래부터 fill 만큼 잘라 겹침
  function drawGoal(ctx, gx, gy, fill) {
    if (gy == null) return;
    var J = G.DATA.art.goalJar, x = gx - 10, y = gy - J.h, w = J.w, h = J.h;
    fill = Math.max(0, Math.min(1, fill || 0));
    var empty = G.Assets.get('goal_jar_empty'), full = G.Assets.get('goal_jar_full');
    if (empty) {
      ctx.drawImage(empty, x, y, w, h);
      if (full && fill > 0) {
        ctx.save(); ctx.beginPath(); ctx.rect(x, y + h * (1 - fill), w, h * fill); ctx.clip();
        ctx.drawImage(full, x, y, w, h); ctx.restore();
      }
      return;
    }
    var bx = x + w * 0.1, bw = w * 0.8, by = y + h * 0.18, bh = h * 0.82;   // 통 몸체
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 22); else ctx.rect(bx, by, bw, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    if (fill > 0) {                                // 물감: 세 색이 층층이 차오름
      ctx.save(); ctx.clip();
      var top = by + bh * (1 - fill * 0.92), band = (by + bh - top) / 3;
      [C.green, C.blue, C.red].forEach(function (c, i) {
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.moveTo(bx, top + band * i + 6);
        ctx.quadraticCurveTo(bx + bw / 2, top + band * i - 8, bx + bw, top + band * i + 6);
        ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx, by + bh); ctx.closePath(); ctx.fill();
      });
      ctx.restore();
    }
    ctx.beginPath();                               // 물감 칠하며 바뀐 경로 대신 통 몸체 외곽선을 다시
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 22); else ctx.rect(bx, by, bw, bh);
    ctx.lineWidth = 4; ctx.strokeStyle = C.outline; ctx.stroke();
    ctx.fillStyle = '#C9A26B';                       // 넓은 입구 테두리
    ctx.fillRect(x + w * 0.04, y + h * 0.1, w * 0.92, h * 0.1); ctx.strokeRect(x + w * 0.04, y + h * 0.1, w * 0.92, h * 0.1);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(bx + 12, by + 18, 8, bh * 0.5);   // 유리 반사
    ctx.restore();
  }

  // 도착한 뒤 지난 시간 → 물감 통 채움 정도 (1 넘으면 다 참)
  function goalFill(game) {
    if (game.status !== 'clear' || !game.finishedAt) return 0;
    return (Date.now() - game.finishedAt) / G.DATA.art.goalJar.fillMs;
  }

  function drawWorld(ctx, game, debug) {
    ctx.save();
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

    var lv = game.level.data;
    // 장식·글자 (뒤) → 땅 → 잉크 웅덩이 → 단단한 프랍 → 깃발 → 별·잉크 병
    lv.props.forEach(function (p) { if (p.type === 'deco' || p.type === 'text') G.Props.draw(ctx, p); });
    lv.ground.forEach(function (g) { G.Props.drawGround(ctx, g); });
    lv.props.forEach(function (p) { if (p.type === 'drain') G.Props.draw(ctx, p); });
    lv.props.forEach(function (p) { var d = G.Props.def(p.type); if (d && d.solid) G.Props.draw(ctx, p); });
    drawStart(ctx, lv.start.x, G.Level.groundTopAt(lv, lv.start.x));
    drawGoal(ctx, lv.goal.x, G.Level.groundTopAt(lv, lv.goal.x), goalFill(game));
    game.level.stars.forEach(function (s) {
      if (!s.got) { G.Props.draw(ctx, s.prop); return; }
      var t = (game.timeMs - s.gotMs) / 300;      // 먹으면 0.3초 동안 커지며 사라짐
      if (t >= 1) return;
      ctx.save(); ctx.globalAlpha = 1 - t;
      ctx.translate(s.prop.x, s.prop.y - t * 30); ctx.scale(1 + t * 0.6, 1 + t * 0.6); ctx.translate(-s.prop.x, -s.prop.y);
      G.Props.draw(ctx, s.prop); ctx.restore();
    });
    game.level.bottles.forEach(function (b) {
      if (b.owned) {                              // 계정에 이미 있는 병: 흐린 자국만 (다시 먹을 수 없음)
        ctx.save(); ctx.globalAlpha = 0.2; G.Props.draw(ctx, b.prop); ctx.restore();
        return;
      }
      if (!b.got) { G.Props.draw(ctx, b.prop); return; }
      var t = (game.timeMs - b.gotMs) / 300;
      if (t >= 1) return;
      ctx.save(); ctx.globalAlpha = 1 - t;
      ctx.translate(b.prop.x, b.prop.y - t * 30); ctx.scale(1 + t * 0.6, 1 + t * 0.6); ctx.translate(-b.prop.x, -b.prop.y);
      G.Props.draw(ctx, b.prop); ctx.restore();
    });

    // 선 (재생 전 선은 흐리게 점선)
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var ink = G.DATA.ink;
    game.lines.forEach(function (ln) {
      ctx.globalAlpha = ln.active ? G.Rules.lineAlpha(ln.ageMs, ink.lifeMs, ink.fadeMs) : 0.5;
      drawInkLine(ctx, ln.pts, ln.color, !ln.active);
    });
    ctx.globalAlpha = 1;
    if (game.stroke && game.stroke.pts.length > 1) {
      ctx.globalAlpha = 0.6; drawInkLine(ctx, game.stroke.pts, game.stroke.color, true); ctx.globalAlpha = 1;
    }
    drawProjectiles(ctx, game);

    drawPlayer(ctx, game.player);
    drawFx(ctx, game);

    if (debug.showBoxes) {
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#ff00cc';
      G.Physics.allBodies(game.engine).forEach(function (b) { poly(ctx, b.vertices); ctx.stroke(); });
    }
    ctx.restore();
  }

  // 색 잉크 선: 색 + 색각 보조 무늬 (빨강=작은 동그라미, 파랑=진행 방향 화살, 초록=가로지르는 눈금). pending 이면 점선
  function drawInkLine(ctx, pts, color, pending) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = G.DATA.ink.thickness; ctx.strokeStyle = C[color] || C.ink;
    ctx.setLineDash(pending ? [14, 10] : []);
    path(ctx, pts); ctx.stroke();
    ctx.setLineDash([]);
    if (pending) return;
    var gap = color === 'green' ? 14 : 22, acc = gap / 2;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy);
      if (!len) continue;
      var ux = dx / len, uy = dy / len;
      while (acc <= len) {
        var x = a.x + ux * acc, y = a.y + uy * acc;
        ctx.beginPath();
        if (color === 'red') { ctx.arc(x, y, 2, 0, 6.283); ctx.fill(); }
        else if (color === 'blue') { ctx.moveTo(x - ux * 3 - uy * 3, y - uy * 3 + ux * 3); ctx.lineTo(x + ux * 2, y + uy * 2); ctx.lineTo(x - ux * 3 + uy * 3, y - uy * 3 - ux * 3); ctx.stroke(); }
        else { ctx.moveTo(x - uy * 3, y + ux * 3); ctx.lineTo(x + uy * 3, y - ux * 3); ctx.stroke(); }
        acc += gap;
      }
      acc -= len;
    }
  }

  // 투사체: proj 이미지, 없으면 보라색 가시 공
  function drawProjectiles(ctx, game) {
    var r = G.DATA.projectile.radius, img = G.Assets.get('proj');
    game.projs.forEach(function (q) {
      if (img) { ctx.drawImage(img, q.x - r * 1.6, q.y - r * 1.6, r * 3.2, r * 3.2); return; }
      ctx.beginPath();
      for (var i = 0; i < 16; i++) {
        var a = i / 16 * 6.283, rr = i % 2 ? r * 0.75 : r * 1.15;
        ctx[i ? 'lineTo' : 'moveTo'](q.x + Math.cos(a) * rr, q.y + Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fillStyle = '#5A2D6E'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = C.outline; ctx.stroke();
    });
  }

  // 튕김(fx_bounce)·가속(fx_boost)·막기(fx_block) 효과. 이미지 없으면 코드로 짧은 선 몇 개
  function drawInkFx(ctx, game, f) {
    var t = (game.timeMs - f.t) / G.DATA.art.fx.inkMs;
    if (t < 0 || t >= 1) return;
    var img = G.Assets.get('fx_' + f.type), i;
    ctx.save(); ctx.globalAlpha = 1 - t * t;
    if (img) {
      var w = f.type === 'block' ? 90 : 110, h = f.type === 'block' ? 90 : 55;
      ctx.translate(f.x, f.y); if (f.dir < 0) ctx.scale(-1, 1);
      ctx.drawImage(img, -w / 2, -h * (f.type === 'block' ? 0.5 : 0.9), w, h);
      ctx.restore(); return;
    }
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    var k = 14 + t * 22;
    if (f.type === 'bounce') {
      ctx.strokeStyle = C.red;
      for (i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(f.x + i * 12, f.y - 4); ctx.lineTo(f.x + i * 22, f.y - 4 - k); ctx.stroke(); }
    } else if (f.type === 'boost') {
      ctx.strokeStyle = C.blue;
      for (i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(f.x - f.dir * (20 + k), f.y - 10 - i * 12); ctx.lineTo(f.x - f.dir * 20, f.y - 10 - i * 12); ctx.stroke(); }
    } else {
      ctx.strokeStyle = C.green;
      for (i = 0; i < 6; i++) { var a = i / 6 * 6.283; ctx.beginPath(); ctx.moveTo(f.x + Math.cos(a) * 6, f.y + Math.sin(a) * 6); ctx.lineTo(f.x + Math.cos(a) * k, f.y + Math.sin(a) * k); ctx.stroke(); }
    }
    ctx.restore();
  }

  // 짧은 효과: 별 반짝(fx_star_pop, 커지며 사라짐), 착지 먼지(fx_land, 옆으로 퍼지며 사라짐). 이미지 없으면 생략
  function drawFx(ctx, game) {
    var F = G.DATA.art.fx;
    game.fx.forEach(function (f) {
      if (f.type === 'bounce' || f.type === 'boost' || f.type === 'block') { drawInkFx(ctx, game, f); return; }
      var star = f.type === 'star', img = G.Assets.get(star ? 'fx_star_pop' : 'fx_land');
      var t = (game.timeMs - f.t) / (star ? F.starPopMs : F.landMs);
      if (!img || t < 0 || t >= 1) return;
      ctx.save();
      ctx.globalAlpha = 1 - t * t;
      if (star) { var s = 70 + t * 70; ctx.drawImage(img, f.x - s / 2, f.y - s / 2, s, s); }
      else { var w = 70 + t * 50, h = w / 2; ctx.drawImage(img, f.x - w / 2, f.y - h * 0.75, w, h); }
      ctx.restore();
    });
  }

  // 상태별 캐릭터 그림: 공중에서 올라가면 char_jump, 떨어지면 char_fall, 달리면 char_run, 아니면 char_idle
  function playerImage(pl) {
    var v = pl.body.velocity, A = G.DATA.art, get = G.Assets.get.bind(G.Assets);
    if (!pl.grounded && v.y < -A.airVy) return get('char_jump') || get('char_idle');
    if (!pl.grounded && v.y > A.airVy) return get('char_fall') || get('char_idle');
    return (Math.abs(v.x) > 1 && get('char_run')) || get('char_idle');
  }

  function drawPlayer(ctx, pl) {
    var b = pl.body, r = G.DATA.player.radius, v = b.velocity;
    var stretch = Math.max(-0.25, Math.min(0.25, -v.y * 0.03));   // 위로 갈 때 늘어남, 떨어질 때 눌림
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.scale((1 - stretch * 0.6) * pl.dir, 1 + stretch);     // dir -1 이면 좌우 반전 (눈이 가는 쪽)
    var img = playerImage(pl);
    if (img) {                                    // 이미지 바닥을 몸 바닥에 맞춘다
      var s = r * G.DATA.art.charSize;
      ctx.drawImage(img, -s / 2, r - s, s, s);
      ctx.restore();
      return;
    }
    ctx.beginPath();                                            // 물방울: 원 + 위쪽 뾰족
    ctx.moveTo(0, -r * 1.45);
    ctx.quadraticCurveTo(r * 0.9, -r * 0.6, r, 0);
    ctx.arc(0, 0, r, 0, Math.PI);
    ctx.quadraticCurveTo(-r * 0.9, -r * 0.6, 0, -r * 1.45);
    ctx.fillStyle = C.player; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = C.outline; ctx.stroke();
    ctx.fillStyle = C.outline;
    ctx.beginPath(); ctx.arc(r * 0.15, -r * 0.2, 3.5, 0, 6.283); ctx.arc(r * 0.6, -r * 0.2, 3.5, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  function drawHUD(ctx, game) {
    var D = G.DATA;
    ctx.fillStyle = 'rgba(243,233,210,0.92)';
    ctx.fillRect(0, 0, V.w, 56);
    ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 56); ctx.lineTo(V.w, 56); ctx.stroke();

    ctx.fillStyle = C.outline; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('잉크', 20, 35);
    var gx = 70, gw = 320, ratio = Math.max(0, game.ink / game.inkMax);
    var frame = G.Assets.get('ui_gauge_frame');
    if (frame) {                                  // 유리관 이미지 (안쪽 투명) → 채움을 먼저, 틀을 위에
      ctx.fillStyle = ratio > 0 ? 'rgba(43,33,24,0.85)' : '#999';
      ctx.fillRect(gx + 4, 15, (gw - 8) * ratio, 26);
      ctx.drawImage(frame, gx - 6, 7, gw + 12, 44);
    } else {
      ctx.strokeRect(gx, 18, gw, 22);
      ctx.fillStyle = ratio > 0 ? C.ink : '#999';
      ctx.fillRect(gx + 2, 20, (gw - 4) * ratio, 18);
    }
    ctx.fillStyle = game.draining ? C.red : C.outline; ctx.font = '15px sans-serif';   // 웅덩이에서 줄어드는 중이면 빨강
    ctx.fillText(Math.round(game.ink) + ' / ' + game.inkMax, gx + gw + 10, 35);

    // 정지 횟수 아이콘
    ctx.fillStyle = C.outline; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('정지', 520, 35);
    var stopImg = G.Assets.get('ui_stop_on');
    for (var i = 0; i < game.stops.max; i++) {
      var on = i < game.stops.left, cx = 580 + i * 36;
      if (stopImg) {                              // 쓴 정지는 흐리게
        ctx.globalAlpha = on ? 1 : 0.22;
        ctx.drawImage(stopImg, cx - 17, 11, 34, 34);
        ctx.globalAlpha = 1;
        continue;
      }
      ctx.beginPath(); ctx.arc(cx, 29, 13, 0, 6.283);
      ctx.fillStyle = on ? C.star : 'rgba(43,33,24,0.12)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = on ? C.outline : 'rgba(43,33,24,0.35)'; ctx.stroke();
      ctx.fillStyle = on ? C.outline : 'rgba(43,33,24,0.35)';
      ctx.fillRect(cx - 5, 22, 3.5, 14); ctx.fillRect(cx + 1.5, 22, 3.5, 14);
    }
    if (game.stops.left === 0) {
      ctx.fillStyle = C.red; ctx.font = 'bold 15px sans-serif';
      ctx.fillText('남은 정지 없음', 580 + game.stops.max * 36, 35);
    }

    // 별
    var total = game.level.stars.length;
    for (var k = 0; k < total; k++) {
      ctx.save(); ctx.globalAlpha = game.level.stars[k].got ? 1 : 0.25;
      G.Props.draw(ctx, { type: 'star', x: 790 + k * 30, y: 28, size: 28 });
      ctx.restore();
    }

    ctx.fillStyle = C.outline; ctx.font = '15px sans-serif';
    ctx.textAlign = 'right';
    var lv = game.level.data;
    var prog = Math.max(0, Math.min(1, (game.player.body.position.x - lv.start.x) / (lv.goal.x - lv.start.x)));
    var sec = (game.timeMs / 1000).toFixed(1);
    ctx.fillText(lv.name + '  ·  ' + game.mode.name.slice(0, 1) + '  ·  ' + game.attempt + '번째  ·  ' + sec + '/' + lv.rate.timeSec + '초  ·  ' + Math.round(prog * 100) + '%', V.w - 20, 35);
    ctx.textAlign = 'left';
  }

  // 아래 잉크 병 선반 (사용자 결정 2026-10-19: 병 클릭 / 휠 / 1·2·3 으로 색 고르기). 이 구간에서 못 쓰는 색은 흐리게 "잠김"
  function shelfSlots() {
    var S = G.DATA.art.shelf;
    return G.DATA.inks.order.map(function (c, i) {
      return { color: c, key: i + 1, x: S.x + i * S.slot, y: V.h - S.h, w: S.slot - 8, h: S.h };
    });
  }
  // 화면 좌표(sx, sy)가 병 위면 그 색, 아니면 null
  function inkAt(sx, sy) {
    var hit = null;
    shelfSlots().forEach(function (b) { if (sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h) hit = b.color; });
    return hit;
  }

  function drawShelf(ctx, game) {
    var S = G.DATA.art.shelf, slots = shelfSlots(), allowed = game.level.data.inks;
    var shelfW = S.x * 2 + slots.length * S.slot - 8, shelfImg = G.Assets.get('ui_shelf');
    if (shelfImg) ctx.drawImage(shelfImg, 0, V.h - 30, shelfW + 10, 30);
    else {
      ctx.fillStyle = '#B07A45'; ctx.fillRect(4, V.h - 16, shelfW, 12);
      ctx.strokeStyle = C.outline; ctx.lineWidth = 2.5; ctx.strokeRect(4, V.h - 16, shelfW, 12);
    }
    var sel = G.Assets.get('ink_select');
    slots.forEach(function (b) {
      var on = allowed.indexOf(b.color) >= 0, picked = game.color === b.color;
      var img = G.Assets.get('ink_' + b.color), bw = S.bottle * 0.75, bh = S.bottle;
      var cx = b.x + b.w / 2, by = V.h - 16 - bh;
      if (picked) {                                // 고른 병: 뾰족한 외곽선 (색각 보조: 색이 아니라 모양으로도 구분)
        if (sel) ctx.drawImage(sel, cx - bw * 0.75, by - 10, bw * 1.5, bh + 20);
        else {
          ctx.beginPath();
          for (var i = 0; i < 20; i++) {
            var a = i / 20 * 6.283, rr = i % 2 ? 0.86 : 1;
            ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * bw * 0.85 * rr, by + bh / 2 + Math.sin(a) * bh * 0.62 * rr);
          }
          ctx.closePath(); ctx.fillStyle = 'rgba(245,197,24,0.35)'; ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = C.outline; ctx.stroke();
        }
      }
      ctx.save(); ctx.globalAlpha = on ? 1 : 0.25;
      if (img) ctx.drawImage(img, cx - bw / 2, by, bw, bh);
      else {
        ctx.fillStyle = C[b.color]; ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(cx - bw / 2, by + bh * 0.25, bw, bh * 0.75, 8); else ctx.rect(cx - bw / 2, by + bh * 0.25, bw, bh * 0.75);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#C9A26B'; ctx.fillRect(cx - bw * 0.2, by + bh * 0.08, bw * 0.4, bh * 0.17); ctx.strokeRect(cx - bw * 0.2, by + bh * 0.08, bw * 0.4, bh * 0.17);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;   // 병 라벨 무늬 (선 무늬와 같음)
        var ly = by + bh * 0.62;
        ctx.beginPath();
        if (b.color === 'red') { ctx.arc(cx - 7, ly, 3, 0, 6.283); ctx.arc(cx + 7, ly, 3, 0, 6.283); ctx.fill(); }
        else if (b.color === 'blue') { ctx.moveTo(cx - 8, ly - 7); ctx.lineTo(cx + 4, ly); ctx.lineTo(cx - 8, ly + 7); ctx.stroke(); }
        else { for (var j = -1; j <= 1; j++) { ctx.moveTo(cx + j * 7, ly - 7); ctx.lineTo(cx + j * 7, ly + 7); } ctx.stroke(); }
      }
      ctx.restore();
      ctx.fillStyle = on ? C.outline : 'rgba(43,33,24,0.35)'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(on ? String(b.key) : '잠김', cx, by - 4);
      ctx.textAlign = 'left';
    });
    var cur = G.DATA.inks[game.color];
    ctx.fillStyle = C.outline; ctx.font = 'bold 15px sans-serif';
    ctx.fillText(cur ? cur.name : '', shelfW + 14, V.h - 40);
    ctx.font = '13px sans-serif'; ctx.fillStyle = 'rgba(43,33,24,0.6)';
    ctx.fillText('병 클릭 · 휠 · 1/2/3', shelfW + 14, V.h - 20);
  }

  function drawStopOverlay(ctx, game) {
    if (!game.stopped) return;
    ctx.fillStyle = C.stopTint;
    ctx.fillRect(0, 56, V.w, V.h - 56);
    ctx.strokeStyle = C.blue; ctx.lineWidth = 6;
    ctx.strokeRect(3, 59, V.w - 6, V.h - 62);
    ctx.fillStyle = C.blue; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    var label = game.mode.scale > 0 ? '슬로 모션' : '정지';
    ctx.fillText(label + ' 중 — 드래그로 선 그리기 · Shift/우클릭으로 재생', V.w / 2, 92);
    if (game.mode.limitMs > 0) {
      var left = Math.max(0, 1 - game.stoppedMs / game.mode.limitMs), bw = 400;
      ctx.strokeStyle = C.blue; ctx.lineWidth = 2;
      ctx.strokeRect(V.w / 2 - bw / 2, 104, bw, 12);
      ctx.fillRect(V.w / 2 - bw / 2, 104, bw * left, 12);
      ctx.fillText(((game.mode.limitMs - game.stoppedMs) / 1000).toFixed(1) + '초', V.w / 2 + bw / 2 + 40, 116);
    }
    ctx.textAlign = 'left';
  }

  function drawMessages(ctx, game) {
    ctx.textAlign = 'center'; ctx.font = 'bold 22px sans-serif';
    game.messages.forEach(function (m, i) {
      ctx.globalAlpha = Math.min(1, m.ms / 400);
      ctx.fillStyle = C.red;
      ctx.fillText(m.text, V.w / 2, 160 + i * 30);
    });
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function drawResult(ctx, game) {
    if (game.status === 'run') return;
    if (game.status === 'ready') {
      ctx.textAlign = 'center'; ctx.fillStyle = C.outline; ctx.font = 'bold 28px sans-serif';
      ctx.fillText('클릭 또는 Space: 출발', V.w / 2, 250);
      ctx.font = '17px sans-serif';
      ctx.fillText('R: 처음부터 · 병 클릭·휠·1/2/3: 색 고르기 · D: 디버그', V.w / 2, 285);
      ctx.textAlign = 'left';
      return;
    }
    if (game.status === 'clear' && goalFill(game) < 1.15) return;   // 물감 통이 다 차오른 뒤 결과 쪽지
    ctx.fillStyle = 'rgba(43,33,24,0.35)';
    ctx.fillRect(0, 0, V.w, V.h);
    var clear = game.status === 'clear' && game.result;
    var w = 520, h = clear ? 330 : 250, x = (V.w - w) / 2, y = (V.h - h) / 2;
    var panel = G.Assets.get('ui_panel');
    if (panel) {                                  // 종이 쪽지 (안쪽이 투명 → 종이색을 먼저 깐다)
      var px = x - 40, py = y - 30, pw = w + 80, ph = h + 60;
      var sx = pw / panel.width, sy = ph / panel.height, hull = G.DATA.art.panelHull;
      if (hull) {                                 // 안쪽이 투명한 쪽지 이미지일 때만
        ctx.beginPath();
        hull.forEach(function (p, i) { ctx[i ? 'lineTo' : 'moveTo'](px + p[0] * sx, py + p[1] * sy); });
        ctx.closePath(); ctx.fillStyle = C.paper; ctx.fill();
      }
      ctx.drawImage(panel, px, py, pw, ph);
    } else {
      ctx.fillStyle = C.paper; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = C.outline; ctx.lineWidth = 4; ctx.strokeRect(x, y, w, h);
    }
    var erased = game.status === 'fail' && G.Assets.get('char_erased');
    if (erased) ctx.drawImage(erased, x + 66, y + 22, 80, 80);
    ctx.textAlign = 'center'; ctx.fillStyle = game.status === 'clear' ? C.green : C.red;
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText(game.status === 'clear' ? '도착!' : game.failReason, V.w / 2, y + 70);
    ctx.fillStyle = C.outline;
    if (clear) {                                  // 평가: 만족한 조건 수만큼 별 (사용자 결정 2026-10-19)
      for (var k = 0; k < 3; k++) {                // 얻은 별은 채운 별, 못 얻은 별은 빈 별 (조건 0개면 빈 별 3개 = 0개 획득)
        var sx0 = V.w / 2 + (k - 1) * 56, sy0 = y + 112;
        if (k < game.result.stars) G.Props.draw(ctx, { type: 'star', x: sx0, y: sy0, size: 50 });
        else {
          G.Props.drawStarShape(ctx, sx0, sy0, 25);
          ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(43,33,24,0.35)'; ctx.stroke();
        }
      }
      ctx.font = '18px sans-serif'; ctx.fillStyle = C.outline;
      game.result.checks.forEach(function (c, i) {
        ctx.fillStyle = c.ok ? C.green : 'rgba(43,33,24,0.45)';
        ctx.fillText((c.ok ? '✓ ' : '✗ ') + c.label, V.w / 2, y + 162 + i * 26);
      });
      ctx.fillStyle = C.outline; ctx.font = '15px sans-serif';
      var best = game.best ? ' · 최고 기록 별 ' + game.best.stars + '개 · ' + (game.best.bestMs / 1000).toFixed(1) + '초' : '';
      ctx.fillText((game.timeMs / 1000).toFixed(1) + '초' + best, V.w / 2, y + 252);
    } else {
      ctx.font = '20px sans-serif';
      ctx.fillText('수집 별 ' + G.Game.starsGot(game) + ' / ' + game.level.stars.length + ' · ' + game.attempt + '번째 시도', V.w / 2, y + 125);
      ctx.fillText((game.timeMs / 1000).toFixed(1) + '초 · ' + game.mode.name, V.w / 2, y + 158);
    }
    ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = C.outline;
    ctx.fillText('R 또는 클릭: 다시 하기' + (game.status === 'clear' && game.hasNext ? ' · N: 다음 구간' : ''), V.w / 2, y + h - (clear ? 42 : 30));
    ctx.textAlign = 'left';
  }

  function render(ctx, game, debug) {
    updateCamera(game);
    drawBackground(ctx, game.level.data.bg, cam.x);
    drawWorld(ctx, game, debug);
    drawStopOverlay(ctx, game);
    drawHUD(ctx, game);
    drawShelf(ctx, game);
    drawMessages(ctx, game);
    drawResult(ctx, game);
  }

  return { render: render, toWorld: toWorld, cam: cam, drawBackground: drawBackground, drawGoal: drawGoal, drawStart: drawStart,
           inkAt: inkAt, drawInkLine: drawInkLine };
})();

</script>
<script>
// debug.js
// 디버그 패널 (D키): 구간 선택, 시간 배율 전환, 정지 횟수 충전, 충돌 박스 표시, FPS, 모드별 기록
var G = G || {};

G.Debug = {
  state: { open: false, showBoxes: false, fps: 0 },
  el: null,

  init: function (app) {
    var el = document.createElement('div');
    el.id = 'debug';
    el.style.display = 'none';
    document.body.appendChild(el);
    this.el = el;
    var self = this;
    el.addEventListener('click', function (e) {
      var a = e.target.getAttribute('data-act');
      if (!a) return;
      if (a.indexOf('mode:') === 0) app.setMode(a.slice(5));
      if (a === 'stops') { G.Rules.rechargeStops(app.game.stops); }
      if (a === 'ink') { app.game.ink = app.game.inkMax; }
      if (a.indexOf('level:') === 0) app.goLevel(+a.slice(6));
      if (a === 'boxes') { self.state.showBoxes = !self.state.showBoxes; }
      if (a === 'reset') { app.restart(); }
      if (a === 'clear') { app.save.stats = {}; G.Save.write(app.save); }
      if (a === 'account' && confirm('잉크 성장(먹은 잉크 병)과 구간 기록을 지울까요?')) app.resetAccount();
      self.refresh(app);
    });
    el.addEventListener('mousedown', function (e) { e.stopPropagation(); });
  },

  toggle: function (app) {
    this.state.open = !this.state.open;
    this.el.style.display = this.state.open ? 'block' : 'none';
    this.refresh(app);
  },

  // FPS 숫자만 바꾼다 (패널 전체를 다시 만들면 버튼 클릭이 씹힐 수 있음)
  tick: function () {
    var f = this.state.open && document.getElementById('dbg-fps');
    if (f) f.textContent = this.state.fps;
  },

  refresh: function (app) {
    if (!this.state.open) return;
    var g = app.game, s = this.state, modes = G.DATA.timeModes;
    var html = '<b>디버그 (D로 닫기)</b>';
    html += '<div>FPS <span id="dbg-fps">' + s.fps + '</span> · 시드 ' + G.DATA.seed + '</div>';
    html += '<div class="row">구간' + (app.testMode ? ' (레벨 툴 테스트)' : '') + '</div><div class="row">';
    app.levels.forEach(function (lv, i) {
      html += '<button data-act="level:' + i + '"' + (app.levelIndex === i ? ' class="on"' : '') + '>' + lv.name + '</button>';
    });
    html += '</div><div class="row">시간 정지 방식 (A 확정 · 비교용 Q/W/E)</div><div class="row">';
    Object.keys(modes).forEach(function (k) {
      html += '<button data-act="mode:' + k + '"' + (g.modeKey === k ? ' class="on"' : '') + '>' + modes[k].name + '</button>';
    });
    html += '</div><div class="row">';
    html += '<button data-act="stops">정지 횟수 충전</button>';
    html += '<button data-act="ink">잉크 충전</button>';
    html += '<button data-act="boxes"' + (s.showBoxes ? ' class="on"' : '') + '>충돌 박스</button>';
    html += '<button data-act="reset">구간 다시 (R)</button>';
    html += '</div><div class="row">모드별 기록 (이 브라우저에 저장)</div>';
    html += '<table><tr><th>모드</th><th>시도</th><th>도착</th><th>실패</th><th>평균 정지</th></tr>';
    Object.keys(modes).forEach(function (k) {
      var st = app.save.stats[k] || { tries: 0, clears: 0, fails: 0, stopsUsed: 0 };
      var avg = st.tries ? (st.stopsUsed / st.tries).toFixed(1) : '-';
      html += '<tr><td>' + k + '</td><td>' + st.tries + '</td><td>' + st.clears + '</td><td>' + st.fails + '</td><td>' + avg + '</td></tr>';
    });
    html += '</table><button data-act="clear">기록 지우기</button>';
    var acc = app.account || app.save, rec = acc.records[g.level.data.id];
    html += '<div class="row">계정' + (app.testMode ? ' (테스트: 저장 안 됨)' : '') + ': 잉크 최대량 +' + (acc.inkBonus || 0) +
      ' (먹은 병 ' + Object.keys(acc.bottles || {}).length + '개)' +
      (rec ? ' · 이 구간 최고 별 ' + rec.stars + '개, ' + rec.clears + '/' + rec.tries + '번 성공' : '') + '</div>';
    html += '<button data-act="account">계정 초기화 (잉크 성장·구간 기록)</button>';
    this.el.innerHTML = html;
  }
};

</script>
<script>
// main.js
// 시작점: 캔버스, 입력, 고정 타임스텝 루프
var G = G || {};

(function () {
  var D = G.DATA;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  G.Assets.load();
  canvas.width = D.view.w;
  canvas.height = D.view.h;

  var app = {
    save: G.Save.load(),
    game: null,
    // 시간 정지 방식은 A로 확정 (사용자 결정 2026-10-19). B·C 는 비교용으로 Q/W/E, 저장하지 않음
    setMode: function (k) {
      if (!D.timeModes[k]) return;
      G.Game.setMode(app.game, k);
      app.restart();
      app.game.toast(D.timeModes[k].name + ' (구간 다시 시작)');
    },
    restart: function () { G.Game.reset(app.game); },
    // 구간 목록: 보통은 levels.js, 레벨 툴의 "테스트 플레이"는 주소 #test= 로 구간 하나를 넘겨준다
    levels: G.LEVELS,
    levelIndex: 0,
    testMode: false,
    goLevel: function (i) {
      if (!app.levels[i]) return;
      app.levelIndex = i;
      G.Game.setLevel(app.game, app.levels[i]);
      app.game.hasNext = !!app.levels[i + 1];
      G.Debug.refresh(app);
    }
  };
  var m = /#test=(.+)$/.exec(location.hash);
  if (m) {
    try { app.levels = [JSON.parse(decodeURIComponent(m[1]))]; app.testMode = true; } catch (e) { /* 잘못된 주소면 무시 */ }
  }
  // 계정: 잉크 성장(inkBonus·먹은 병)과 구간 기록. 레벨 툴 테스트는 계정을 건드리지 않게 복사본으로 (저장 안 함)
  app.account = app.testMode ? JSON.parse(JSON.stringify(app.save)) : app.save;
  app.game = G.Game.create(D.defaultTimeMode, app.levels[0], app.account);
  app.game.hasNext = !!app.levels[1];
  if (app.testMode) app.game.toast('레벨 툴 테스트 플레이: ' + app.levels[0].name + ' (계정에 저장 안 됨)');
  function persist() { if (!app.testMode) G.Save.write(app.save); }
  app.game.onAccountChange = function () { persist(); G.Debug.refresh(app); };
  app.game.onFinish = function (g) {
    var st = app.save.stats[g.modeKey] || (app.save.stats[g.modeKey] = { tries: 0, clears: 0, fails: 0, stopsUsed: 0 });
    st.tries += 1;
    st[g.status === 'clear' ? 'clears' : 'fails'] += 1;
    st.stopsUsed += g.stopsUsedThisRun;
    var id = g.level.data.id, rec = app.account.records[id] || (app.account.records[id] = { stars: 0, bestMs: 0, clears: 0, tries: 0 });
    rec.tries += 1;
    if (g.status === 'clear' && g.result) {       // 구간 최고 기록 (별 많은 것 우선, 같으면 빠른 시간)
      rec.clears += 1;
      if (g.result.stars > rec.stars || (g.result.stars === rec.stars && (!rec.bestMs || g.timeMs < rec.bestMs))) {
        rec.stars = g.result.stars; rec.bestMs = Math.round(g.timeMs);
      }
    }
    g.best = rec.clears ? rec : null;
    persist();
    G.Debug.refresh(app);
  };
  // 계정 초기화 (잉크 성장·먹은 병·구간 기록). 시간 정지 방식 설정과 모드별 기록은 남김
  app.resetAccount = function () {
    app.account.inkBonus = 0; app.account.bottles = {}; app.account.records = {};
    persist();
    app.restart();
    app.game.toast('계정 초기화: 잉크 성장·기록을 지웠어요');
  };
  G.Debug.init(app);
  G.app = app;

  // ---- 입력 ----
  function mouseWorld(e) {
    var r = canvas.getBoundingClientRect();
    var sx = (e.clientX - r.left) * D.view.w / r.width;
    var sy = (e.clientY - r.top) * D.view.h / r.height;
    return G.UI.toWorld(sx, sy);
  }

  window.addEventListener('keydown', function (e) {
    var g = app.game;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); G.Game.start(g); return; }
    if (e.key === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { if (!e.repeat) G.Game.toggleStop(g); }
    else if (e.code === 'KeyR') { app.restart(); }
    else if (e.code === 'KeyN') { if (g.status === 'clear' && g.hasNext) app.goLevel(app.levelIndex + 1); }
    else if (e.code === 'KeyD') { G.Debug.toggle(app); }
    else if (e.code === 'KeyQ') app.setMode('A');          // 정지 방식 비교용 (1/2/3 에서 옮김, 사용자 결정 2026-10-19)
    else if (e.code === 'KeyW') app.setMode('B');
    else if (e.code === 'KeyE') app.setMode('C');
    else if (e.key === '1' || e.key === '2' || e.key === '3') G.Game.setColor(g, D.inks.order[+e.key - 1]);   // 색 고르기
  });

  function mouseScreen(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * D.view.w / r.width, y: (e.clientY - r.top) * D.view.h / r.height };
  }

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  canvas.addEventListener('wheel', function (e) {        // 휠: 쓸 수 있는 색 안에서 다음/이전
    e.preventDefault();
    if (e.deltaY) G.Game.cycleColor(app.game, e.deltaY > 0 ? 1 : -1);
  }, { passive: false });
  canvas.addEventListener('mousedown', function (e) {
    var g = app.game;
    if (e.button === 2) { G.Game.toggleStop(g); return; }
    if (e.button !== 0) return;
    var sp = mouseScreen(e), bottle = G.UI.inkAt(sp.x, sp.y);
    if (bottle && g.status !== 'clear' && g.status !== 'fail') { G.Game.setColor(g, bottle); return; }   // 아래 병 클릭: 색 고르기
    if (g.status === 'ready') { G.Game.start(g); return; }
    if (g.status !== 'run') { app.restart(); return; }
    if (g.ink <= 0) { g.toast('잉크가 없어요'); return; }
    G.Draw.begin(g, mouseWorld(e));
  });
  window.addEventListener('mousemove', function (e) { if (app.game.stroke) G.Draw.move(app.game, mouseWorld(e)); });
  window.addEventListener('mouseup', function (e) { if (e.button === 0) G.Draw.end(app.game); });

  // ---- 루프 (고정 타임스텝) ----
  var last = performance.now(), acc = 0, frames = 0, fpsT = 0;
  function frame(now) {
    var dt = Math.min(250, now - last);
    last = now;
    acc += dt;
    var n = 0;
    while (acc >= D.loop.stepMs && n < D.loop.maxStepsPerFrame) {
      G.Game.update(app.game, D.loop.stepMs);
      acc -= D.loop.stepMs;
      n++;
    }
    if (n === D.loop.maxStepsPerFrame) acc = 0;   // 너무 밀리면 버린다 (탭 전환 등)
    G.UI.render(ctx, app.game, G.Debug.state);

    frames++; fpsT += dt;
    if (fpsT >= 500) {
      G.Debug.state.fps = Math.round(frames * 1000 / fpsT);
      frames = 0; fpsT = 0;
      G.Debug.tick();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
